n đủ khổ, lệnh tự dịch ảnh tối thiểu (chừa lề an toàn) rồi cắt lại ảnh theo biên mới. IMAGECLIP của AutoCAD không cho kéo biên ra ngoài ảnh, nên cần dịch chính tấm ảnh.", "steps": ["Chỉnh polyline viên (kéo to, sửa đỉnh) theo hình biên mới mong muốn.", "Chạy SDMOANH, đặt lề an toàn (mm), quét chọn các polyline đã chỉnh.", "Lệnh ghép từng polyline với ảnh viên (theo tâm viên ghi lúc SDANHDA); ảnh cũ không có dữ liệu này thì lệnh hỏi chọn ảnh bằng tay."], "result": "Ảnh được dịch (nếu cần) và cắt lại theo biên mới; dòng lệnh báo số viên đã cắt lại, số viên phải dịch ảnh, số viên hết khổ (biên lớn hơn cả tấm đá) và số viên không tìm thấy ảnh.", "note": "Lưu ý: Dịch ảnh làm vân đá trong viên đó đổi đi vài mm đến vài chục mm so với viên bên cạnh, vân liên tục có thể lệch. Ảnh viên cũ (trước 2.20.0) chưa có dữ liệu ghép nên phải chọn bằng tay. Từ 2.27.0, khi biên lớn hơn tấm đá theo chiều vân hiện tại, lệnh thử xoay ảnh 90° quanh tâm viên (ô Hết khổ: Hỏi / Tự xoay / Tắt, cùng cài đặt với SDTUDONG); vân đổi chiều so với viên kề, chỉ áp cho ảnh riêng từng viên, không áp cho lưới chung.", "aliases": ["MOA"], "kw": ""}, {"code": "SDRON", "alias": "DRN", "group": "Ốp lát đá granite / gạch", "title": "Đổi ron giữa các viên: hatch và ảnh tự theo", "summary": "Đổi bề rộng ron (mạch) giữa các viên mà không phải sửa tay: lệnh thu hoặc phóng các polyline viên tại chỗ (mỗi cạnh dịch nửa độ chênh ron), cập nhật các hatch vân đá đã liên kết với biên và cắt lại ảnh IMAGECLIP theo biên mới (có dịch ảnh nếu cần để đủ khổ).", "steps": ["Quét chọn các polyline viên cần đổi ron.", "Nhập ron hiện tại và ron mới (mm). Ron mới lớn hơn thì viên thu lại, nhỏ hơn thì viên phóng ra.", "Chọn có cập nhật hatch và cắt lại ảnh hay không."], "result": "Polyline viên đổi kích thước tại chỗ (giữ layer, dữ liệu SD_TILE, mã viên); hatch liên kết tự cập nhật; ảnh cắt lại theo biên mới. Dòng lệnh báo số viên đã đổi, số viên không đổi được, số ảnh đã cắt lại, hết khổ và số hatch chưa liên kết.", "note": "Lưu ý: Ron hiện tại được nhớ sau mỗi lần đổi nên lần sau chỉ cần nhập ron mới; Enter ở bước chọn là chọn tất cả viên trên layer SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC. Đặt ron mới bằng ron hiện tại thì lệnh không đổi kích thước viên mà chỉ đồng bộ ảnh và hatch theo biên hiện tại (dùng sau khi sửa biên bằng tay). Hatch tạo bằng SDVANDA từ 2.20.0 liên kết với biên nên tự theo; hatch tạo từ bản cũ không liên kết, chạy lại SDVANDA. Viên rất nhỏ hoặc lõm mạnh có thể không thu được. Ron phóng ra quá thì viên chồng lên nhau, kiểm tra lại mặt bằng. Ron ghi trên bản vẽ là tham số vẽ, không thay mạch thật ngoài công trình.", "aliases": ["DRN"], "kw": ""}, {"code": "SDVAN", "alias": "LTV", "group": "Ốp lát đá granite / gạch", "title": "Kiểm tra vân đá liên tục giữa các viên kề nhau", "summary": "Kiểm tra vân đá có liên tục giữa các viên kề nhau không, dựa trên vị trí mỗi viên được cắt trên tấm đá thô (SDANHDA ghi lại tấm số mấy, vị trí và hướng xoay). Hai viên kề nhau coi là liền vân khi cùng một tấm, cùng hướng và vị trí tương đối trên tấm khớp với vị trí tương đối trên bản vẽ (sai số cho phép đặt được).", "steps": ["Chạy SDANHDA trước (cách xếp Theo thứ tự lát hoặc Chạy dọc đường viền cho vân liền nhiều nhất).", "Chạy SDVAN, đặt khoảng cách ron tối đa giữa hai viên kề nhau và sai số vị trí cho phép; quét chọn các polyline viên.", "Xem số mối nối liền vân, mối nối đứt theo lý do, khoanh đỏ trên layer SD-KIEMTRA và file _KiemTraVan.csv."], "result": "Dòng lệnh báo tỷ lệ mối nối liền vân và đếm theo lý do (khác tấm đá, khác hướng vân, lệch vị trí trên tấm, không có dữ liệu cắt); khoanh đỏ tại các mối nối đứt; CSV liệt kê từng cặp viên.", "note": "Lưu ý: Chỉ dùng dữ liệu của lần SDANHDA gần nhất. Dùng để so sánh các cách xếp (Toiuu ra ít tấm nhất nhưng vân đứt nhiều; Thutu giữ vân tốt hơn). Từ 2.57.0: tích \"Ghép vân đối xứng (bookmatch)\" để kiểm hai viên kề nhau có cắt từ hai tấm liên tiếp (số tấm hơn kém 1), cùng hướng và cùng vị trí trên tấm; chỉ kiểm quan hệ vị trí này, không so hình ảnh vân.", "aliases": ["LTV"], "kw": ""}, {"code": "SDDIEMBD", "alias": "DBT", "group": "Ốp lát đá granite / gạch", "title": "So sánh điểm bắt đầu rải lưới viên", "summary": "So sánh các điểm bắt đầu rải lưới viên trong một vùng lát (có thể có lỗ / cột): 4 góc, tâm viên ở tâm, mạch ở tâm (chế độ Kỹ thêm 25 điểm quét trong một chu kỳ lưới). Với mỗi điểm lệnh đếm số viên nguyên, viên cắt, viên cắt hẹp hơn ngưỡng, cạnh hẹp nhất và hao hụt, rồi xếp hạng: ít viên hẹp nhất, ít viên cắt nhất, ít hao hụt nhất.", "steps": ["Nhập kích thước viên, ron, hướng lưới (theo trục, theo cạnh dài nhất, hoặc nhập góc), ngưỡng viên hẹp, độ kỹ.", "Chọn polyline kín là biên vùng lát, rồi quét chọn các lỗ / cột (Enter nếu không có).", "Xem bảng xếp hạng, điểm tốt nhất được khoanh trên bản vẽ (layer SD-DIEMBD); dùng điểm đó làm điểm bắt đầu trong SDRAITAM / SDGACH."], "result": "Bảng tối đa 8 điểm tốt nhất trên dòng lệnh (nguyên, cắt, cắt hẹp, cạnh hẹp nhất, hao hụt %); vòng tròn và nhãn tại điểm tốt nhất.", "note": "Lưu ý: Chỉ xét lưới viên thẳng (không so le, xương cá). Từ 2.57.0: ô \"Khe sát tường\" lùi biên vào (lỗ / cột nở ra) trước khi đánh giá điểm bắt đầu. Hao hụt = phần viên cắt không dùng / tổng diện tích viên. Vùng lớn, chế độ Kỹ có thể chạy vài chục giây.", "aliases": ["DBT"], "kw": ""}, {"code": "SDKHEGIAN", "alias": "KCG", "group": "Ốp lát đá granite / gạch", "title": "Khe co giãn: sát tường và phân vùng", "summary": "Vẽ khe co giãn cho vùng lát: khe sát tường (lùi vào theo biên) và khe phân vùng chia đều sao cho khoảng cách giữa các khe không vượt giá trị tối đa; có thể căn khe vào giữa ron của lưới viên. Khe phân vùng được cắt theo biên và tránh lỗ / cột.", "steps": ["Nhập khe sát tường, khoảng cách tối đa giữa các khe, bề rộng khe, kích thước viên và ron (nếu cần căn vào ron).", "Chọn polyline kín là biên vùng lát và các lỗ / cột."], "result": "Polyline khe trên layer SD-KHE (khe phân vùng có bề rộng nét bằng bề rộng khe); dòng lệnh báo số khe, tổng chiều dài và số ô phân vùng.", "note": "Lưu ý: Khe phân vùng là các đường thẳng theo trục X, Y qua cả vùng, chưa tính khe theo hình dạng riêng. Khoảng cách tối đa mặc định 6000 mm chỉ là giá trị khởi đầu, đặt theo quy định vật liệu và vị trí (trong nhà, ngoài trời, sàn có sưởi).", "aliases": ["KCG"], "kw": ""}, {"code": "SDTHOATNUOC", "alias": "PTN", "group": "Ốp lát đá granite / gạch", "title": "Phễu thu nước và dốc sàn", "summary": "Đặt phễu thu nước và kiểm tra dốc sàn: nhập độ dốc (%), chọn vị trí các phễu; lệnh tính điểm xa phễu nhất, độ chênh cao giữa điểm đó và miệng phễu, ghi cao độ tương đối tại các đỉnh biên, khoanh vòng quanh phễu cho vùng viên cắt chéo.", "steps": ["Nhập độ dốc, bán kính khoanh quanh phễu, chênh cao tối đa cho phép (mm).", "Chọn polyline kín là biên vùng lát.", "Chọn vị trí các phễu thu nước (Enter khi xong)."], "result": "Vòng tròn phễu và nhãn trên layer SD-THOATNUOC, nhãn cao độ tại các đỉnh biên, đường nối điểm xa nhất tới phễu gần nhất; dòng lệnh báo khoảng cách, chênh cao và cảnh báo nếu vượt mức cho phép.", "note": "Lưu ý: Chỉ tính dốc phẳng hướng về phễu gần nhất, không vẽ đường đồng mức. Chênh cao tối đa 30 mm là giá trị khởi đầu của vữa lát, đặt theo thiết kế. Viên quanh phễu thường phải chia riêng, lệnh chỉ khoanh vùng chứ chưa tự chia.", "aliases": ["PTN"], "kw": ""}, {"code": "SDTUDONG", "alias": "TDO", "group": "Ốp lát đá granite / gạch", "title": "Bật / tắt tự động cắt lại ảnh khi sửa biên viên", "summary": "Bật chế độ tự động: sau khi bạn sửa biên một viên (kéo grip, stretch, move, offset tại chỗ...) lệnh tự cắt lại ảnh IMAGECLIP của viên đó theo biên mới, có dịch ảnh nếu cần để đủ khổ. Hatch liên kết với biên thì AutoCAD tự cập nhật. Trạng thái được nhớ nên lần sau mở AutoCAD và nạp ShopDrawing.lsp là tự bật lại. Chạy lại SDTUDONG để tắt.", "steps": ["Chạy SDTUDONG: lệnh gắn theo dõi vào các polyline viên trên layer SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC.", "Sửa biên viên như bình thường; khi lệnh sửa kết thúc, dòng lệnh báo đã cắt lại ảnh bao nhiêu viên.", "Chạy lại SDTUDONG để tắt (cũng nên tắt rồi bật lại sau khi thêm viên mới)."], "result": "Ảnh của viên được cắt lại theo biên mới ngay sau lệnh sửa; dòng lệnh báo số viên.", "note": "Lưu ý: Chỉ theo các viên đã có ảnh từ SDANHDA 2.20.0 trở lên (có dữ liệu SD_ANH). Từ 2.22.1 ảnh còn xoay lại theo biên mới (vân giữ đúng hướng so với cạnh dài; ảnh cũ chưa có góc xoay thì lấy góc lúc bật SDTUDONG nên cần bật trước khi sửa; viên gần vuông không tự xoay). Theo dõi chung cả bản vẽ (kể cả viên tạo thêm) và tự bật lại khi nạp ShopDrawing.lsp nếu lần trước để Bật. Không tự chạy sau các lệnh SD*, UNDO, REDO. Không tự chạy sau SDRON, SDMOANH, SDANHDA, SDRAITAM, SDDOCDA, UNDO. Dựa trên theo dõi sự kiện của AutoCAD nên chưa thử trên bản vẽ thật; nếu thấy chậm hoặc lỗi thì tắt và dùng SDMOANH.", "aliases": ["TDO"], "kw": ""}, {"code": "SDLOT", "alias": "NPH", "group": "Ốp lát đá granite / gạch", "title": "Chạy một lần cho nhiều phòng: rải viên, điểm bắt đầu tốt nhất, thống kê", "summary": "Chạy một lần cho nhiều phòng hoặc khu vực: quét chọn tất cả polyline biên (lỗ, cột nằm trong tự nhận là lỗ), nhập thông số viên một lần; lệnh gọi SDGACH cho từng vùng với cùng thông số, tự chọn điểm bắt đầu tốt nhất cho từng vùng (so sánh 6 hoặc 31 điểm như SDDIEMBD), ghi tên khu vực KV1, KV2... kèm diện tích, thống kê từng vùng và tổng (viên nguyên, viên cắt, viên cắt hẹp, hao hụt ước tính).", "steps": ["Nhập mã và tên vật liệu, kích thước viên, ron, khe sát tường, kiểu lát (Thẳng hoặc So le), góc lưới, cách chọn điểm bắt đầu (Tốt nhất, Tâm, Góc), ngưỡng viên hẹp.", "Quét chọn tất cả polyline kín của các phòng và lỗ / cột.", "Tùy chọn: cắt ảnh tấm đá và hatch vân cho tất cả viên vừa tạo (SDANHDA, SDVANDA chỉ hỏi một lần)."], "result": "Viên nguyên và viên cắt của từng vùng (layer SD-GACH, SD-GACH-CAT, có dữ liệu SD_TILE nên SDGACHTK, SDDATHO, SDGIACONG dùng được); nhãn KV; bảng thống kê trên dòng lệnh và file _LotNhieuPhong.csv.", "note": "Lưu ý: Điểm bắt đầu tốt nhất chỉ tính cho lát thẳng (so le dùng tâm vùng). Vùng nào SDGACH không chia được (biên quá hẹp, tự cắt nhau) thì bỏ qua và báo, các vùng khác vẫn chạy. Hao hụt là ước tính, chưa tính dùng chung mảnh cắt. Chưa có vân viền (vien vien) và kiểu xương cá trong chế độ lô.", "aliases": ["NPH"], "kw": "nhieu phong chay lo hang loat nhieu khu vuc"}, {"code": "SDRONIN", "alias": "IRN", "group": "Ốp lát đá granite / gạch", "title": "Cho ron / đường viền hiện ra khi in", "summary": "Cho đường ron hiện ra khi in trên đá hoặc ảnh tối. Lệnh đổi màu và bề rộng nét các layer viên (SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC) sang trắng thuần (ACI 255) hoặc đen, đặt nét in 0,25 mm (hoặc giá trị khác) và đưa polyline viên lên trên ảnh và hatch. Từ 2.25.0 SDANHDA tự gọi phần này sau khi cắt ảnh (ô Tự đặt màu ron để in). Có thể đặt màu riêng theo mã vật liệu (VD G1=Den;G2=Trang: đá sáng đường viền đen, đá tối đường viền trắng) để cả hai loại đá đều thấy ron khi in. Từ 2.26.1 lệnh cũng đặt IMAGEFRAME = 2 để khung viền đen của ảnh đá không in ra (hoặc 0 ẩn hẳn, tùy ô Khung viền); Khôi phục trả lại giá trị cũ.", "steps": ["Chạy SDRONIN, chọn màu (Trắng thuần cho đá tối, Đen cho đá sáng), bề rộng nét in, tích đưa đường viền lên trên ảnh.", "Khi in: dùng bảng nét acad.ctb (không dùng monochrome.ctb vì đổi mọi màu thành đen), tích Plot object lineweights, kiểm tra tỷ lệ in.", "Muốn trả lại màu cũ: SDRONIN, chọn Khôi phục."], "result": "Các layer viên có màu và nét mới; đường viền nằm trên ảnh; dòng lệnh nhắc cách chọn bảng nét và nét in.", "note": "Lưu ý: Ron 2 – 4 mm in tỷ lệ nhỏ (Fit to paper) chỉ còn dưới 0,2 mm trên giấy nên nét 0,25 mm mới nhìn thấy; kết hợp ô Ron của SDANHDA để chừa khe thật. Đây là chẩn đoán từ ảnh in, chưa chạy trên bản vẽ thật.", "aliases": ["IRN"], "kw": ""}, {"code": "SDVATLIEU", "alias": "VLI", "group": "Ốp lát đá granite / gạch", "title": "Vật liệu đã dùng: nhớ thông số, chọn lại nhanh", "summary": "Nhớ thông số lần trước theo từng mã vật liệu (tên, kích thước viên, dày, ron, khe sát tường, kiểu lát). Mỗi lần chạy SDGACH hoặc SDLOT, thông số vừa dùng được lưu vào bản vẽ; lần sau hiện danh sách để gõ số chọn lại, khỏi nhập từng ô. SDVATLIEU để xem và xóa bớt mục trong danh sách.", "steps": ["Chạy SDGACH hoặc SDLOT: nếu đã có vật liệu nhớ, dòng lệnh hiện danh sách đánh số (mới nhất trước).", "Gõ số để điền sẵn thông số vào hộp thoại (sửa nếu cần), hoặc Enter để nhập mới.", "Chạy SDVATLIEU để xem danh sách và nhập số cần xóa."], "result": "Hộp thoại SDGACH / SDLOT mở sẵn đúng thông số của vật liệu đã chọn; cùng mã được cập nhật theo lần dùng cuối, tối đa 12 mục.", "note": "Lưu ý: Danh sách lưu trong từng bản vẽ (không dùng chung giữa các file). Chỉ nhớ các ô cơ bản (mã, tên, W, H, dày, ron, khe, kiểu lát), chưa nhớ chiều vân hay cách xếp.", "aliases": ["VLI"], "kw": ""}, {"code": "SDXOAVIEN", "alias": "GOV", "group": "Ốp lát đá granite / gạch", "title": "Gỡ bỏ viên trong vùng chọn: xóa polyline, ảnh, hatch", "summary": "Gỡ bỏ các viên trong một vùng để lộ chi tiết nằm dưới (ví dụ mặt cắt mũi bậc). Mỗi viên là nhiều đối tượng riêng (polyline viên, ảnh IMAGECLIP, hatch vân, số hiệu T..); lệnh xóa cùng lúc cả bốn thứ của các viên trong vùng chọn, kể cả ảnh, hatch hoặc số hiệu nằm ngoài vùng quét nhưng thuộc viên đã chọn.", "steps": ["Chạy SDXOAVIEN.", "Quét cửa sổ qua vùng cần gỡ (chọn được cả viên và ảnh).", "Lệnh xóa và báo số viên; hoàn lại bằng UNDO."], "result": "Polyline viên, ảnh, hatch, số hiệu T.. của các viên trong vùng được xóa; chi tiết bên dưới lộ ra.", "note": "Lưu ý: Chỉ xóa đối tượng trên layer của ShopDrawing (SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC, SD-GACH-ANH, SD-GACH-VAN, số hiệu T.. trên SD-CHU), không đụng nét của chi tiết bên dưới. Ảnh cũ chưa có dữ liệu SD_ANH không ghép được nếu nằm ngoài vùng quét: quét rộng hơn một chút để chọn luôn ảnh.", "aliases": ["GOV"], "kw": ""}, {"code": "SDTKDA", "alias": "TKD", "group": "Ốp lát đá granite / gạch", "title": "Thống kê viên đá cắt (quét polyline)", "summary": "Quét các polyline viên đá cắt và xuất bảng thống kê: gom nhóm theo kích thước (dài × rộng, hình chữ nhật hay vát / đa giác), số lượng, diện tích 1 viên, tổng diện tích, cạnh mài (chu vi); bảng chi tiết từng viên kèm mã T.. và số tấm đá nếu đã chạy SDANHDA; xuất CSV.", "steps": ["Chọn phạm vi (quét chọn polyline, hoặc tất cả polyline kín trên layer SD-GACH / SD-GACH-CAT / SD-GACH-VIEN), dung sai gom nhóm kích thước.", "Chọn chia theo loại hatch đá (tên pattern, hatch đặc thì theo màu / layer), bỏ viên chồng nhau, có thêm bảng chi tiết và CSV.", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng thống kê theo nhóm V1, V2... (kích thước, hình dạng, SL, diện tích, tổng diện tích, cạnh mài) + dòng tổng cộng; bảng chi tiết từng viên; file _ThongKeDa.csv.", "note": "Lưu ý: Đọc trực tiếp hình học polyline nên dùng được cho cả viên tự vẽ (không cần dữ liệu SD_TILE như SDGACHTK). Từ 2.55.0: mỗi viên lấy một loại hatch (ưu tiên hatch có pattern, rồi hatch có khung bao nhỏ nhất chứa tâm viên) nên nhiều hatch chồng nhau không làm đếm trùng viên; polyline chồng đúng vị trí và diện tích chỉ tính một lần. Hatch phủ nhiều viên được nhận theo khung bao nên có thể nhận nhầm khi hatch lớn trùm cả viên khác loại. Kích thước lấy theo cạnh dài nhất của viên; viên vát (hình thang) ghi là Vát / đa giác với khung bao. Cột tấm đá chỉ có sau SDANHDA.", "aliases": ["TKD"], "kw": ""}, {"code": "SDDOCDATK", "alias": "DTK", "group": "Ốp lát đá granite / gạch", "title": "Thống kê viên đá sau SDDOCDA, đặt tấm", "summary": "Thống kê viên đá sau SDDOCDA kiểu SDGACHTK: gom nhóm theo kích thước, số lượng, diện tích, rồi ước tính số tấm đá cần đặt (cộng hao hụt %).", "steps": ["Nhập kích thước tấm đá, hao hụt %, dung sai gom nhóm.", "Quét chọn polyline viên (Enter = tất cả trên layer SD-GACH / SD-GACH-CAT / SD-GACH-VIEN / SD-GACH-DOC).", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng V1, V2... (kích thước, SL, diện tích) + dòng tổng và dòng đặt hàng; file _ThongKeVienDa.csv.", "note": "Lưu ý: Số tấm đặt chỉ ước tính theo diện tích, không phải kết quả xếp tấm (số thật xem SDANHDATK). Đọc hình học polyline nên không cần dữ liệu SD_TILE.", "aliases": ["DTK"], "kw": ""}, {"code": "SDANHDATK", "alias": "ATK", "group": "Ốp lát đá granite / gạch", "title": "Thống kê tấm đá sau SDANHDA, đặt tấm", "summary": "Thống kê tấm đá sau SDANHDA kiểu SDGACHTK: mỗi tấm đá số mấy có bao nhiêu viên, diện tích dùng, hao hụt từng tấm, và số tấm cần đặt (cộng hao hụt %).", "steps": ["Nhập kích thước tấm đá, hao hụt %.", "Quét chọn polyline viên (Enter = tất cả trên layer viên).", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng theo tấm đá số (số viên, diện tích, hao hụt tấm) + dòng đặt hàng; file _ThongKeTamDa.csv.", "note": "Lưu ý: Dùng dữ liệu SDANHDA lưu trong bản vẽ; viên chưa ghép được hiện là chưa gán. Kích thước tấm nhập tay phải đúng tấm đã dùng khi chạy SDANHDA.", "aliases": ["ATK"], "kw": ""}, {"code": "SDKHODA", "alias": "KHO", "group": "Ốp lát đá granite / gạch", "title": "Kho đá thô", "summary": "Quản lý kho đá thô gồm nhiều cỡ tấm.", "steps": ["Chọn thao tác: Them / Sua / Xoa / Lietke / Nhap (CSV) / Xuat (CSV).", "Them: mã tấm, mã vật liệu (* = mọi vật liệu), dài, rộng, số lượng, chiều dày."], "result": "Kho lưu trong bản vẽ; Xuat ra _KhoDaTho.csv (Ma tam;Ma VL;Dai;Rong;SL;Day).", "note": "", "aliases": ["KHO"], "kw": ""}, {"code": "SDDATHO", "alias": "DTH", "group": "Ốp lát đá granite / gạch", "title": "Cắt viên từ đá thô", "summary": "Tính số tấm đá thô và vẽ sơ đồ cắt viên.", "steps": ["Chọn viên (Enter = tất cả).", "Nguồn đá: Kho / Motco (một cỡ tấm).", "Khi kho thiếu: Muamoi / Dung; cỡ tấm mua mới.", "Xén biên, lưỡi cắt, có cho xoay viên.", "Ưu tiên dùng tấm dư trong kho trước; giữ phế liệu (ô trống lớn, cả 2 cạnh ≥ ngưỡng mm) thành tấm dư trong kho; độ kỹ khi xếp (Nhanh / Cân bằng / Kỹ).", "Tỷ lệ sơ đồ; điểm chèn.", "Có trừ số tấm đã dùng khỏi kho (và ghi tấm dư mới)."], "result": "Sơ đồ cắt từng mẫu tấm (×n), hiệu suất, số tấm theo loại (tấm dư ghi (tam du)), số tấm dư mới giữ lại. File _SoDoCatDaTho.csv.", "note": "Lưu ý: Tấm dư mới chỉ được ghi vào kho khi tích Trừ số tấm đã dùng khỏi kho. Tấm dư là cạnh cắt sạch nên không xén biên khi dùng lại; SDKHODA có cột Loại (R = tấm dư) và thao tác Xóa tấm dư.", "aliases": ["DTH"], "kw": "cat vien tu da tho so do cat hieu suat hao hut hao phi slab kho tam"}, {"code": "SDTHANGDA", "alias": "TDA", "group": "Ốp lát đá granite / gạch", "title": "Cầu thang đá: mặt / cổ / mũi bậc, khe LED, len, ra đá ABF", "summary": "Lập bộ viên đá cho cầu thang: mặt bậc, cổ bậc, mũi bậc và len chân tường chạy nghiêng theo cầu thang. Tính số viên, kích thước phôi từng loại, góc cắt (vát 45° ở mũi bậc, cắt xiên đầu len theo độ dốc), chiều dài vát và CNC; trừ hao khe hắt LED; rồi ra đá kiểu ABF lên tấm đá thô, so sánh 4 kiểu mũi bậc để chọn phương án ít tấm nhất.", "steps": ["Nhập số bậc, bề rộng bậc, bước đạp (từ mặt ngoài cổ bậc này đến mặt ngoài cổ bậc kế), chiều cao bậc, dày mặt bậc và cổ bậc.", "Chọn kiểu mũi bậc: Thang (mặt chồng lên cổ, mũi nhô ra), V45 (mặt và cổ ghép vát 45°), Roi (dải mũi cắt riêng), CNC (mặt liền, mũi bo hay vát bằng CNC). Nhập khe hắt LED và chọn trừ vào chiều cao cổ bậc, chiều sâu mặt bậc, hoặc cắt rãnh dưới mặt bậc.", "Nhập len chân tường (số bên, bề rộng dải), chiều dài viên tối đa (dài hơn thì chia, có mạch), khổ tấm đá thô, xén biên, bề rộng lưỡi cắt, độ kỹ khi xếp; tích So sánh để thấy số tấm cần của cả 4 kiểu.", "Chọn điểm chèn để vẽ mặt cắt 3 bậc, hàng viên có dữ liệu SD_TILE và sơ đồ cắt đá thô theo từng độ dày."], "result": "Bảng viên trên dòng lệnh (mã MB mặt bậc, CB cổ bậc, MR dải mũi rời, LN len; dài × rộng, số lượng, dày, góc cắt), tổng diện tích phôi, chiều dài vát 45° và CNC, số tấm đá thô và hiệu suất, so sánh 4 kiểu mũi bậc; file _CauThangDa.csv; trên bản vẽ có mặt cắt, các viên (layer SD-GACH-CAT, mang SD_TILE nên SDDATHO dùng được kho và tấm dư, SDGACHTK, SDGIACONG) và sơ đồ cắt.", "note": "Lưu ý: Lệnh vẽ thêm mặt bằng thang (vế, vạch bậc, chiếu nghỉ, bậc quạt) để đối chiếu hình dạng; ô Hình thang khi nhiều vế: L (rẽ trái) hoặc U (quay đầu, khoảng cách hai vế 50 mm khi chiều rộng chiếu nghỉ để 0), bậc quạt chỉ ở lần rẽ trái đầu tiên. Khe LED có thêm kiểu Hộc: hộc LED dưới mép trước mặt bậc (rộng 17, sâu 20, cách mép 20 mm là giá trị mặc định, đặt được), cắt CNC, vẽ trên mặt cắt kèm ký hiệu đèn trên layer SD-LED, cảnh báo nếu xuyên thủng mặt bậc. Nhập Tổng chiều cao thì lệnh tự chia số bậc, chiều cao bậc đều và kiểm tra 2R + T (600 - 640 mm); số vế lớn hơn 1 tạo thêm chiếu nghỉ (CN); số bậc quạt lớn hơn 0 tạo viên quạt: MQ (phôi chữ nhật nhỏ nhất khi xoay quạt), CQC (cổ bậc quạt cong, tấm cong cắt từ phôi dày bằng CNC) hoặc CQD (cổ bậc quạt ghép đoạn thẳng, hai đầu vát nửa góc chuyển hướng) khi chọn ô Cổ bậc quạt khác Thẳng; MQG (hai quạt ghép ngược nhau trong một phôi, dùng khi nhỏ hơn 97% hai phôi đơn, chừa khe bằng mạch + 2 mm), CQ cổ bậc; ghi kèm diện tích thật. Mặt bậc và cổ bậc khác độ dày được xếp lên tấm riêng theo từng độ dày. Ghép V45 nên dùng cùng độ dày mặt và cổ, lệnh cảnh báo khi khác. Len chạy nghiêng: chiều dài = số bậc × cạnh huyền (bước đạp, chiều cao), cộng phần cắt xiên; đầu len cắt xiên theo góc dốc. Quy ước hình học xem mặt cắt trên bản vẽ; mọi số liệu phải đối chiếu với kết cấu thực tế trước khi gửi xưởng.", "aliases": ["TDA"], "kw": ""}, {"code": "SDGIACONG", "alias": "GCV", "group": "Ốp lát đá granite / gạch", "title": "Bản vẽ gia công viên", "summary": "Bản vẽ gia công từng mã viên gửi xưởng.", "steps": ["Chọn viên (Enter = tất cả).", "Có vẽ cả viên nguyên.", "Tỷ lệ (mặc định 1/10), số thẻ trên 1 hàng.", "Điểm chèn."], "result": "Mỗi mã viên một thẻ: hình thật, kích thước bao, cạnh xiên / lỗ khoét, số lượng, dày, vật liệu.", "note": "", "aliases": ["GCV"], "kw": ""}, {"code": "SDLOP", "alias": "CTL", "group": "Ốp lát đá granite / gạch", "title": "Cấu tạo lớp ốp / lát", "summary": "Chi tiết cấu tạo lớp ốp / lát.", "steps": ["San / Tuong.", "Các lớp cách nhau dấu ;, số cuối là chiều dày, VD Đá granite dày 20;Vữa XM 30;Sàn BTCT 150.", "Chiều dài đoạn thể hiện.", "Điểm chèn."], "result": "Các lớp đúng chiều dày, kích thước chuỗi, ghi chú từng lớp.", "note": "", "aliases": ["CTL"], "kw": ""}, {"code": "SDPANEL", "alias": "BLN", "group": "Tiện ích", "title": "Bảng lệnh (hộp thoại)", "summary": "Bảng lệnh dạng hộp thoại.", "steps": ["Chọn nhóm lệnh.", "Chọn lệnh, bấm OK hoặc nhấp đúp."], "result": "Lệnh được chạy ngay sau khi đóng hộp thoại.", "note": "", "aliases": ["BLN"], "kw": ""}, {"code": "SDHELP", "alias": "HDL", "group": "Tiện ích", "title": "Danh sách lệnh", "summary": "In danh sách lệnh và lệnh tắt ra dòng lệnh.", "steps": ["Gõ lệnh."], "result": "Danh sách theo nhóm: lệnh, lệnh tắt, mô tả.", "note": "", "aliases": ["HDL"], "kw": ""}, {"code": "SDBLOCKDA", "alias": "KCD", "group": "Ốp lát đá granite / gạch", "title": "Block chi tiết đá: mũi bậc mẫu, quét hình tạo block", "summary": "Tạo block chi tiết đá để dùng lại. Mẫu: mặt cắt 3 bậc với bốn kiểu mũi bậc (Thẳng, ghép vát 45°, dải mũi rời, mũi bo / vát CNC) và tùy chọn hộc LED dưới mép trước (17 x 20), lấy đúng hình vẽ của SDTHANGDA. Ốp khô: mặt cắt đá treo trên khung thép: hai tấm đá chồng lên nhau có khe joint (thẳng hoặc vát cạnh 45°), bát treo inox, móc treo inox, thép L, bulông nở inox, vẽ 1:1 mm kèm chú thích. Quét: quét hình bất kỳ rồi chọn điểm gốc để tạo block. Chèn: chèn file block .dwg (đã lưu hoặc tải từ web); tùy chọn Dọn (mặc định) đưa mọi đối tượng trong block về một layer chung (mặc định SD-CHITIET) và xóa các layer lạ file mang vào, Giữ thì giữ nguyên layer của file. Có thể lưu block ra file .dwg để dùng cho bản vẽ khác và mở Block Editor để thêm thông số động (Linear + Stretch).", "steps": ["Chạy SDBLOCKDA, chọn Mẫu / Quét / Chèn / Ốp khô (đá treo trên khung thép).", "Mẫu: chọn kiểu mũi bậc, kích thước, hộc LED; tên block tự đặt theo thông số (cùng thông số thì dùng lại block cũ).", "Quét: quét chọn hình, chọn điểm gốc, đặt tên; tích Giữ hình để chèn lại thành block.", "Chèn: chọn Dọn / Giữ layer và tên layer chung, chọn file .dwg rồi điểm chèn.", "Tích Lưu ra file .dwg để dùng ở bản vẽ khác; tích Mở Block Editor nếu muốn thêm thông số động rồi đóng bằng BCLOSE."], "result": "Block có tên SDCT_... trong bản vẽ, chèn tại điểm chọn; tùy chọn có file .dwg riêng.", "note": "Lưu ý: Thông số động (Linear + Stretch) phải thêm tay trong Block Editor, lệnh không tạo tự động. Không gom các viên đã dựng bằng SDGACH / SDANHDA vào block rồi sửa tiếp: SDDOCDA, SDANHDA, SDTUDONG, SDRON, SDXOAVIEN chỉ thấy đối tượng ở mức trên cùng của bản vẽ, không thấy trong block, và ảnh cắt trong block có thể không sửa tại chỗ được (REFEDIT). Dùng block cho chi tiết, mặt cắt, bảng; bản rải lát giữ nguyên như cũ. Dọn layer chỉ làm khi block được chèn lần đầu vào bản vẽ (chèn lại block đã có thì dùng định nghĩa cũ); layer 0 và DEFPOINTS giữ nguyên; block lồng bên trong block giữ layer cũ của nó, nên màu / nét ghi cứng trong file vẫn còn (chi tiết mất phân biệt layer, còn phân biệt màu); chỉ xóa được layer không còn đối tượng nào dùng. Chi tiết ốp khô chỉ là mẫu minh họa: số liệu mặc định (đá dày 20, thép L30x30x3, bulông nở M8x100, khe joint 8, vát 3 x 45°) lấy cho dễ hình dung, kích thước phụ kiện thật của bạn phải nhập lại và kỹ sư kiểm tra, không dùng thẳng để gia công.", "aliases": ["KCD"], "kw": ""}, {"code": "SDTRINH", "alias": "BTK", "group": "Ốp lát đá granite / gạch", "title": "Bản trình khách: bảng chú thích vật liệu, chế độ trình khách", "summary": "Chuẩn bị bản in trình khách (khổ A1, tỷ lệ 1:50). Chú thích: vẽ bảng chú thích vật liệu từ các viên SD_TILE đã dựng, mỗi mã vật liệu một dòng gồm ô mẫu ảnh đá (bản sao ảnh tấm, phóng vừa ô 22 x 14 mm giấy), mã, tên, kích thước, dày, số lượng, diện tích và tổng. Bật / Tắt: chế độ trình khách làm mờ các layer nền kiến trúc (không bắt đầu bằng SD-): màu xám nhạt ACI 253, nét 0,09, và ẩn các layer nhãn kỹ thuật bạn liệt kê (mặc định SD-CHU, nơi có số hiệu T..); Tắt trả lại màu, nét, bật / tắt cũ từng layer.", "steps": ["Chạy SDTRINH, chọn Chú thích, nhập đơn vị bản vẽ trên 1 mm giấy (A1 tỷ lệ 1:50 = 50), chọn điểm góc trên trái bảng.", "Chạy SDTRINH, chọn Bật; đổi danh sách layer ẩn nếu nhãn kích thước nằm ở layer khác; tích Làm mờ nền nếu muốn.", "In (SDIN hoặc PLOT) bằng acad.ctb, rồi chạy SDTRINH > Tắt để trả lại bản vẽ thi công."], "result": "Bảng chú thích nằm trên layer SD-CHUTHICH (không bị ẩn khi bật chế độ trình khách); nền mờ, nhãn kỹ thuật ẩn khi Bật.", "note": "Lưu ý: Ô mẫu dùng ảnh tấm của viên đầu tiên của mỗi mã; viên không có ảnh (dùng hatch) thì hiện chữ (không ảnh). Chỉ làm mờ layer không bắt đầu bằng SD-, layer 0 và DEFPOINTS; tường dựng bằng layer SD-* không bị mờ. Nhãn kích thước xanh trong ảnh mẫu có thể ở layer khác SD-CHU: thêm vào danh sách ẩn. In bằng bảng nét acad.ctb (xám 253 in thành xám).", "aliases": ["BTK"], "kw": ""}, {"code": "SDKHUNGIN", "alias": "KIN", "group": "Ốp lát đá granite / gạch", "title": "Khung in tự dựng A1 / A3: khung tên, hướng Bắc, thước tỷ lệ", "summary": "Dựng khung in cho bản trình khách: tờ giấy A1 / A3 (hoặc A2, A4) ở tỷ lệ 1:N (A1 1:50 = 42050 x 29700 đơn vị bản vẽ), gồm khung tờ (layer SD-KHUNGIN, không in) làm khung cho SDTAOLAYOUT / SDIN, viền trong (lề trái 25 mm để đóng tập), khung tên 4 hàng (dự án, hạng mục, tên bản vẽ, tỷ lệ | ngày | số tờ) và các hàng thêm phía trên nếu có điền: số hiệu bản vẽ + REV, người thực hiện, nhà thầu thi công, tư vấn giám sát, chủ đầu tư (trống thì không vẽ hàng đó), mũi tên hướng Bắc và thước tỷ lệ 5 đoạn. Tích ô cuối để đặt sẵn cài đặt in: SDIN và SDTAOLAYOUT mở ra đã chọn khung = layer SD-KHUNGIN, nét in acad.ctb, vừa khổ giấy (Fit) chính giữa; đồng thời đặt IMAGEFRAME để khung ảnh đá không in.", "steps": ["Chạy SDKHUNGIN, chọn khổ giấy (A1 hoặc A3), tỷ lệ, điền dự án, hạng mục, tên bản vẽ, số tờ; tùy chọn chủ đầu tư, tư vấn giám sát, nhà thầu, người thực hiện; số hiệu theo dạng mã dự án.mã nhà thầu.loại.số (VD C6B.319.SDS.01) và REV.", "Chọn điểm góc trái dưới của tờ trong Model, đặt tờ bao quanh phần mặt bằng cần in (di chuyển hoặc copy khung nếu cần).", "Chạy SDTAOLAYOUT (tạo Layout và đánh số tờ) hoặc SDIN (in hàng loạt): cài đặt khung đã có sẵn, chọn máy in rồi chạy."], "result": "Khung tờ trên layer SD-KHUNGIN, viền và khung tên trên SD-KHUNGIN-VIEN / -LUOI / -CHU; cài đặt in SDIN và SDTAOLAYOUT được đặt sẵn.", "note": "Lưu ý: Khung tờ không in (layer SD-KHUNGIN tắt in) chỉ để máy in lấy vùng in. Máy in cần có khổ giấy tương ứng A1 / A3; SDIN chọn khổ gần nhất. Ngày lấy theo đồng hồ máy. Chữ có dấu tiếng Việt cần kiểu chữ hỗ trợ. Số hiệu bản vẽ ghép từ mã dự án, mã nhà thầu, loại bản vẽ (mặc định SDS) và số thứ tự hai chữ số; để trống cả mã dự án và mã nhà thầu thì không vẽ hàng số hiệu. Số thứ tự tự tăng sau mỗi lần vẽ khung (SDKHUNGIN hoặc SDPHUONGAN) nếu bật; thông tin ghi nhớ trong bản vẽ cho lần sau.", "aliases": ["KIN"], "kw": ""}, {"code": "SDKHAOSAT", "alias": "KSH", "group": "Ốp lát đá granite / gạch", "title": "Dựng phòng từ số đo khảo sát (hạng A / B / C / X / D)", "summary": "Dựng phòng từ số đo khảo sát hiện trạng (file CSV cùng định dạng với tool khao-sat-hien-trang / máy đo laser Bosch: room,ab,bc,cd,da,ac,bd,height,openings_m2,source,date,note). Phòng thực tế hiếm khi vuông nên lệnh dựng theo 4 cạnh liền nhau AB, BC, CD, DA và đường chéo AC, rồi so đường chéo BD tính được với BD đo để kiểm tra đo sai. Mỗi phòng được xếp hạng tin cậy: A (đủ 4 cạnh và 2 chéo, chéo khép), B (có chéo AC), C (không chéo, giả định góc B vuông), X (chéo BD lệch quá ngưỡng, cần đo lại), D (thiếu cạnh hoặc số đo không khép được). Phòng đủ điều kiện được vẽ thành polyline kín (layer SD-PHONG) kèm tên, hạng và diện tích, xếp cạnh nhau từ điểm chọn.", "steps": ["Xuất bảng số đo thành CSV (mẫu: room,ab,bc,cd,da,ac,bd,height,openings_m2,source,date,note).", "Chạy SDKHAOSAT, chọn file CSV; chọn đơn vị trong file, ngưỡng lệch, hạng phòng được dựng, khoảng cách xếp.", "Chọn điểm chèn; đọc báo cáo trên dòng lệnh (phòng nào cần đo lại).", "Dùng polyline phòng làm biên cho SDGACH, SDLOT hoặc SDRAITAM."], "result": "Polyline kín trên layer SD-PHONG kèm nhãn tên phòng, hạng, diện tích; báo cáo hạng từng phòng và ghi chú trên dòng lệnh.", "note": "Lưu ý: Shop drawing ốp lát chỉ nên dùng phòng hạng A; B và C cần đo thêm đường chéo trước khi đặt vật tư; X và D không đưa vào khối lượng cho đến khi đo lại. Phòng chữ L hoặc có góc cắt phải chia thành các tứ giác. Lệnh chỉ dựng hình tứ giác, các phòng xếp cạnh nhau chứ không đặt theo vị trí thật trong tòa nhà: sau khi dựng phải dời polyline về vị trí trên mặt bằng. Diện tích tính từ tọa độ dựng hình.py của tool khảo sát nhưng viết lại bằng AutoLISP.", "aliases": ["KSH"], "kw": ""}, {"code": "SDCHIABAC", "alias": "CHB", "group": "Ốp lát đá granite / gạch", "title": "Chia bậc thang từ cao độ, bảng cao độ từng bậc", "summary": "Chia bậc thang từ cao độ. Nhập cao độ hoàn thiện hai sàn so với ±0.000 công trình (m), số bậc từng vế (VD 10,11: hai vế có chiếu nghỉ ở giữa; một vế: 21), bước làm tròn chiều cao bậc (mm), bề dày đá và vữa. Lệnh chia chiều cao tầng cho số bậc, làm tròn rồi dồn phần lệch vào các bậc trên cùng hoặc dưới cùng (VD 3500 mm / 21 bậc = 166,67: làm tròn 1 mm ra 14 bậc 167 và 7 bậc 166, tổng đúng 3500). Bảng ghi cao độ hoàn thiện và cao độ kết cấu (hoàn thiện trừ đá và vữa) của từng bậc và từng chiếu nghỉ, in ra dòng lệnh và ra bản vẽ; tùy chọn đặt sẵn chiều cao bậc và số bậc vế đầu cho SDTHANGDA.", "steps": ["Chạy SDCHIABAC, nhập cao độ hoàn thiện sàn dưới và sàn trên (m, so với ±0.000), số bậc từng vế.", "Chọn bước làm tròn, nơi dồn phần lệch, bề dày đá và vữa.", "Chọn điểm chèn bảng cao độ; chạy SDTHANGDA nếu đã tích đặt sẵn chiều cao bậc."], "result": "Bảng BẢNG CAO ĐỘ BẬC THANG (cao độ hoàn thiện, cao độ kết cấu, chiều cao bậc, chiếu nghỉ) và báo cáo trên dòng lệnh.", "note": "Lưu ý: Cao độ kết cấu = cao độ hoàn thiện trừ (đá + vữa); các bậc xây hay bản thang có bề dày khác thì tính thêm bằng tay. Số bậc là số lần nâng (số bậc cao) từ sàn dưới đến sàn trên, mỗi chiếu nghỉ tính là mặt của bậc cuối vế trước. Lệnh chỉ tính chiều cao, không tính bước đạp: chiều rộng bậc lấy từ mặt bằng và nhập ở SDTHANGDA. Cảnh báo khi bậc ngoài 150 - 180 mm. Nếu làm tròn làm các bậc không đều nhau thì chiều cao bậc đặt cho SDTHANGDA là giá trị làm tròn chung, bậc lệch cần xử lý riêng.", "aliases": ["CHB"], "kw": ""}, {"code": "SDMAVIEN", "alias": "SMV", "group": "Ốp lát đá granite / gạch", "title": "Mã viên theo hình dạng, ổn định khi sửa bản vẽ", "summary": "Đánh mã viên theo hình dạng: các viên cùng vật liệu và cùng hình dạng (xoay thế nào cũng được; tùy chọn gộp cả viên đối xứng gương) có cùng một mã, VD G1-01, G1-02 (tiền tố là mã vật liệu hoặc một tiền tố cố định như ST). Mã được ghi vào viên (dữ liệu SD_MAVIEN), ghi chữ lên từng viên (layer SD-MAVIEN), lập bảng mã viên (loại, kích thước, số lượng, diện tích) và ghi hai file CSV: theo mã (_MaVien.csv) và từng viên kèm tọa độ tâm (_MaVienTungVien.csv). Bảng mã được nhớ trong bản vẽ: chạy lại thì viên cũ giữ mã cũ, hình mới nhận mã tiếp theo, nên mã bản vẽ và mã xưởng không bị lệch khi bản vẽ sửa. SDCATDU dùng mã này (nếu có) thay mã viên cũ.", "steps": ["Chạy SDMAVIEN, quét chọn các viên (Enter = tất cả trong bản vẽ).", "Chọn dung sai (mặc định 1 mm), có gộp viên đối xứng gương không, tiền tố mã.", "Chọn điểm chèn bảng; đọc hai file CSV để lập tem hoặc lệnh cắt."], "result": "Mã viên ghi trên bản vẽ (layer SD-MAVIEN), bảng BẢNG MÃ VIÊN, file _MaVien.csv và _MaVienTungVien.csv.", "note": "Lưu ý: Hình dạng được so bằng độ dài cạnh (làm tròn theo dung sai) và góc rẽ (làm tròn 1 độ), không phụ thuộc điểm đầu và chiều xoay của polyline. Viên có cạnh cong (cung) được xấp xỉ bằng nhiều đoạn thẳng nên chỉ coi là cùng hình khi các đoạn cùng chia; hai cung khác bán kính rất gần nhau có thể nhận cùng mã. Kích thước được làm tròn theo dung sai nên hai viên lệch nhau ngay tại ranh giới làm tròn (VD 600,5 và 600,4 với dung sai 1 mm) vẫn có thể nhận hai mã khác nhau: nếu thấy mã bị tách oan, tăng dung sai. Viên chữ L có hai cạnh bằng nhau tự đối xứng nên luôn cùng mã với bản đối xứng gương của nó. Mã không xét chiều vân: hai viên cùng hình nhưng xoay vân khác nhau vẫn cùng mã, cần ghi hướng vân riêng. Chạy lại với 'Đánh lại từ đầu' sẽ bỏ bảng mã đã nhớ.", "aliases": ["SMV"], "kw": ""}, {"code": "SDKIEMTONG", "alias": "KTO", "group": "Ốp lát đá granite / gạch", "title": "Lượt kiểm tổng trước khi phát hành", "summary": "Lượt kiểm tổng trước khi phát hành: một lệnh chạy cùng lúc các kiểm tra của bộ lệnh ốp lát và in một báo cáo. Gồm hồ sơ số liệu (SDHOSO: bao nhiêu số còn chưa xác nhận), viên cắt hẹp, viên cắt nhỏ, ron không đều, lưới ron lệch giữa các phòng (như SDTRUNGRON) và các cảnh báo của chuỗi cao độ (SDLIENCAODO). Mỗi mục có trạng thái ĐẠT, CẢNH BÁO, CHƯA XÁC NHẬN hoặc BỎ QUA (chưa kiểm được). Có thể ghi báo cáo thành bảng trên bản vẽ; luôn xuất CSV.", "steps": ["Rải gạch và nhập số liệu bằng SDHOSO / SDLIENCAODO trước.", "Chạy SDKIEMTONG, chỉnh ngưỡng hẹp, nhỏ, ron nếu cần; tích ghi báo cáo ra bản vẽ nếu muốn.", "Đọc báo cáo; chạy lệnh riêng của mục cảnh báo (SDKTLAT, SDTRUNGRON, SDLIENCAODO) để khoanh và xử lý."], "result": "Báo cáo trên dòng lệnh, file CSV _KiemTong.csv, bảng BÁO CÁO KIỂM TRA TỔNG (tùy chọn).", "note": "Lưu ý: Lệnh chỉ đếm và báo, không khoanh vị trí (dùng SDKTLAT và SDTRUNGRON để khoanh). BỎ QUA nghĩa là chưa kiểm được, không phải đạt. Kiểm ron không đều bỏ qua khi có hơn 1500 viên (chạy SDKTLAT riêng). Không thay thế việc đối chiếu bản vẽ với thiết kế và hiện trạng.", "aliases": ["KTO"], "kw": ""}, {"code": "SDHOSO", "alias": "SLD", "group": "Ốp lát đá granite / gạch", "title": "Hồ sơ số liệu dự án", "summary": "Hồ sơ số liệu dự án: gom các số dùng chung cho nhiều lệnh (bề rộng ron, cao độ sàn chính, hạ cốt WC, dốc sàn WC và sân hồ, cao độ sân hồ, mực nước, độ sâu hồ, dày đá đứng và keo ở chỗ đổi cao độ, dư mặc định sát tường) vào một hộp thoại, nhập một lần dùng cho các lệnh SDLIENCAODO, SDBACCAODO, SDCATDU, SDOPTUONG, SDHOBOI. Mỗi số có trạng thái đã xác nhận (lấy từ thiết kế hoặc đo hiện trạng) hoặc chưa xác nhận (mặc định, nội suy, hoặc đã đổi sau khi xác nhận). Các lệnh trên in cảnh báo khi dùng số chưa xác nhận; có thể ghi bảng hồ sơ ra bản vẽ để người duyệt thấy số nào còn chưa xác nhận.", "steps": ["Chạy SDHOSO, nhập các số theo thiết kế hoặc đo hiện trạng.", "Tích 'đã xác nhận' ở các số đã đối chiếu thiết kế / hiện trạng; bỏ trống số còn là giả định.", "Tích ghi bảng và bấm điểm chèn nếu cần bảng trên bản vẽ; chạy các lệnh khác như bình thường, sẽ có cảnh báo nếu còn số chưa xác nhận."], "result": "Số liệu được nhớ trong bản vẽ, danh sách trạng thái trên dòng lệnh, bảng HỒ SƠ SỐ LIỆU DỰ ÁN (tùy chọn).", "note": "Lưu ý: Trạng thái đã xác nhận do người dùng tích, lệnh không tự kiểm chứng số. Số đổi sau khi xác nhận (kể cả đổi trong hộp thoại của lệnh khác) tự trở lại chưa xác nhận. Mới có 12 số dùng chung, chưa gồm trục, tường, cửa. Các lệnh chỉ cảnh báo, không chặn chạy.", "aliases": ["SLD"], "kw": ""}, {"code": "SDDIMVIEN", "alias": "DVI", "group": "Ốp lát đá granite / gạch", "title": "Dim tự động theo hàng viên", "summary": "Dim tự động theo hàng viên đã rải: chuỗi từng viên (bước viên = viên + ron) và, nếu chọn hai hàng, thêm đường dim tổng. Dim theo hướng ngang hoặc đứng của lưới (lưới xoay thì dùng dim thẳng hàng với lưới), ngoài phòng (hàng viên sát mép phòng, đặt phía dưới / trái, trên / phải hoặc cả bốn phía) hoặc trong phòng (đường dim đi qua điểm bạn chọn). Khoảng cách đường dim đến mép phòng nhập được; dim nằm trên layer SD-KICHTHUOC.", "steps": ["Rải gạch phòng bằng SDGACH hoặc SDLOT.", "Chạy SDDIMVIEN, quét chọn các viên của phòng (Enter = tất cả).", "Chọn hướng, số hàng, vị trí (ngoài / trong phòng), phía đặt, khoảng cách; với dim trong phòng bấm một điểm trên hàng cần dim."], "result": "Các đường dim chuỗi từng viên (và đường dim tổng) trên layer SD-KICHTHUOC.", "note": "Lưu ý: Dim là đối tượng AutoCAD ghi kích thước hình học hiện có: sửa viên sau đó phải dim lại. Ron nhỏ hơn bề rộng ron nhập được gộp vào bước viên; khoảng hở lớn hơn (cửa, vật cản) được dim riêng. Lưới so le: hàng chọn chỉ cho các viên cắt ngang đường dim.", "aliases": ["DVI"], "kw": ""}, {"code": "SDOPTUONG", "alias": "OPTU", "group": "Ốp lát đá granite / gạch", "title": "Ốp tường trùng ron sàn", "summary": "Ốp tường trùng ron sàn: chọn đường mặt tường (polyline), các viên sàn của phòng và các lỗ cửa; lệnh trải phẳng mặt tường theo thứ tự cạnh như SDCHANTUONG, ốp viên theo khổ rộng × cao nhập vào, ron đứng lấy theo ron sàn dọc tường (viên sàn cách tường không quá khoảng sát nhập) và ron ngang chia từ mặt sàn hoặc từ cao độ chừa len lên. Có kiểm tra trùng ron: mỗi ron sàn cắt tường được so với ron ốp gần nhất, vạch xanh nếu lệch không quá dung sai, vạch đỏ kèm số mm lệch nếu không; báo số viên nguyên, viên cắt, diện tích ốp và hàng trên cùng quá hẹp.", "steps": ["Rải gạch sàn trước (SDGACH / SDLOT).", "Chạy SDOPTUONG, chọn polyline mặt tường, nhập khổ viên ốp, ron, chiều cao ốp, cao độ chừa len, khoảng sát và dung sai.", "Quét chọn các viên sàn của phòng (Enter nếu không cần trùng ron), chọn các lỗ cửa, bấm điểm chèn mặt đứng."], "result": "Mặt đứng ốp trên layer SD-OP-TUONG, vạch kiểm tra ron SD-OP-RON-TRUNG (xanh) và SD-OP-RON-LECH (đỏ), dòng lệnh báo tỉ lệ trùng ron, số viên và diện tích.", "note": "Lưu ý: Ron đứng trùng hết khi bước viên ốp (rộng + ron) bằng bước viên sàn dọc tường hoặc ước số của nó; khác bước thì chỉ vài ron trùng, lệnh báo số ron lệch. Mặt đứng chưa trừ chiều cao lỗ cửa (mới tách theo chiều dọc tường) và chưa tạo mã viên ốp / bảng cắt. Tường cong hoặc gấp khúc xét theo từng cạnh.", "aliases": ["OPTU"], "kw": ""}, {"code": "SDTRUNGRON", "alias": "RLE", "group": "Ốp lát đá granite / gạch", "title": "Kiểm tra lưới ron xuyên các phòng", "summary": "Kiểm tra lưới ron có liên tục xuyên các phòng không (ron phòng này thẳng hàng với ron phòng kia qua cửa, kể cả khi hai phòng rải riêng hoặc có giật cấp). Lệnh lấy viên nguyên đầu tiên làm lưới chuẩn, đo độ lệch của từng viên nguyên so với lưới (theo hai phương), gom thành nhóm cùng độ lệch. Nhóm đông nhất là lưới chính; các nhóm còn lại được khoanh đám mây trên layer SD-RON-LECH kèm số mm lệch, dòng lệnh báo cần dời nhóm bao nhiêu mm để ron trùng. SDLOT có thêm cách đặt điểm bắt đầu 'Chung': chọn một điểm gốc lưới cho mọi phòng, các phòng rải cùng một lưới ron.", "steps": ["Rải gạch các phòng (SDLOT với điểm bắt đầu Chung, hoặc SDGACH từng phòng).", "Chạy SDTRUNGRON, chọn các viên (Enter = tất cả), nhập bề rộng ron và độ lệch cho phép.", "Xem các đám mây RON LỆCH và dòng lệnh báo mm cần dời."], "result": "Layer SD-RON-LECH (đám mây và số mm lệch), dòng lệnh báo số nhóm lệch và mm cần dời.", "note": "Lưu ý: Chỉ xét viên nguyên (F) cùng khổ và cùng hướng với viên chuẩn; viên khác khổ hoặc khác hướng bị bỏ qua và được đếm. Kiểu lát so le chỉ kiểm tra phương dọc. Viên chuẩn là viên nguyên đầu tiên trong tập chọn, nên khi cả hai nửa bản vẽ đều khác nhau thì nhóm đông hơn được coi là lưới chính. Chạy lại lệnh xóa đám mây cũ trên layer SD-RON-LECH.", "aliases": ["RLE"], "kw": ""}, {"code": "SDBACCAODO", "alias": "CDB", "group": "Ốp lát đá granite / gạch", "title": "Chừa dư tại chỗ đổi cao độ", "summary": "Gán số mm dư cho các chỗ đổi cao độ (ngưỡng WC, mép hồ, chân thành hồ) để SDCATDU tự chừa dư. Chọn các nét nằm đúng chỗ đổi cao độ, chọn kiểu: đá dưới chui dưới đá đứng (đá đứng dựng sau) thì dư = dày đá đứng + keo (ví dụ đá đứng dày 20 + keo 10 = dư 30), hoặc đá sàn ốp lên mặt đứng thì dư = chênh cao + keo. Lệnh copy các nét sang layer SD-CAODO-BAC-<mm>; SDCATDU nhận các layer này và chừa dư các cạnh viên sát chúng, cạnh biên khác dùng số dư mặc định.", "steps": ["Vẽ hoặc chọn nét (LINE / polyline) đúng mép ngưỡng WC, mép hồ hoặc chân thành.", "Chạy SDBACCAODO, chọn các nét, chọn kiểu và nhập chênh cao, dày đá đứng, keo.", "Chạy SDCATDU (mục tự nhận nét đổi cao độ đang bật)."], "result": "Layer SD-CAODO-BAC-<mm> chứa nét đã copy; SDCATDU ghi +mm trên các cạnh viên sát nét.", "note": "Lưu ý: Hai kiểu xử lý là quy ước xử lý thường gặp, không phải tiêu chuẩn: chọn theo chi tiết thiết kế của hạng mục. Chênh cao mặc định lấy từ hạ cốt WC của SDLIENCAODO. Nét phải nằm cách cạnh viên không quá khoảng sát của SDCATDU (mặc định 30 mm).", "aliases": ["CDB"], "kw": ""}, {"code": "SDLIENCAODO", "alias": "LKD", "group": "Ốp lát đá granite / gạch", "title": "Chuỗi cao độ sàn chính, WC, sân hồ, đáy hồ", "summary": "Chuỗi cao độ nối sàn chính, sàn WC, sân hồ, mực nước và đáy hồ: nhập cao độ sàn chính (so với ±0.000), mức hạ cốt sàn WC tại ngưỡng cửa, dốc sàn WC và sân hồ, cao độ mép hồ, mực nước và độ sâu hai đầu hồ (số liệu hồ lấy lại từ SDHOBOI nếu đã nhập). Chọn polyline vùng WC rồi các phễu thu, chọn polyline sân hồ rồi các phễu / rãnh thu: lệnh tìm điểm xa phễu nhất, tính cao độ sàn hoàn thiện tại phễu (ngưỡng trừ dốc nhân khoảng cách). Kết quả là bảng cao độ từ cao xuống thấp, chênh cao giữa các mức, các cảnh báo (sàn WC không thấp hơn sàn chính, mực nước cao hơn mặt sân, sân hồ cao hơn sàn chính, dốc ngoài 1 - 2%) và sơ đồ liên hệ cao độ ghi ra bản vẽ.", "steps": ["Chạy SDLIENCAODO, nhập cao độ sàn chính, hạ cốt WC, dốc, cao độ sân hồ và mực nước.", "Chọn polyline kín vùng WC rồi bấm các phễu thu (Enter xong); làm tương tự với sân hồ; Enter ngay để bỏ qua một vùng.", "Bấm điểm chèn sơ đồ cao độ rồi điểm chèn mặt cắt ngang đúng tỉ lệ (Enter bỏ qua từng cái) và đọc bảng cao độ trên dòng lệnh."], "result": "Danh sách cao độ từ cao xuống thấp trên dòng lệnh, cảnh báo, sơ đồ trên layer SD-CAODO-LIEN, mặt cắt ngang đúng tỉ lệ trên layer SD-CAODO-MC, cao độ nhớ trong bản vẽ.", "note": "Lưu ý: Mức hạ cốt sàn WC mặc định 20 mm chỉ là số điền sẵn: nhập theo thiết kế. Dốc 1 - 2% lấy từ TCVN 4260:2012 §6.2.24 (sân quanh bể và sàn khu vệ sinh của bể bơi), áp dụng cho dự án khác chỉ để tham khảo. Cao độ tại phễu tính cho điểm xa phễu nhất với mặt sàn dốc đều về phễu; sàn nhiều mặt dốc hay có gờ chắn nước cần tính riêng. Số liệu bề rộng hồ và độ sâu ở mặt cắt ngang chỉ để vẽ hình; mặt cắt ngang vẽ đúng tỉ lệ 1:1 theo mm (sân hồ dốc ra xa hồ). Nối với SDCATDU qua SDBACCAODO.", "aliases": ["LKD"], "kw": ""}, {"code": "SDHOBOI", "alias": "HOB", "group": "Ốp lát đá granite / gạch", "title": "Hồ bơi: độ dốc đáy, đồng mức, mặt cắt dọc", "summary": "Shop drawing hồ bơi theo độ dốc đáy: chọn polyline mép trong lòng hồ, bấm hai điểm xác định trục dốc từ đầu nông xuống đầu sâu, nhập độ sâu nước hai đầu, đoạn đáy phẳng đầu nông (và đầu sâu, hoặc nhập thẳng độ dốc 1:n), bước đường đồng mức. Lệnh tính độ dốc đáy (% và 1:n), vẽ trục dốc, các đường đổi dốc, các đường đồng mức đáy cách nhau theo bước đã nhập (kèm độ sâu và cao độ hoàn thiện), vẽ khe co giãn chia hồ thành các ô không vượt khoảng cách tối đa, ghi mặt cắt dọc hồ (mực nước, đáy, độ sâu hai đầu, độ dốc) và bảng cao độ đáy tại từng mạch viên. Với chiều dài viên theo hướng dốc, lệnh báo mỗi viên chênh cao bao nhiêu mm và đề xuất dời đường đổi dốc đúng vào mạch gạch (tránh viên phải chế qua đường đổi dốc). Có kiểm tra độ dốc đáy, độ sâu nông / sâu, bậc nghỉ chân, dốc sân quanh hồ theo TCVN 4260:2012 và ISPSC 2015 (trích số điều khoản trong dòng báo).", "steps": ["Vẽ hoặc chọn polyline kín là mép trong lòng hồ (mặt bằng lòng hồ, chưa tính ốp).", "Chạy SDHOBOI, nhập độ sâu nước hai đầu, đoạn đáy phẳng, độ dốc (hoặc để lệnh tính), bước đồng mức, chiều dài viên và ron.", "Chọn polyline lòng hồ, bấm một điểm ở đầu nông rồi một điểm ở đầu sâu (hai điểm tạo trục dốc, không cần nằm sát thành hồ).", "Bấm điểm chèn mặt cắt dọc (hoặc Enter bỏ qua), đọc các dòng cảnh báo trên dòng lệnh và chỉnh số liệu."], "result": "Layer SD-HOBOI (trục, nhãn), SD-HOBOI-DM (đồng mức), SD-HOBOI-DOI (đường đổi dốc), SD-HOBOI-KHE (khe co giãn), SD-HOBOI-MC (mặt cắt và bảng cao độ); dòng lệnh báo độ dốc, số khe, chênh cao mỗi viên, các cảnh báo.", "note": "Lưu ý: Mô hình đáy gồm một đoạn phẳng đầu nông, một đoạn dốc đều, một đoạn phẳng đầu sâu; hồ có nhiều độ dốc, bậc cấp, ghế ngồi hay hố nhảy cầu chưa mô hình (chạy lệnh cho từng vùng). Giới hạn dốc 1:7 (vùng nông, đến độ sâu 838 mm) và 1:3 (vùng sâu) lấy từ ISPSC 2015 §807, giới hạn 1:10 ở vùng nước sâu đến 1,5 m lấy từ quy định xây dựng Mỹ (UpCodes 454.1.2); các số này là tiêu chuẩn nước ngoài, không phải quy định bắt buộc ở Việt Nam. TCVN 4260:2012 chỉ quy định đáy dốc về hố thu 1 - 3% (§5.1.11) và sân quanh bể dốc 1 - 2% về phía phễu thu (§6.2.24), không quy định dốc từ đầu nông xuống đầu sâu. Khoảng cách khe co giãn lấy theo Laticrete / TCNA EJ171: 2,4 - 3,7 m mỗi phương, rộng tối thiểu 9 mm khi cách 2,6 m và 12 mm khi cách 4 m; đây là hướng dẫn của nhà sản xuất keo, đối chiếu hồ sơ thiết kế của hạng mục. Độ sâu nông 838 - 1219 mm là của hồ gia đình theo ISPSC.", "aliases": ["HOB"], "kw": ""}, {"code": "SDMAP", "alias": "TVM", "group": "Ốp lát đá granite / gạch", "title": "Thư viện map đá có sẵn", "summary": "Thư viện map (ảnh vân) đá granite có sẵn: chọn một map hoặc Tất cả, nhập chiều dài thật của tấm đá và điểm chèn, lệnh chèn ảnh đúng kích thước thật (layer SD-MAP) để SDANHDA cắt vào các viên. Gói cài đặt có thư mục Maps với 17 map (13 map cơ bản: đen tuyết, đen sao vàng, xám đậm, xám sáng, trắng chấm đen, trắng vân mây, vàng kem, đỏ, hồng, nâu, xanh rêu, xanh dương, tím; và 4 map theo kiểu tấm đá thật bạn gửi, ghi khổ thật trong tên file: đen tia trắng 3180 x 1920, xám vân sóng 2900 x 1820, xám vân ngang 2600 x 1850, xám vân gỗ 2450 x 1170) do chương trình tự sinh, không lấy từ nguồn bên thứ ba. Tên file có đuôi _DàixRộng (VD _3180x1920) thì SDMAP tự dùng khổ đó khi để chiều dài là 0; map của bạn cũng đặt tên theo cách này được. Muốn thêm map của bạn: chép file .jpg / .png (tên không dấu) vào thư mục Maps rồi chạy lại SDMAP, map mới tự có trong danh sách. Chọn Tất cả sẽ chèn mỗi map một tấm cạnh nhau, rồi SDANHDA chọn cả nhóm ảnh để mỗi tấm thô là một vân khác nhau.", "steps": ["Chạy SDMAP, chọn map (hoặc Tất cả), nhập chiều dài thật của tấm (để 0 = theo khổ ghi trong tên file, không có thì 3000 mm) và số tấm.", "Bấm điểm chèn ở vùng trống của bản vẽ.", "Chạy SDANHDA, chọn các ảnh vừa chèn, bật Lấy kích thước tấm từ ảnh, quét chọn các viên cần cắt; nếu cần chỉnh biên thì dùng SDMOANH, SDDICHVAN."], "result": "Ảnh map nằm trên layer SD-MAP, rộng đúng chiều dài tấm đã nhập, cao theo tỉ lệ ảnh (map có sẵn là 1,875, tức 3000 x 1600).", "note": "Lưu ý: Map có sẵn chỉ là vân sinh bằng thuật toán, để lên phương án màu và kiểm tra bố cục; không phải ảnh chụp đá thật, không thay cho ảnh tấm đá thật của nhà cung cấp khi trình khách. Khi dùng ảnh khác tỉ lệ thì nhập chiều dài thật đúng và bật Lấy kích thước tấm từ ảnh ở SDANHDA. Thư mục Maps được tìm cạnh ShopDrawing.lsp (hoặc trên đường dẫn của AutoCAD); không thấy thì lệnh hỏi chọn một ảnh trong thư mục và nhớ trong máy. Một số bộ map tải miễn phí trên mạng có điều kiện bản quyền riêng: đọc kỹ trước khi đưa vào bản vẽ giao khách.", "aliases": ["TVM"], "kw": ""}, {"code": "SDDICHVAN", "alias": "DCV", "group": "Ốp lát đá granite / gạch", "title": "Dịch vân đá từng bước dưới biên viên", "summary": "Dịch vân đá từng bước: chọn một viên đã cắt ảnh (SDANHDA), nhấn Trái / Phải / Lên / Xuống để nhích ảnh tấm đá dưới biên viên một bước (mặc định 10 mm, đổi bằng Buoc), biên viên đứng yên, ảnh được cắt lại sau mỗi bước. Keo (từ 2.43.0) cho kéo vân bằng chuột như thao tác kéo ảnh trong mặt nạ cắt của phần mềm đồ họa: ảnh tạm bỏ clip và mờ đi để thấy cả tấm đá, biên viên vẽ nét sáng đứng yên, kéo chuột hoặc dùng phím mũi tên để trượt ảnh bên dưới, click / Enter / Space chấp nhận (ảnh được cắt lại), Esc hoặc chuột phải hủy. Hoan trả lại bước vừa dịch. Mỗi bước phải giữ polyline viên nằm trọn trong ảnh (chừa lề an toàn); hết khổ về phía nào thì báo và không dịch thêm. Dùng để chọn lại đoạn vân đẹp cho từng viên, không phải kéo ảnh qua lại bằng lệnh Move.", "steps": ["Chạy SDDICHVAN, nhập bước dịch (mm) và lề an toàn.", "Chọn viên (polyline); lệnh tự ghép ảnh của viên, nếu không ghép được thì chọn ảnh bằng tay.", "Gõ Keo để kéo vân bằng chuột (chọn điểm gốc, kéo, click chấp nhận, Esc hủy), hoặc Trai / Phai / Len / Xuong để dịch vân một bước, QT / QP để xoay vân sang trái / phải một góc (xoay quanh tâm viên, tự dịch nhẹ để viên không ra khỏi ảnh; Goc để đổi góc mỗi lần), Hoan để lùi lại một bước (kể cả bước xoay), Buoc để đổi bước, Xong (hoặc Enter) để sang viên khác."], "result": "Ảnh vân của viên dịch đúng số bước, biên viên không đổi; dòng lệnh báo tổng đã dịch.", "note": "Lưu ý: Hướng dịch tính theo trục X / Y của bản vẽ (Phải và Lên là dương), vân chạy theo hướng đó trên viên. Chỉ dịch được khi tấm đá còn thừa khổ quanh viên; viên sát mép tấm có thể chỉ dịch được về một phía. Chế độ Keo: trong lúc kéo ảnh hiện cả tấm (mờ 50%) và đè lên các viên bên cạnh tạm thời; viên luôn được giữ nằm trong ảnh nên kéo quá xa sẽ bị chặn ở lề. Không đối gương ảnh (AutoCAD không lật được điểm ảnh): muốn đối gương cần file ảnh đã lật gương. Ảnh dùng chung nhiều viên (lưới chung) dịch cùng lúc cho cả các viên đó.", "aliases": ["DCV"], "kw": ""}, {"code": "SDCATDU", "alias": "CTD", "group": "Ốp lát đá granite / gạch", "title": "Cắt dư sát tường: cạnh nào cắt dài ra", "summary": "Chỉ ra viên cắt nào, cạnh nào phải cắt dài ra để ra công trường bẻ lại cho khít. Cạnh biên là cạnh của viên cắt không có viên nào khác nằm sát bên ngoài (sát tường, cột, vật cản). Mỗi cạnh biên được cộng thêm số mm chừa dư (mặc định 10 mm). Nếu nhập quy tắc theo layer dạng layer=mm cách nhau dấu ; (VD *MUIBAC*=20;*THANHHO*=15;*TUONG*=10) thì chỉ cạnh biên cách các nét đó không quá khoảng cho phép (mặc định 30 mm) mới chừa dư, mỗi loại một số mm (không ghi mm thì dùng số mặc định); cạnh biên không sát nét nào (mép hở nhìn thấy, cửa) không chừa dư, vì chỉ nên chừa dư ở cạnh khuất. Ví dụ đá đáy hồ chừa dư phần khuất dưới mũi bậc và dưới đá dựng thành hồ. Lệnh vẽ gạch đỏ dọc cạnh đó và ghi +dư trên bản vẽ (layer SD-CATDU), lập bảng theo mã viên: kích thước thiết kế, các cạnh chừa dư (cạnh dài / cạnh ngắn / cạnh xiên), kích thước cắt (đã cộng dư), số lượng; ghi file CSV theo mã viên (_CatDu.csv) và danh sách từng viên kèm tọa độ tâm (_CatDuTungVien.csv).", "steps": ["Chạy SDCATDU, quét chọn các viên (Enter = tất cả trong bản vẽ).", "Nhập số mm chừa dư mặc định, quy tắc theo layer (layer=mm) và khoảng sát (để trống quy tắc = mọi cạnh biên đều chừa dư); tích Vẽ gạch đỏ nếu muốn thấy trên bản vẽ.", "Chọn điểm chèn bảng; file CSV ghi cạnh bản vẽ."], "result": "Gạch đỏ và chữ +dư trên từng cạnh chừa dư (layer SD-CATDU), bảng BẢNG CẮT DƯ SÁT TƯỜNG, file _CatDu.csv.", "note": "Lưu ý: Sau bảng, lệnh hỏi điểm chèn ghi chú rủi ro và ghi 9 mục lên layer SD-CATDU-GHICHU (giữ khi phát hành bản vẽ). Kích thước cắt = kích thước thiết kế + dư x số cạnh chừa dư theo từng hướng, chỉ tính cho cạnh dài (song song cạnh dài nhất) và cạnh ngắn (vuông góc); cạnh xiên được đánh dấu * và không cộng vào kích thước. Viên nguyên không được xét. Lệnh nhận biết cạnh biên bằng cách thử điểm cách cạnh 8 mm: khe ron rộng hơn 8 mm hoặc viên kề nhỏ hơn 8 mm có thể bị nhận sai. Chạy lại lệnh sẽ vẽ lại dấu cũ.", "aliases": ["CTD"], "kw": ""}, {"code": "SDDUTOAN", "alias": "DTD", "group": "Ốp lát đá granite / gạch", "title": "Dự toán tiền đá theo đơn giá m²", "summary": "Dự toán tiền đá theo đơn giá m². Lệnh tính diện tích lát của từng mã vật liệu từ polyline viên, hỏi đơn giá (đồng/m²) cho từng mã (nhớ lại cho lần sau), hao hụt khi mua (%), đơn giá công lát (đồng/m², tùy chọn) và VAT (%). Diện tích mua = diện tích lát x (1 + hao hụt). Bảng gồm từng mã vật liệu, cộng tiền đá, công lát, VAT và tổng cộng; ghi file CSV. Chạy riêng cho từng phương án bằng cách quét chọn các viên của phương án đó.", "steps": ["Chạy SDDUTOAN, quét chọn các viên của phương án (Enter = tất cả).", "Nhập đơn giá từng mã vật liệu, hao hụt, công lát, VAT.", "Chọn điểm chèn bảng; file CSV ghi cạnh bản vẽ."], "result": "Bảng DỰ TOÁN TIỀN ĐÁ và file _DuToan.csv; đơn giá được nhớ theo mã vật liệu trong bản vẽ.", "note": "Lưu ý: Đây là dự toán theo diện tích, không phải số tấm đá mua thật: tấm thật còn phụ thuộc cách xếp tấm (SDANHDA / SDGACHTK) nên chỉnh hao hụt cho sát. Diện tích tính từ polyline viên (mm bản vẽ), không dùng giá trị diện tích lưu trong viên. Viên không có mã vật liệu hoặc ở vùng X bị bỏ qua.", "aliases": ["DTD"], "kw": ""}, {"code": "SDPHUONGAN", "alias": "PHA", "group": "Ốp lát đá granite / gạch", "title": "Phương án lát A / B trên một tờ, bảng ngắn, hao hụt", "summary": "Đặt hai phương án lát (A và B, hai bố cục viên khác nhau của cùng khu vực, đã dựng bằng SDGACH / SDDOCDA và để cạnh nhau trong Model) lên một tờ trình khách: lệnh quét chọn các viên của từng phương án, ghi nhãn PHƯƠNG ÁN A / B phía trên, bảng ngắn phía dưới (tổng số viên và diện tích; viên nguyên, cắt chữ nhật, cắt đặc biệt; viên cắt hẹp; hao hụt ước tính) và vẽ khung in A1 / A3 (như SDKHUNGIN) bao cả hai phương án.", "steps": ["Dựng hai phương án cạnh nhau trong Model (hai khu vực giống nhau, bố cục khác nhau).", "Chạy SDPHUONGAN, chọn khổ giấy và tỷ lệ, điền thông tin khung tên.", "Quét chọn các viên của phương án A rồi của phương án B.", "Chạy SDTAOLAYOUT hoặc SDIN để in tờ."], "result": "Nhãn và bảng ngắn của hai phương án, khung in bao cả hai trên layer SD-KHUNGIN, đã đặt sẵn cài đặt in.", "note": "Lưu ý: Hao hụt ước tính chỉ là phần thừa của viên cắt so với viên nguyên (giả sử mỗi viên cắt dùng hết một viên nguyên), không phải kết quả xếp tấm đá (nesting): số thật ra bằng SDRAITAM / SDTKDA. Hai phương án không vừa tờ ở tỷ lệ đã chọn thì lệnh báo cần tăng tỷ lệ hoặc đổi khổ và không vẽ khung (nhãn và bảng vẫn có). Các lệnh chỉ đọc viên có dữ liệu SD_TILE.", "aliases": ["PHA"], "kw": ""}, {"code": "SDTUNAP", "alias": "AUL", "group": "Tiện ích", "title": "Tự nạp ShopDrawing mỗi khi mở AutoCAD", "summary": "Làm cho ShopDrawing tự nạp mỗi khi mở AutoCAD hoặc bản vẽ mới, không phải APPLOAD lại (lỗi lệnh 'mất' sau khi mở lại AutoCAD là do chỉ APPLOAD một lần, APPLOAD không nhớ sang phiên sau). Lệnh ghi một khối có đánh dấu vào acaddoc.lsp trong thư mục Support của người dùng và thêm thư mục plugin vào thư mục tin cậy.", "steps": ["Nạp ShopDrawing.lsp một lần (APPLOAD).", "Chạy SDTUNAP; nếu không tự tìm thấy file, chọn ShopDrawing.lsp.", "Mở lại AutoCAD kiểm tra: lệnh SDHELP chạy ngay. Muốn gỡ: chạy SDTUNAP, chọn Gỡ."], "result": "Mỗi bản vẽ mở ra đều tự nạp ShopDrawing.lsp; dòng lệnh báo đường dẫn đã ghi.", "note": "Lưu ý: Đừng đổi chỗ hoặc xóa thư mục ShopDrawing sau khi bật (chạy SDTUNAP lại để ghi đường dẫn mới). Tên thư mục nên là chữ không dấu. Cần quyền ghi thư mục Support (%AppData%\\Autodesk\\...\\Support). SDMENU cũng tự nạp qua ShopDrawing.mnl; SDTUNAP là cách nhẹ hơn, không cần menu.", "aliases": ["AUL"], "kw": "tu nap mat lenh mo lai autocad khong phai appload"}, {"code": "SDMENU", "alias": "CMN", "group": "Tiện ích", "title": "Cài menu + toolbar + Ribbon", "summary": "Cài menu + 6 toolbar + tab Ribbon ShopDrawing, thêm Support Path và Trusted Locations, tự nạp LISP mỗi bản vẽ.", "steps": ["Chọn file ShopDrawing.mnu trong thư mục dist (nếu chưa có trong Support Path). ShopDrawingRibbon.cuix cùng thư mục được nạp kèm."], "result": "Menu ShopDrawing, toolbar SD … và tab Ribbon ShopDrawing (6 panel); gỡ cả hai bằng SDMENUXOA.", "note": "Lưu ý: Không thấy tab: nhấp phải vùng Ribbon → Show Tabs → tích ShopDrawing. Chỉ cần Ribbon: CUILOAD → ShopDrawingRibbon.cuix.", "aliases": ["CMN"], "kw": ""}, {"code": "SDDLG", "alias": "HTN", "group": "Tiện ích", "title": "Bật / tắt hộp thoại", "summary": "Bật / tắt hộp thoại nhập liệu của các lệnh.", "steps": ["Co = mỗi lệnh mở hộp thoại nhập thông số; Khong = hỏi lần lượt trên dòng lệnh."], "result": "Thiết lập lưu trong bản vẽ.", "note": "Lưu ý: Trong hộp thoại có nút 'Nhap tren dong lenh' để nhập theo kiểu cũ cho riêng lần đó.", "aliases": ["HTN"], "kw": ""}, {"code": "SDMENUXOA", "alias": "", "group": "Tiện ích", "title": "Gỡ menu", "summary": "Gỡ menu", "steps": [], "result": "", "note": "", "aliases": [], "kw": ""}, {"code": "SDHANDINH", "alias": "HDI", "group": "Tiện ích", "title": "Hàn đỉnh polyline", "summary": "Hàn đỉnh: các polyline sinh ra từ cùng một điểm giao cắt phải có đỉnh trùng nhau. Gộp các đỉnh lệch nhau (sai số làm tròn hoặc vài phần mm) về một tọa độ chung, và chèn đỉnh vào cạnh polyline kề bên ở các nút chữ T.", "steps": ["Nhập dung sai hàn đỉnh (mặc định 0.5 mm) và chọn có chèn đỉnh nút chữ T hay không.", "Quét chọn polyline (Enter = tất cả polyline trong Model).", "Xem dòng lệnh: số đỉnh đã hàn, số đỉnh T đã chèn, số polyline đã sửa."], "result": "Mọi đỉnh trong dung sai dùng chung đúng một tọa độ; cạnh polyline đi qua đỉnh của polyline kề bên đều có đỉnh tại đó. Hình dạng chỉ lệch tối đa bằng dung sai.", "note": "Lưu ý: Từ 2.58.0 SDDOCDA tự giữ đỉnh nút chữ T khi dựng ô nên các ô không còn lệch đỉnh; dùng SDHANDINH cho bản vẽ cũ hoặc polyline sinh từ lệnh khác (SDGACH...). Không chèn đỉnh vào cạnh cung (bulge).", "aliases": ["HDI"], "kw": ""}], "groups": [{"name": "Lệnh cơ bản"}, {"name": "Thiết lập và bản vẽ"}, {"name": "Ốp lát đá granite / gạch"}, {"name": "Tiện ích"}], "faq": [{"id": "chon-lenh", "title": "Nên dùng lệnh nào cho việc của tôi?", "q": ["nên dùng lệnh nào", "chọn lệnh nào", "bắt đầu từ đâu"], "a": "| Tình huống | Lệnh |\n|---|---|\n| Một vùng lát đã có polyline kín, cần chia viên | `SDGACH` |\n| Nhiều ô / phòng, rải theo kho tấm (Panel hoặc Đá) | `SDRAITAM` |\n| Bản vẽ chỉ có nét rời (LINE, polyline hở), chưa có polyline kín | `SDDOCDA` |\n| Đã có viên và có ảnh tấm đá thật | `SDANHDA` |\n| Đã có viên nhưng chưa có ảnh tấm đá | `SDVANDA` |\n| Cần bảng thống kê và số lượng đặt hàng | `SDGACHTK` |\n| Kiểm tra viên hẹp, ron không đều trước khi phát hành | `SDKTLAT` |\n| Không nhớ thứ tự các bước | `SDQUYTRINH` |\n| Dim các đoạn giữa các giao điểm trên một đường cắt | `SDDIMGD` (DGD) |\n\nBản vẽ mới: chạy `SDSET` trước để đặt tỷ lệ, layer, kiểu chữ.", "src": "Hướng dẫn nhanh · Các bước làm việc"}, {"id": "cai-dat", "title": "Cài đặt", "q": ["cài đặt", "cài plugin", "cách cài", "cài đặt thế nào", "appload", "nạp lisp", "giải nén"], "a": "1. Giải nén cả thư mục vào một chỗ cố định, ví dụ `D:\\SDOpLat` (không để trong Downloads hay thư mục tạm).\n2. Mở AutoCAD, gõ `APPLOAD`, chọn file `SDOpLat.lsp` (hoặc `SDOpLat.fas` nếu bạn nhận bản đã biên dịch), bấm Load.\n3. Gõ `SDMENU`: lần đầu chọn file `SDOpLat.mnu` trong thư mục vừa giải nén. Menu và thanh công cụ hiện ra, lần sau tự nạp.\n4. Không muốn cài menu: gõ `SDPANEL` để mở bảng lệnh, hoặc gõ `SDTUNAP` một lần để tự nạp mỗi lần mở AutoCAD.\n5. Gỡ menu: `SDMENUXOA`.", "src": "Hướng dẫn nhanh"}, {"id": "kich-hoat", "title": "Kích hoạt bản quyền", "q": ["kích hoạt", "mã máy", "mã kích hoạt", "nhập mã", "nhập mã ở đâu", "dán mã ở đâu", "gõ mã ở đâu", "bản quyền", "sdkichhoat", "activate"], "a": "1. Gõ `SDKICHHOAT` (lệnh tắt `KHB`), ghi lại **Mã máy** dạng `XXXX-XXXX-XXXX`.\n2. Gửi Mã máy cho nhà cung cấp. Bạn sẽ nhận **Mã kích hoạt** dạng `XXXXX-XXXXX-XXXXX`.\n3. Gõ lại `SDKICHHOAT` và dán mã vào **dòng hỏi** \"Nhap Ma kich hoat\" rồi Enter. **Không** gõ mã ở dòng `Command:`, AutoCAD sẽ báo `Unknown command`.\n\nMã chỉ dùng được trên đúng máy đã gửi Mã máy. Báo \"không đúng cho máy này\" nghĩa là mã cấp cho máy khác hoặc Mã máy gửi đi chưa đúng.", "src": "Hướng dẫn nhanh"}, {"id": "het-luot", "title": "Hết lượt dùng thử", "q": ["hết lượt dùng thử", "dùng thử", "còn lần", "bị chặn", "het 10 lan", "trial"], "a": "Bản dùng thử chạy được một số lần giới hạn. Mỗi lần chạy một lệnh chính tính một lần; AutoCAD hiện \"Ban dung thu: con x / N lan\". Hết lượt, lệnh bị chặn và hiện Mã máy.\n\nĐể dùng tiếp: gõ `SDKICHHOAT`, gửi Mã máy cho nhà cung cấp, nhập Mã kích hoạt nhận được. Các lệnh `SDKICHHOAT`, `SDHELP`, `SDPANEL`, `SDMENU` luôn chạy được.", "src": "Hướng dẫn nhanh"}, {"id": "doi-may", "title": "Đổi máy hoặc cài lại Windows", "q": ["đổi máy", "cài lại windows", "máy mới", "mã máy thay đổi", "chuyển sang máy khác"], "a": "Mã kích hoạt gắn với Mã máy. Đổi máy hoặc cài lại Windows có thể làm Mã máy thay đổi, khi đó mã cũ không còn đúng. Chạy `SDKICHHOAT` để lấy Mã máy mới rồi liên hệ nhà cung cấp để được hỗ trợ.", "src": "Hướng dẫn nhanh"}, {"id": "mat-lenh", "title": "Không thấy lệnh sau khi mở lại AutoCAD", "q": ["không thấy lệnh sau khi mở lại autocad", "mất lệnh", "unknown command", "lệnh không chạy", "phải appload lại", "tự nạp"], "a": "`APPLOAD` thường chỉ nạp cho phiên hiện tại; mở lại AutoCAD là mất lệnh. Cách xử lý:\n- Gõ `SDTUNAP` một lần để plugin tự nạp mỗi khi mở AutoCAD.\n- Hoặc gõ `SDMENU` để cài menu và nạp lại tự động.\n\nNếu gõ tên lệnh mà AutoCAD báo `Unknown command`, kiểm tra plugin đã được nạp (dòng \"da nap\" hiện ra) và gõ đúng tên lệnh hoặc lệnh tắt.", "src": "Hướng dẫn nhanh"}, {"id": "menu-khong-hien", "title": "Menu hoặc thanh công cụ không hiện", "q": ["menu không hiện", "không thấy menu", "thanh công cụ không hiện", "toolbar", "ribbon", "sdmenu"], "a": "- Gõ `SDMENU` và chọn đúng file `SDOpLat.mnu` trong thư mục vừa giải nén.\n- Nếu đã từng cài bản cũ, xóa các thư mục bản cũ khỏi `OPTIONS > Files > Support File Search Path` để tránh nạp nhầm menu bản cũ.\n- Không thấy mục trên thanh menu: `CUI > Workspaces > (workspace đang dùng) > Customize Workspace > tích menu SDOpLat > Apply`.\n- Gói không kèm tab Ribbon; dùng menu, thanh công cụ hoặc `SDPANEL`.", "src": "Hướng dẫn nhanh"}, {"id": "excel", "title": "Lệnh xuất bảng và Excel", "q": ["excel", "xuất bảng", "csv", "không có excel", "xuất sang excel"], "a": "Các lệnh xuất bảng sang Excel cần Microsoft Excel (hoặc phần mềm bảng tính tương tự có hỗ trợ COM, chưa được kiểm tra). Nếu không có Excel, các lệnh có xuất file CSV vẫn có thể mở bằng phần mềm bảng tính khác.", "src": "Hướng dẫn nhanh"}, {"id": "he-thong", "title": "Yêu cầu hệ thống", "q": ["yêu cầu hệ thống", "windows", "mac", "autocad lt", "zwcad", "gstarcad", "bricscad", "phiên bản autocad"], "a": "- Windows (plugin dùng COM / Visual LISP nên không dùng cho Mac).\n- AutoCAD bản đầy đủ. AutoCAD LT chưa được kiểm tra: nhiều lệnh có thể không chạy.\n- Các phần mềm CAD tương tự hỗ trợ AutoLISP (ZWCAD, GstarCAD, BricsCAD) có thể chạy nhưng chưa được kiểm tra.\n- Chưa kiểm tra trên mọi phiên bản AutoCAD.", "src": "Hướng dẫn nhanh"}, {"id": "bao-mat", "title": "Cảnh báo bảo mật khi cài", "q": ["cảnh báo bảo mật", "trusted locations", "trustedpaths", "acaddoc", "phần mềm diệt virus", "support path"], "a": "`SDMENU` và `SDTUNAP` thêm thư mục cài đặt vào **Support File Search Path** và **Trusted Locations** (`TRUSTEDPATHS`) của AutoCAD, và `SDTUNAP` có thể ghi khối tự nạp vào `acaddoc.lsp` của bạn. Phần mềm bảo mật có thể hỏi lại; chỉ cho phép nếu bạn tin tưởng nguồn tải. Gỡ bằng `SDMENUXOA` và chạy lại `SDTUNAP` để tắt tự nạp.", "src": "Hướng dẫn nhanh"}, {"id": "anh-khong-cat", "title": "SDANHDA không cắt được ảnh", "q": ["sdanhda không cắt được ảnh", "ảnh không cắt", "imageclip lỗi", "ảnh tấm đá không đúng tỷ lệ", "ảnh bị xoay"], "a": "- Ảnh phải có **góc xoay 0** và **đúng tỷ lệ thật** của tấm (ví dụ 2450 × 1170 mm), chèn bằng `IMAGEATTACH`.\n- Viên quá lớn so với tấm sẽ không xếp được; chiều vân `Ngang` với viên dài hơn cạnh tấm thì báo không cắt được.\n- Chiều vân chỉ xoay theo bội 90° so với cạnh dài viên.\n- Gói có ảnh mẫu trong thư mục `Maps` (tên file có đuôi `_DàixRộng` thì `SDMAP` tự dùng khổ đó).", "src": "HuongDanQuyTrinhDa.md · Lưu ý"}, {"id": "khong-thay-van", "title": "Không thấy vân đá (SDVANDA)", "q": ["không thấy vân", "không tìm thấy file pat", "pat", "hatch vân lỗi", "sdvanda lỗi"], "a": "Báo lỗi khi AutoCAD không tìm thấy file `.pat` (Platinus, DaSocDua, ViaLactea, DaVanGoXam, DaVanGoCo). Chạy lại `SDMENU` để thư mục cài đặt được thêm vào Support File Search Path, hoặc kiểm tra các file `.pat` nằm cùng thư mục với `SDOpLat.lsp`.", "src": "Hướng dẫn nhanh"}, {"id": "hoan-tac", "title": "Hoàn tác một lệnh", "q": ["hoàn tác", "undo", "làm lại", "xóa kết quả lệnh", "bấm nhầm"], "a": "Mỗi lệnh gom vào một lần Undo: gõ `U` để hoàn tác cả lệnh. Bấm Esc giữa chừng thì lệnh dừng; với `SDDIMGD` (DGD) lệnh tự trả lại cài đặt hệ thống.", "src": "Hướng dẫn nhanh"}, {"id": "bao-loi", "title": "Báo lỗi cho nhà cung cấp", "q": ["báo lỗi", "gửi lỗi", "lệnh bị lỗi", "error", "hỗ trợ", "liên hệ"], "a": "Gửi cho nhà cung cấp: phiên bản AutoCAD (gõ `ABOUT`), tên lệnh, và các dòng lệnh hiện ra (nhấn `F2` để xem lịch sử, chép nguyên dòng báo lỗi). Nếu được, gửi kèm bản sao bản vẽ nhỏ tái hiện lỗi.", "src": "Hướng dẫn nhanh"}, {"id": "tham-khao", "title": "Số liệu và trách nhiệm", "q": ["trách nhiệm", "tham khảo", "tiêu chuẩn", "miễn trừ", "có chính xác không", "kiểm tra kết quả"], "a": "Các số liệu, tiêu chuẩn và gợi ý trong phần mềm và tài liệu chỉ để **tham khảo**. Bạn tự kiểm tra, đối chiếu hồ sơ thiết kế và tiêu chuẩn áp dụng, và chịu trách nhiệm về bản vẽ, khối lượng, đặt hàng và thi công. Hãy chạy thử trên bản sao bản vẽ trước khi dùng cho hồ sơ thật.", "src": "Hướng dẫn nhanh"}], "guides": [{"title": "Chuẩn bị", "text": "- Máy chạy Windows, có AutoCAD (bản đầy đủ).\n- Lệnh xuất bảng sang Excel cần có Microsoft Excel; nếu không có Excel, các lệnh có xuất file CSV vẫn có thể mở bằng phần mềm bảng tính khác.\n- Giải nén cả thư mục vào một chỗ cố định (ví dụ D:\\SDOpLat), không để trong Downloads hay thư mục tạm.", "src": "Hướng dẫn nhanh (HuongDanKhach.html)"}, {"title": "Cài đặt và kích hoạt", "text": "1. Mở AutoCAD, gõ APPLOAD, chọn file SDOpLat.lsp (hoặc SDOpLat.fas nếu bạn nhận bản đã biên dịch), bấm Load.\n2. Gõ SDMENU: lần đầu chọn file SDOpLat.mnu trong thư mục vừa giải nén. Menu SDOpLat và thanh công cụ sẽ hiện ra, lần sau tự nạp.\n3. Không muốn cài menu? Gõ SDPANEL để mở bảng lệnh, chọn lệnh từ hộp thoại.\n\nGỡ menu: SDMENUXOA.\n\n### Kích hoạt bản quyền\n\n1. Gõ SDKICHHOAT (lệnh tắt KHB), ghi lại Mã máy dạng XXXX-XXXX-XXXX.\n2. Gửi Mã máy cho [TÊN CÔNG TY / LIÊN HỆ]. Bạn sẽ nhận một Mã kích hoạt dạng XXXXX-XXXXX-XXXXX.\n3. Gõ lại SDKICHHOAT và nhập mã.\n\nBản dùng thử cho chạy một số lần giới hạn; hết lượt phải kích hoạt. Mã chỉ dùng được trên đúng máy đã gửi Mã máy. Đổi máy hoặc cài lại Windows có thể làm Mã máy thay đổi: hãy liên hệ để được hỗ trợ.\n\nCài đặt thêm thư mục vào Support File Search Path và Trusted Locations của AutoCAD (và có thể ghi khối tự nạp vào acaddoc.lsp khi bạn dùng SDTUNAP). Phần mềm bảo mật có thể hỏi lại; chọn cho phép nếu bạn tin tưởng nguồn tải.", "src": "Hướng dẫn nhanh (HuongDanKhach.html)"}, {"title": "Quy trình đá lát liên hoàn: Hộp thoại làm gì", "text": "- Dòng đầu cho biết **trạng thái bản vẽ**: số viên, số ảnh tấm đá, số ảnh đã cắt, số hatch vân, và **bước gợi ý** tiếp theo (dòng có `<== goi y` được chọn sẵn).\n- Danh sách 10 bước. Chọn một bước rồi bấm **Chạy bước chọn**, hoặc tích nhiều bước (Ctrl / Shift) rồi bấm **Chạy liên hoàn** để chạy lần lượt theo thứ tự trong danh sách.\n- Sau mỗi bước hộp thoại tự mở lại và cập nhật trạng thái. Bấm **Đóng** để thoát. **Hướng dẫn** hiện tóm tắt quy trình.\n- Nhấn Esc trong một bước chỉ dừng bước đó; chuỗi liên hoàn vẫn đi tiếp bước kế.\n\n| # | Lệnh | Việc |\n|---|---|---|\n| 1 | `SDRAITAM` | Chia viên / rải tấm theo kho: Panel (tấm tiêu chuẩn + tấm dị hình + gỗ bù) hoặc Đá (viên nguyên + viên cắt mép) |\n| 2 | `SDGACH` | Chia viên cho một vùng (thẳng / so le / xương cá / chevron, viên viền) |\n| 3 | `SDDOCDA` | Đọc mặt bằng ốp lát từ nét rời: dựng ô kín, bảng CSV / JSON để soát, mã vật liệu từ chữ / hatch, khoét lỗ / cột, vẽ polyline kín (không phải vẽ lại polyline) |\n| 4 | `SDANHDA` | Cắt ảnh tấm đá thô (IMAGECLIP) vào các viên, xếp cắt xuyên, đánh số thứ tự đường cắt, khoanh phế liệu |\n| 5 | `SDVANDA` | Hatch vân đá từ file `.pat` (khi chưa có ảnh thật) |\n| 6 | `SDGACHTK` | Thống kê viên + dự trù đặt hàng |\n| 7 | `SDDATHO` | Sơ đồ cắt viên từ đá thô (kho tấm, hao phí) |\n| 8 | `SDGIACONG` | Bản vẽ gia công từng mã viên gửi xưởng |\n| 9 | `SDTKDA` | Quét polyline viên đá cắt → bảng thống kê theo nhóm kích thước (SL, diện tích, cạnh mài) + chi tiết từng viên (mã T.., tấm đá số) + CSV |\n| 10 | `SDKTLAT` | Kiểm tra bản vẽ lát (chỉ đọc): viên cắt hẹp / nhỏ, ron không đều, ô thiếu mã vật liệu |", "src": "HuongDanQuyTrinhDa.md"}, {"title": "Quy trình đá lát liên hoàn: Quy trình mẫu: lát đá có vân thật", "text": "1. **Chuẩn bị:** vẽ các polyline kín là vùng lát (phòng, viền). Chèn ảnh tấm đá thô bằng `IMAGEATTACH` đúng tỷ lệ thật (VD 2450 × 1170, góc xoay 0).\n2. Mở `SDQUYTRINH`, chọn bước **1 `SDRAITAM`** (chế độ Đá) hoặc **2 `SDGACH`** để chia viên. Nhập kích thước viên, mạch, kiểu lát.\n   - Với `SDGACH` có thể tích **Cắt ảnh tấm đá thật vào các viên**: chia xong lệnh tự mở hộp thoại khai báo của `SDANHDA` (bước 4) và cắt ảnh cho tất cả viên vừa chia, bỏ qua việc quét chọn lại.\n3. Chọn bước **4 `SDANHDA`**:\n   - tích *Lấy kích thước tấm từ ảnh* (mặc định bật) hoặc nhập dài × rộng thật;\n   - xén biên và bề rộng lưỡi cắt (tấm vừa khít, ví dụ 3 × 390 = 1170, thì đặt cả hai bằng 0);\n   - **Chiều vân:** `Toiuu` (tự xoay 90°), `Doc` (vân theo cạnh dài viên), `Ngang` (vuông góc cạnh dài);\n   - **Cách xếp:** `Toiuu` = cắt xuyên cho máy cắt đá cầu, viên nhỏ lấp vào phế liệu hình L, ít tấm nhất; `Thutu` = theo thứ tự lát (vân gần nhau); `Duongviem` = chạy dọc đường viền (vân chạy liên tục quanh viền, dùng cho viền rộng 390…);\n   - chọn ảnh (nhiều ảnh cùng kích thước = nhiều tấm khác vân), **quét chọn** vùng nhiều polyline viên đá, chọn điểm đặt sơ đồ cắt.\n4. Xem sơ đồ cắt (layer `SD-DUONG-CAT`): **số thứ tự đường cắt** — đường tách miếng lớn đánh số trước, viên nhỏ cắt sau cùng để không xô lệch; các ô phế liệu còn dùng được ghi `VUN dài x rộng`.\n5. Chạy **6 `SDGACHTK`** (thống kê, đặt hàng) và **8 `SDGIACONG`** (bản vẽ gia công). Chạy **9 `SDTKDA`**: quét các polyline viên đã cắt ra bảng thống kê (nhóm kích thước, số lượng, diện tích, cạnh mài; chi tiết từng viên kèm tấm đá số). Cuối cùng **10 `SDKTLAT`** để rà lỗi trước khi phát hành.", "src": "HuongDanQuyTrinhDa.md"}, {"title": "Quy trình đá lát liên hoàn: Chạy liên hoàn: ví dụ", "text": "Chọn các bước **1, 4, 6** rồi **Chạy liên hoàn**: `SDRAITAM` → `SDANHDA` → `SDGACHTK` chạy lần lượt, mỗi lệnh hiện hộp thoại riêng để nhập thông số.", "src": "HuongDanQuyTrinhDa.md"}, {"title": "Quy trình đá lát liên hoàn: Lưu ý", "text": "- `SDANHDA` cần ảnh góc xoay 0 và đúng tỷ lệ tấm thật; viên không chữ nhật được xếp theo khung chữ nhật quanh nó, ảnh cắt theo đúng biên viên.\n- Chiều vân chỉ xoay theo bội 90° so với cạnh dài viên. `Ngang` với viên dài hơn cạnh tấm thì báo không cắt được.\n- Các file vân `.pat` (Platinus, DaSocDua, ViaLactea, DaVanGoXam, DaVanGoCo) nằm cùng thư mục cài đặt; `SDMENU` thêm thư mục này vào Support Path.\n- Kết quả đã kiểm tra bằng mô phỏng; nếu lệnh báo lỗi trên máy bạn, chụp các dòng lệnh gửi cho người hỗ trợ kèm tên lệnh và số phiên bản (`SDMENU` in ra số phiên bản).", "src": "HuongDanQuyTrinhDa.md"}], "topics": [["Nên dùng lệnh nào?", "Chọn lệnh theo việc cần làm", "nên dùng lệnh nào"], ["Cài đặt", "APPLOAD, SDMENU, SDPANEL", "cài đặt"], ["Kích hoạt bản quyền", "Mã máy, mã kích hoạt, dùng thử", "kích hoạt"], ["Quy trình làm việc", "Các bước từ chia viên đến thống kê", "quy trình làm việc"], ["Sự cố thường gặp", "Mất lệnh, menu không hiện, lỗi ảnh", "không thấy lệnh sau khi mở lại AutoCAD"], ["Yêu cầu hệ thống", "Windows, AutoCAD, Excel", "yêu cầu hệ thống"]], "next": {"SDSET": ["SDGACH", "SDRAITAM", "SDDOCDA"], "SDGACH": ["SDANHDA", "SDVANDA"], "SDRAITAM": ["SDANHDA", "SDVANDA"], "SDDOCDA": ["SDANHDA", "SDVANDA"], "SDANHDA": ["SDGACHTK", "SDKTLAT"], "SDVANDA": ["SDGACHTK", "SDKTLAT"], "SDGACHTK": ["SDKTLAT"], "SDTKDA": ["SDGACHTK"], "SDDOCDATK": ["SDKTLAT"], "SDANHDATK": ["SDKTLAT"]}, "footer": "Chạy hoàn toàn trên máy bạn, không cần mạng. Nội dung từ tài liệu của gói v1.0.0; số liệu chỉ để tham khảo, hãy chạy thử trên bản sao bản vẽ. Cần hỗ trợ thêm: liên hệ nhà cung cấp phần mềm."};
const $=id=>document.getElementById(id);
