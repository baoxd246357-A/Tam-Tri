const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const STOP=new Set("la cua va cho de toi minh em anh ban co khong nhu the nao gi o trong voi mot cac nhung bi duoc can muon hay lam sao thi ma thu xin vui long giup huong dan cach lenh nay do khi neu roi se da dang tu den tren duoi".split(" "));
const SYN={"gach":["vien","da","op","lat"],"vien":["gach","da"],"ron":["mach","khe"],"mach":["ron"],"hao":["thua","hut"],"hut":["hao"],"dim":["kich","thuoc","ghi"],"thongke":["bang","dat","hang"],"thong":["bang"],"kichhoat":["ma","may","ban","quyen"],"cai":["install","load","nap"],"nap":["load","cai","appload"],"loi":["error","bao","sai"],"van":["hatch","pattern","pat"],"anh":["image","imageclip","tam"],"tam":["slab","anh","panel"],"phong":["o","vung"],"vung":["phong","o"],"net":["line","roi"],"giao":["cat","diem"]};
const tok=s=>norm(s).split(/[^a-z0-9]+/).filter(t=>t&&!STOP.has(t));
/* ---- chỉ mục BM25 ---- */
const DOCS=[];
function addDoc(o,title,codes,body){const w=[];tok(title).forEach(t=>{w.push(t,t,t)});codes.forEach(c=>{const n=norm(c);if(n){for(let i=0;i<5;i++)w.push(n)}});tok(body).forEach(t=>w.push(t));o.tokens=w;o.len=w.length;o.tf={};w.forEach(t=>o.tf[t]=(o.tf[t]||0)+1);DOCS.push(o)}
KB.cmds.forEach(c=>addDoc({kind:"cmd",ref:c},c.title+" "+c.code+" "+(c.kw||""),[c.code,c.alias],c.summary+" "+c.steps.join(" ")+" "+c.result+" "+c.note+" "+c.group));
KB.faq.forEach(f=>addDoc({kind:"faq",ref:f},f.title,[],f.q.join(" ")+" "+f.q.join(" ")+" "+f.a));
KB.guides.forEach(g=>addDoc({kind:"guide",ref:g},g.title,[],g.text));
const N=DOCS.length,AVG=DOCS.reduce((a,d)=>a+d.len,0)/N,DF={};
DOCS.forEach(d=>Object.keys(d.tf).forEach(t=>DF[t]=(DF[t]||0)+1));
const vocab=Object.keys(DF);
function expand(ts){const out=new Map();ts.forEach(t=>{out.set(t,1);(SYN[t]||[]).forEach(s=>{if(!out.has(s))out.set(s,.4)});if(t.length>=4)vocab.forEach(v=>{if(v!==t&&v.length>=4&&(v.startsWith(t)||t.startsWith(v))&&!out.has(v))out.set(v,.5)})});return out}
const IDFMAX=Math.log(1+N);const idfOf=t=>DF[t]?Math.log(1+(N-DF[t]+.5)/(DF[t]+.5)):IDFMAX;
function search(q){const ts=tok(q);if(!ts.length)return[];const ex=expand(ts);const res=[];const tot=ts.reduce((a,t)=>a+idfOf(t),0);
 DOCS.forEach(d=>{let s=0;ex.forEach((w,t)=>{const f=d.tf[t];if(!f)return;s+=w*idfOf(t)*(f*2.2)/(f+1.2*(.25+.75*d.len/AVG))});
  if(s>0){if(d.kind!=="cmd")s*=(d.ref.id==="chon-lenh"?0.45:1.25);let got=0;ts.forEach(t=>{if(d.tf[t])got+=idfOf(t)});res.push([s,d,got/tot])}});
 res.sort((a,b)=>b[0]-a[0]);return res}
/* ---- hiển thị ---- */
function mdLite(s){const L=String(s).replace(/\r/g,"").split("\n"),o=[];let i=0;const inl=x=>esc(x).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
 while(i<L.length){const l=L[i];if(!l.trim()){i++;continue}
  if(/^\s*\|.*\|\s*$/.test(l)&&/^\s*\|?[\s:|-]+\|/.test(L[i+1]||"")){const c=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());const h=c(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(c(L[i++]));o.push('<div class="tw"><table><thead><tr>'+h.map(x=>"<th>"+inl(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+inl(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");continue}
  const hd=l.match(/^#{1,4}\s+(.*)$/);if(hd){o.push("<h4>"+inl(hd[1])+"</h4>");i++;continue}
  if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))it.push(L[i++].replace(/^\s*[-*]\s+/,""));o.push("<ul>"+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ul>");continue}
  if(/^\s*\d+[.)]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))it.push(L[i++].replace(/^\s*\d+[.)]\s+/,""));o.push("<ol>"+it.map(x=>"<li>"+inl(x)+"</li>").join("")+"</ol>");continue}
  const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\|)/.test(L[i]))p.push(L[i++]);if(!p.length)p.push(L[i++]);o.push("<p>"+p.map(inl).join("<br>")+"</p>")}
 return o.join("")}
const codeTags=s=>esc(s).replace(/\b(SD[A-Z0-9]{2,})\b/g,'<span class="k">$1</span>');
let msgsEl=$("msgs"),ctx={cmd:null};
function addMsg(role,html){const m=document.createElement("div");m.className="msg "+(role==="user"?"user":"bot");if(role!=="user"){const w=document.createElement("div");w.className="who";w.textContent="Trợ lý";m.appendChild(w)}const b=document.createElement("div");b.className="body";if(role==="user")b.textContent=html;else b.innerHTML=html;m.appendChild(b);msgsEl.appendChild(m);if(role==="user")msgsEl.scrollTop=msgsEl.scrollHeight;else msgsEl.scrollTop=Math.max(0,m.offsetTop-msgsEl.offsetTop-10);return b}
function chipRow(items,parent){const r=document.createElement("div");r.className="chips";const seen=new Set();items.filter(x=>!seen.has(x[0])&&seen.add(x[0])).forEach(([label,q])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=label;b.addEventListener("click",()=>ask(q));r.appendChild(b)});parent.appendChild(r)}
const byCode=c=>KB.cmds.find(x=>x.code===c);
function related(c){const txt=[c.summary,c.steps.join(" "),c.result,c.note].join(" ");const s=new Set();(txt.match(/\bSD[A-Z0-9]{2,}\b/g)||[]).forEach(x=>{if(x!==c.code&&byCode(x))s.add(x)});return [...s].slice(0,6)}
function cmdCard(c,facet){
 let h='<div class="card"><h3>'+esc(c.code)+(c.alias&&c.alias!==c.code?' <span class="k">'+esc(c.alias)+"</span>":"")+"</h3><p>"+codeTags(c.summary)+"</p>";
 const all=!facet||facet==="all";
 if((all||facet==="steps")&&c.steps.length)h+="<h4>Các bước</h4><ol>"+c.steps.map(s=>"<li>"+codeTags(s)+"</li>").join("")+"</ol>";
 if((all||facet==="result")&&c.result)h+="<h4>Kết quả</h4><p>"+codeTags(c.result)+"</p>";
 if((all||facet==="note")&&c.note)h+="<h4>Lưu ý</h4><p>"+codeTags(c.note.replace(/^Lưu ý:\s*/,""))+"</p>";
 if(facet==="alias")h+="<p>Lệnh đầy đủ: <span class=\"k\">"+esc(c.code)+"</span>"+(c.alias?" · lệnh tắt: <span class=\"k\">"+esc(c.alias)+"</span>":"")+"</p>";
 h+='<div class="src">Nguồn: HuongDanLenh.html · nhóm '+esc(c.group)+"</div></div>";return h}
function after(c){return (KB.next[c.code]||[]).filter(byCode)}
function reply(html,chips){const b=addMsg("bot",html);if(chips&&chips.length)chipRow(chips,b.parentNode);return b}
function showCmd(c,facet){ctx.cmd=c.code;const rel=related(c);const nx=after(c);
 const chips=[];if(facet&&facet!=="all")chips.push(["Xem đủ lệnh này",c.code]);
 chips.push(["Các bước "+c.code,"các bước "+c.code],["Lưu ý "+c.code,"lưu ý "+c.code]);nx.forEach(x=>chips.push(["Bước tiếp: "+x,x]));rel.filter(x=>!nx.includes(x)).slice(0,3).forEach(x=>chips.push([x,x]));
 reply(cmdCard(c,facet),chips)}
const DEFCH=[["Nên dùng lệnh nào?","nên dùng lệnh nào"],["Quy trình làm việc","quy trình làm việc"]];
function showFaq(f){const b=reply('<div class="card"><h3>'+esc(f.title)+"</h3>"+mdLite(f.a)+'<div class="src">Nguồn: '+esc(f.src||"Hướng dẫn nhanh")+"</div></div>");const m=(f.a.match(/\bSD[A-Z0-9]{2,}\b/g)||[]).filter((x,i,a)=>a.indexOf(x)===i&&byCode(x)).slice(0,5);chipRow(m.length?m.map(x=>[x,x]):DEFCH.filter(x=>f.id!=="chon-lenh"),b.parentNode)}
function showGuide(g){reply('<div class="card"><h3>'+esc(g.title)+"</h3>"+mdLite(g.text)+'<div class="src">Nguồn: '+esc(g.src)+"</div></div>")}
const FACETS=[["steps",/(cac buoc|cach (dung|lam)|lam sao|huong dan|thao tac|quy trinh dung|nhap gi)/],["result",/(ket qua|ra gi|cho ra|tao ra|sinh ra|layer nao)/],["note",/(luu y|chu y|canh bao|han che|gioi han)/],["alias",/(lenh tat|viet tat|go tat|phim tat)/]];
function ask(q){q=String(q||"").trim();if(!q)return;addMsg("user",q);const n=norm(q);
 if(/^(chao|hello|hi|xin chao|alo)\b/.test(n)){reply("Chào bạn. Bạn muốn hỏi về lệnh nào, hay cài đặt, kích hoạt, xử lý sự cố? Gõ tên lệnh (ví dụ <span class=\"k\">SDGACH</span>) hoặc mô tả việc cần làm.",START);return}
 if(/^(cam on|thanks|ok|oke)\b/.test(n)){reply("Không có gì. Cần gì thêm cứ hỏi nhé.");return}
 if(/^(tam biet|bye|goodbye)\b/.test(n)){reply("Chào bạn. Khi cần cứ mở lại trợ lý.");return}
 if(/(nen dung lenh nao|chon lenh|lenh nao|dung lenh gi|bat dau tu dau|nen lam gi truoc)/.test(n)){const f=KB.faq.find(x=>x.id==="chon-lenh");if(f){showFaq(f);return}}
 if(/(buoc tiep|tiep theo|sau do lam gi|lam gi tiep)/.test(n)&&!ctx.cmd){const f=KB.faq.find(x=>x.id==="chon-lenh");if(f){showFaq(f);return}}
 if(/(buoc tiep|tiep theo|sau do lam gi|lam gi tiep)/.test(n)&&ctx.cmd){const c=byCode(ctx.cmd),nx=after(c);if(nx.length){reply("Sau <span class=\"k\">"+esc(c.code)+"</span> trong quy trình thường là "+nx.map(x=>"<span class=\"k\">"+x+"</span>").join(" hoặc ")+". Bấm để xem.",nx.map(x=>[x,x]));return}}
 /* 1. nhắc tên lệnh hoặc lệnh tắt */
 const up=q.toUpperCase();let hit=null;const full=up.match(/\bSD[A-Z0-9]{2,}\b/g)||[];
 for(const x of full){if(byCode(x)){hit=byCode(x);break}}
 if(!hit){const words=up.split(/[^A-Z0-9]+/).filter(Boolean);if(words.length<=3){for(const w of words){const c=KB.cmds.find(x=>x.alias===w||(x.aliases||[]).includes(w));if(c){hit=c;break}}}}
 let facet=null;FACETS.forEach(([k,re])=>{if(!facet&&re.test(n))facet=k});
 if(!hit&&facet&&ctx.cmd)hit=byCode(ctx.cmd);
 if(hit){showCmd(hit,facet);return}

 if(!res.length||res[0][0]<3.2||res[0][2]<0.6){reply("Mình chưa tìm thấy nội dung khớp trong tài liệu của gói. Thử gõ tên lệnh (ví dụ <span class=\"k\">SDGACH</span>), hoặc mô tả ngắn việc cần làm (ví dụ “chia gạch cho một phòng”, “thống kê đặt hàng”). Nếu là lỗi, chép nguyên dòng báo lỗi và liên hệ nhà cung cấp.",[["Cài đặt","cài đặt"],["Kích hoạt","kích hoạt"],["Nên dùng lệnh nào?","nên dùng lệnh nào"],["Sự cố thường gặp","không thấy lệnh sau khi mở lại AutoCAD"]]);return}
 const top=res[0][1];
 if(top.kind==="cmd")showCmd(top.ref,facet);else if(top.kind==="faq")showFaq(top.ref);else showGuide(top.ref);

function welcome(){msgsEl.textContent="";ctx.cmd=null;reply("<p>Chào bạn. Mình là trợ lý hướng dẫn <b>Op Lat Tools</b>, chạy hoàn toàn trên máy bạn, không cần mạng và không gửi dữ liệu đi đâu.</p><p>Gõ tên lệnh (ví dụ <span class=\"k\">SDGACH</span>, <span class=\"k\">DGD</span>) hoặc mô tả việc cần làm. Câu trả lời lấy nguyên từ tài liệu của gói; nếu tài liệu không có, mình sẽ nói là không có thay vì đoán.</p><p>Số liệu, tiêu chuẩn và gợi ý chỉ để tham khảo; bạn tự kiểm tra và chạy thử trên bản sao bản vẽ.</p>",START)}
/* ---- danh sách bên trái ---- */
function renderList(f){const L=$("list");L.textContent="";const nf=norm(f||"");let any=false;
 const add=(title,items)=>{const rows=items.filter(([a,b])=>!nf||norm(a+" "+b).includes(nf));if(!rows.length)return;any=true;const h=document.createElement("div");h.className="grp";h.textContent=title;L.appendChild(h);rows.forEach(([a,b,q])=>{const e=document.createElement("button");e.type="button";e.className="it";e.innerHTML="<b></b><span></span>";e.firstChild.textContent=a;e.lastChild.textContent=b;e.addEventListener("click",()=>{ask(q||a);if(matchMedia("(max-width:820px)").matches)$("side").classList.add("closed")});L.appendChild(e)})};
 add("Bắt đầu",KB.topics.map(t=>[t[0],t[1],t[2]]));
 KB.groups.forEach(g=>add(g.name,KB.cmds.filter(c=>c.group===g.name).map(c=>[c.code,(c.alias&&c.alias!==c.code?c.alias+" · ":"")+c.title])));
 if(!any){const p=document.createElement("div");p.className="grp";p.textContent="Không có mục khớp";L.appendChild(p)}}
$("flt").addEventListener("input",e=>renderList(e.target.value));
$("form").addEventListener("submit",e=>{e.preventDefault();const v=$("q").value;$("q").value="";ask(v)});
$("new").addEventListener("click",welcome);$("tg").addEventListener("click",()=>$("side").classList.toggle("closed"));
$("theme").addEventListener("click",()=>{const r=document.documentElement,dark=getComputedStyle(r).colorScheme==="dark"||r.dataset.theme==="dark";r.dataset.theme=dark?"light":"dark"});
$("ver").textContent="Op Lat Tools v"+KB.version;$("foot").textContent=KB.footer;
renderList("");welcome();
if(matchMedia("(max-width:820px)").matches)$("side").classList.add("closed");
