<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}

<div class="shell">
<header><div><div class="label">Hướng dẫn chạy trên máy bạn · không cần mạng</div><h1>Trợ lý Op Lat Tools</h1>
<p>Hỏi cách dùng lệnh, cài đặt, kích hoạt, xử lý sự cố. Câu trả lời lấy nguyên từ tài liệu của gói.</p></div>
<div style="display:flex;gap:8px;align-items:center"><span class="badge" id="ver"></span><button class="mini" id="theme" type="button">Sáng / tối</button></div></header>
<div class="grid">
<aside id="side"><div class="sh"><input id="flt" type="search" placeholder="Lọc lệnh hoặc chủ đề…" aria-label="Lọc"><button class="mini tg" id="tg" type="button">Thu gọn</button></div><div class="sc" id="list"></div></aside>
<main><div class="msgs" id="msgs" aria-live="polite"></div><div class="chips" id="chips"></div><div class="note" id="foot"></div>
<form class="composer" id="form" autocomplete="off"><input id="q" placeholder="Hỏi, ví dụ: chia gạch cho một phòng, DGD, kích hoạt, lỗi không thấy lệnh" aria-label="Câu hỏi"><button class="btn" type="submit">Hỏi</button><button class="btn alt" id="new" type="button">Mới</button></form></main>
</div></div>
<script>
const KB={"version": "1.0.0", "cmds": [{"code": "SDSET", "alias": "TYLE", "group": "Lệnh cơ bản", "title": "Tỷ lệ, layer, dimstyle", "summary": "Đặt tỷ lệ bản vẽ chính và tỷ lệ chi tiết; tạo layer SD-*, text style SD-TEXT (Arial), dimstyle SD-1-<tỷ lệ>.", "steps": ["Tỷ lệ bản vẽ chính 1/… (VD 100).", "Tỷ lệ chi tiết 1/… (mặt cắt, bản mã, tiết diện; VD 25)."], "result": "Layer, text style, dimstyle được tạo; LTSCALE = tỷ lệ × 0.25. Tỷ lệ lưu trong file DWG.", "note": "Lưu ý: Nên chạy đầu tiên cho mỗi bản vẽ mới. Chiều cao chữ, kích thước của các lệnh khác tự nhân theo tỷ lệ.", "aliases": ["TYLE"], "kw": "ty le layer kieu chu dimstyle ban ve moi bat dau thiet lap"}, {"code": "SDGACH", "alias": "CHV", "group": "Lệnh cơ bản", "title": "Chia viên ốp lát", "summary": "Chia viên ốp lát đá granite / gạch trong vùng bao, cắt viên theo biên, đánh mã viên cắt.", "steps": ["Chọn đường bao (polyline kín).", "Chọn lỗ / cột / cửa (Enter nếu không có).", "Mã vật liệu, tên, W, H (viên thành phẩm), chiều dày, mạch.", "Khe chừa sát tường và quanh lỗ.", "Kiểu lát Thang / Sole / Xuongca / Chevron (chevron hỏi thêm góc vát).", "Góc xoay; điểm bắt đầu tại Tam / Mach / Goc viên.", "Viền quanh mép, viền quanh cột / lỗ (mã, bề rộng, chiều dài viên viền).", "Điểm bắt đầu chia (Enter = tâm vùng); có vẽ pát neo; có ghi mã viên nguyên; có cắt ảnh tấm đá thật (chia xong mở hộp thoại khai báo của SDANHDA)."], "result": "Viên nguyên (SD-GACH), viên cắt có mã G1-C1, G1-C2… (SD-GACH-CAT), viên viền (SD-GACH-VIEN), pát neo; nếu tích cắt ảnh: ảnh đá IMAGECLIP từng viên (SD-GACH-ANH) + sơ đồ cắt tấm.", "note": "Lưu ý: Dữ liệu viên được lưu trong bản vẽ cho SDGACHTK, SDDATHO, SDGIACONG.", "aliases": ["CHV"], "kw": "chia gach chia vien lat gach op lat mot vung mot phong polyline kin duong bao thang so le xuong ca chevron"}, {"code": "SDRAITAM", "alias": "RTA", "group": "Lệnh cơ bản", "title": "Rải panel / đá lát theo kho (tiling)", "summary": "Rải panel / đá lát theo thuật toán tiling: tấm tiêu chuẩn (lớn nhất trong kho) rải từ góc X, Y nhỏ nhất của từng ô, phủ tối đa diện tích. Phần thiếu ở mép biên (nhỏ hơn tấm tiêu chuẩn) chia bằng tấm dị hình trong kho (ít tấm nhất, tấm lớn trước, có xét số lượng kho); phần còn lại không đủ tấm nào đánh dấu gỗ bù trên layer INFILL-TIMBER. Chế độ Đá: viên nguyên + viên cắt ở mép, đánh số hiệu theo thứ tự lát, vẽ hướng vân (tiếp nối / đối gương / xoay 4 chiều).", "steps": ["Chọn chế độ Panel hoặc Da; nhập kho tấm dạng RxD:số-lượng, phân cách dấu phẩy (VD 600x1200,450x1200,400x1200:20,300x1200) — số lượng 0 hoặc bỏ trống = không hạn chế.", "Chọn hướng cạnh dài, mạch / khe, góc xoay lưới rải (độ; 0 = theo trục X), kiểu rải (Thẳng hàng hoặc So le theo hàng như gạch xây, nhập độ so le 0.5 = 1/2 tấm), (chế độ Đá: hướng vân, mã + tên + dày đá, ô cắt ảnh tấm đá thật).", "Chọn các polyline kín là ô / phòng (polyline nằm trong ô khác = lỗ, cột).", "Chọn điểm bắt đầu rải (lưới tấm đi qua điểm đó; Enter = góc X, Y nhỏ nhất của ô).", "Chọn điểm chèn bảng thống kê (Enter = bỏ qua)."], "result": "Panel: tấm tô màu theo kích thước (layer SD-PANEL), gỗ bù có đường chéo (INFILL-TIMBER), bảng mã tấm + gỗ bù + file _RaiTam.csv. Đá: viên (SD-GACH) mang dữ liệu SD_TILE nên dùng tiếp được SDGACHTK (thống kê, đặt hàng), SDDATHO (cắt từ đá thô), SDGIACONG (bản vẽ gia công).", "note": "Lưu ý: Gắn ảnh tấm đá thô (chế độ Đá): nhập kích thước thật tấm, chọn ảnh, lệnh xếp viên vào tấm (xoay 90° nếu lợi) rồi IMAGECLIP từng viên về đúng ô lát; sơ đồ cắt tấm vẽ tại điểm chèn. Ô cắt bởi cạnh xiên / cung / lỗ không chữ nhật: Panel đánh dấu gỗ bù, Đá tạo viên cắt theo hình. Hết số lượng một loại tấm thì tự dùng tổ hợp khác trong kho; hết cả kho phần còn lại thành gỗ bù. Chế độ Đá chỉ dùng viên lớn nhất trong kho làm viên lát.", "aliases": ["RTA"], "kw": "rai tam rai panel kho tam nhieu o nhieu phong go bu tam di hinh rai da theo kho"}, {"code": "SDDOCDA", "alias": "DOD", "group": "Lệnh cơ bản", "title": "Đọc mặt bằng ốp lát → ô kín + bảng viên đá", "summary": "Đọc mặt bằng ốp lát đá để tự lập danh sách các viên (ô Bỏ qua các layer loại hẳn các nét mũi bậc, thang; ô Né các vùng kín giữ nét làm biên nhưng không dựng ô, không hatch trong các vùng kín như mặt cắt mũi bậc): từ các nét rời (LINE, polyline hở hoặc kín, kể cả nét không nối khít) lệnh tách nét tại giao điểm và chỗ chữ T, nối đầu mút hở nhỏ theo dung sai rồi dựng lại các ô kín. Kết quả ghi ra bảng CSV cùng định dạng SDNHAPBANG (mỗi ô một dòng VIENDA: mã, hình, dài × rộng, góc, tâm, đỉnh) để soát và bổ sung; sau đó vẽ polyline kín và chạy SDANHDA ngay, không phải vẽ lại polyline.", "steps": ["Chế độ Doc: quét chọn các nét mặt bằng ốp lát (hoặc chọn tất cả nét trên một layer); đặt dung sai nối đầu mút hở (mm) và diện tích ô nhỏ nhất bị bỏ. Ô *Lấy mã vật liệu từ* Chữ (TEXT / MTEXT nằm trong ô, VD D1, G2; nhiều chữ lấy chữ ngắn nhất, có thể lọc theo tiền tố) hoặc Hatch (tên pattern, hoặc màu / layer với hatch đặc).", "Lệnh báo số ô dựng được (chữ nhật / vát, đa giác), ghi file _DocMatBang.csv; tích Đánh số để có T1, T2... trên bản vẽ giúp đối chiếu với bảng.", "Mở bảng bằng Excel: sửa kích thước, đặt bo = 1 cho cột / lỗ / ô thừa, thêm dòng CN (cx;cy;dai;rong;goc) cho ô còn thiếu. Lưu CSV.", "Chạy lại SDDOCDA chế độ Ve: chọn file bảng, lệnh vẽ polyline kín (layer SD-GACH-DOC); tích Chạy SDANHDA để cắt ảnh tấm đá thật luôn (vân song song lưới khi các ô cùng hướng). Hoặc tích Vẽ luôn ở chế độ Doc để bỏ qua bước soát."], "result": "Bảng _DocMatBang.csv (có cột mavl = mã vật liệu); polyline kín từng viên trên layer SD-GACH-DOC (dùng được cho SDANHDA, SDTKDA, SDVANDA); khi có mã vật liệu gắn thêm dữ liệu SD_TILE (viên nguyên / viên cắt, mã viên cắt D1-C1...) nên SDGACHTK, SDDATHO, SDGIACONG dùng được; số hiệu T1... theo thứ tự lát ngoằn nghèo. Chế độ Kiem khoanh đỏ trên layer SD-KIEMTRA các chỗ hở gần khép (đầu mút cách nét 1 - 4 lần dung sai), đầu mút treo, ô mảnh vụn, ô lệch kích thước so với ô chuẩn, ô lớn nghi thiếu nét chia.", "note": "Lưu ý: Lỗ / cột bên trong ô: tích *Khoét lỗ / cột* (mặc định bật) — ô chứa lỗ (lỗ nằm trọn trong ô, không chạm biên) được cắt theo đường qua tâm lỗ thành các viên lõm hình chữ U (IMAGECLIP nhận đa giác lõm nên cắt ảnh sát cột), lỗ vẫn là ô riêng — đặt bo = 1 nếu là cột; lỗ không lồi hoặc nhiều lỗ chồng nhau theo hướng cắt thì giữ nguyên ô. Đọc được LINE, polyline (kể cả cung), ARC, CIRCLE, SPLINE, ELLIPSE (chia nhỏ 5°); khi vẽ lại, dãy đỉnh đều nhau được nhận lại thành cung (bulge) nên ô tròn / bo góc vẫn tròn. Xuất JSON (tích Xuất JSON) để AI bên ngoài đọc PDF / ảnh mặt bằng rồi điền vào đúng định dạng; Ve chọn file .json. Mã vật liệu: ô chưa có mã dùng ô *Mã VL mặc định* (để trống thì không gắn SD_TILE); viên nguyên = kích thước chữ nhật gặp nhiều nhất của mã đó, hình chữ nhật khác là viên cắt C, đa giác là viên cắt D. Hở lớn hơn dung sai thì ô không khép kín: tăng dung sai hoặc vẽ thêm nét.", "aliases": ["DOD"], "kw": "doc mat bang net roi line roi polyline ho chua co polyline khong ve lai dung o kin bang csv"}, {"code": "SDANHDA", "alias": "ADA", "group": "Lệnh cơ bản", "title": "Cắt ảnh đá vào viên (IMAGECLIP)", "summary": "Cắt ảnh chụp tấm đá thô bằng IMAGECLIP cho hàng loạt viên ốp lát đã có trên bản vẽ (polyline kín, kể cả viên đặt xéo 45°): xếp các viên vào tấm đá theo kích thước thật (ít hao hoặc theo thứ tự lát để vân gần nhau), xoay mảnh ảnh theo góc viên và chiều vân, đặt đúng vị trí từng viên.", "steps": ["Tích lấy kích thước tấm từ ảnh đã chèn (đúng tỷ lệ thật) hoặc nhập dài × rộng; xén biên, bề rộng lưỡi cắt; chọn chiều vân (Toiuu / Doc / Ngang) và cách xếp (Toiuu / Thutu / Duongviem = chạy dọc đường viền, vân liên tục). Với cách xếp Toiuu chọn Độ kỹ: Nhanh / Cân bằng (thử 30 tổ hợp, mặc định) / Kỹ (leo đồi, ~6 giây).", "Chọn ảnh tấm đá đã chèn (IMAGEATTACH hoặc HA...): chọn nhiều ảnh cùng kích thước = nhiều tấm khác vân.", "Quét chọn vùng có nhiều polyline viên đá.", "Chọn điểm đặt sơ đồ cắt tấm (Enter = bỏ qua)."], "result": "Mỗi viên có một bản sao ảnh được IMAGECLIP đúng hình viên (layer SD-GACH-ANH); sơ đồ cắt tấm đá (SD-GACH-NEST) có số hiệu viên T1, T2...; báo số tấm cần và % hao.", "note": "Lưu ý: Ảnh phải có góc xoay 0 và đúng tỷ lệ tấm thật. Viên được xếp theo khung chữ nhật quanh cạnh dài nhất. Chiều vân chỉ xoay theo bội 90° so với cạnh dài viên. Cách xếp Toiuu = cắt xuyên (guillotine) cho máy cắt đá cầu: viên lớn trước, viên nhỏ lấp vào phế liệu hình L / vụn; sơ đồ có số thứ tự đường cắt (tách miếng lớn trước, viên nhỏ cắt sau cùng) và các ô phế liệu còn dùng được (layer SD-DUONG-CAT).", "aliases": ["ADA"], "kw": "anh tam da cat anh imageclip van that anh chup tam da hao it xep tam"}, {"code": "SDVANDA", "alias": "VDA", "group": "Lệnh cơ bản", "title": "Hatch vân đá (.pat)", "summary": "Phủ hatch vân đá (file .pat: Platinus, DaSocDua, ViaLactea, DaVanGoXam, DaVanGoCo hoặc pattern khác) lên các viên lát đã có (SDGACH / SDRAITAM), kèm nền (Platinus nền ACI 252, Via Lactea nền đen) và tỷ lệ / màu khuyến nghị theo pattern.", "steps": ["Chọn pattern + tỷ lệ (0 = khuyến nghị) + hướng vân.", "Chọn các viên (Enter = tất cả viên trên layer SD-GACH / SD-GACH-CAT)."], "result": "Hatch trên layer SD-GACH-VAN. Tiếp nối: vân chạy liên tục qua các viên; Đối gương / Xoay 4 chiều / Ngẫu nhiên: vân quay theo từng viên (hatch không lật gương nên Đối gương là xấp xỉ).", "note": "Lưu ý: Các file .pat nằm trong thư mục dist (SDMENU đã thêm vào Support Path). Báo lỗi nếu AutoCAD không tìm thấy file .pat.", "aliases": ["VDA"], "kw": "hatch van da pat chua co anh khong co anh van gia"}, {"code": "SDGACHTK", "alias": "TKV", "group": "Lệnh cơ bản", "title": "Thống kê viên, đặt hàng", "summary": "Bảng thống kê viên ốp lát và dự trù số viên đặt hàng (khi mua viên thành phẩm).", "steps": ["Chọn viên (Enter = tất cả).", "Bề rộng mạch cắt máy.", "% hao hụt.", "Điểm chèn bảng."], "result": "Bảng mã viên, loại, kích thước, số lượng, diện tích, pát; dòng đặt hàng: số viên, m². File _ThongKeOpLat.csv.", "note": "", "aliases": ["TKV"], "kw": "thong ke dat hang so luong vi
