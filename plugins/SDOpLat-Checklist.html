<h1>Checklist thử SDOpLat trên AutoCAD thật</h1>
<p class="mut">Với mỗi lệnh: chạy theo các bước, rồi bấm <b>Đạt</b> / <b>Lỗi</b> / <b>Bỏ qua</b>. Khi lỗi, ghi vào ô ghi chú: phiên bản AutoCAD, các dòng lệnh hiện ra, bước nào lỗi. Dữ liệu lưu ngay trong trình duyệt này; bấm <b>Xuất CSV</b> để gửi lại kết quả.</p>
<div class="bar"><span class="sum" id="sum"></span><select id="flt"><option value="">Tất cả</option><option value="none">Chưa thử</option><option value="bad">Lỗi</option><option value="ok">Đạt</option></select><button id="exp">Xuất CSV</button><button id="rst">Xóa kết quả</button></div>

<script>
const D={"sections": [["Chuẩn bị", ["Ghi lại: phiên bản AutoCAD (gõ ABOUT), Windows, có Excel không", "Mở bản vẽ thử gồm: 1 hình chữ nhật 4×5 m, 1 hình có cột/lỗ, 1 vùng bất quy tắc; chuẩn bị 1 ảnh tấm đá (Maps\\Xam-van-go_2450x1170.jpg) đúng tỷ lệ thật", "Sao lưu bản vẽ thật trước khi thử trên bản thật"]], ["Cài đặt và nạp", ["APPLOAD nạp SDOpLat.lsp (hoặc .fas nếu đã biên dịch): có dòng \"da nap\", không báo lỗi", "Gõ SDHELP: hiện danh sách lệnh đủ 3 nhóm; SDPANEL mở hộp thoại, bấm thử vài lệnh từ đây", "SDMENU: nạp menu + toolbar; kiểm tra pull-down \"SDOpLat\" và toolbar ốp lát hiện, icon hiện đúng", "Đóng AutoCAD, mở lại: lệnh còn không? (nếu đã SDMENU/SDTUNAP)", "SDTUNAP bật/tắt tự nạp; kiểm tra file acaddoc.lsp không bị ghi trùng sau khi bật 2 lần", "SDMENUXOA gỡ sạch menu/toolbar", "Lệnh tắt (vd CHV, RTA, ADA, HDI): chạy đúng như lệnh đầy đủ", "SDDLG tắt hộp thoại: lệnh chuyển sang nhập trên dòng lệnh; bật lại bình thường"]], ["Khóa bản quyền (chỉ với bản build --licensed)", ["Chưa kích hoạt: chạy lệnh khóa (vd SDGACH) → hiện \"Bản dùng thử: còn x / 10 lần\" và lệnh vẫn chạy", "Chạy tiếp đủ số lần dùng thử: lần thứ 11 bị chặn, hiện Mã máy", "SDKICHHOAT hiện Mã máy dạng XXXX-XXXX-XXXX; ghi lại gửi cho người bán", "Nhập mã sai: báo sai, vẫn bị khóa", "Nhập mã đúng (tạo bằng sdoplat_keygen.py): \"Kích hoạt thành công\", lệnh chạy không còn thông báo dùng thử", "Đóng AutoCAD, mở lại: vẫn đã kích hoạt", "Gõ (sd:lic-selftest): in \"OK\"", "Xóa registry HKCU\\Software\\SDOpLat\\Uses và file %APPDATA%\\SDOpLat.dat → bộ đếm dùng thử về 0 (đã biết giới hạn); sửa tay giá trị Uses → bị coi hết lượt", "Bản .fas: không còn file .lsp trong gói, APPLOAD .fas vẫn chạy đủ lệnh"]]], "cmds": [{"code": "SDGACH", "alias": "CHV", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Chia vien: thang/so le/xuong ca/chevron, vien, khe", "summary": "Chia viên ốp lát đá granite / gạch trong vùng bao, cắt viên theo biên, đánh mã viên cắt.", "steps": ["Chọn đường bao (polyline kín).", "Chọn lỗ / cột / cửa (Enter nếu không có).", "Mã vật liệu, tên, W, H (viên thành phẩm), chiều dày, mạch.", "Khe chừa sát tường và quanh lỗ.", "Kiểu lát Thang / Sole / Xuongca / Chevron (chevron hỏi thêm góc vát).", "Góc xoay; điểm bắt đầu tại Tam / Mach / Goc viên.", "Viền quanh mép, viền quanh cột / lỗ (mã, bề rộng, chiều dài viên viền).", "Điểm bắt đầu chia (Enter = tâm vùng); có vẽ pát neo; có ghi mã viên nguyên; có cắt ảnh tấm đá thật (chia xong mở hộp thoại khai báo của SDANHDA)."], "result": "Viên nguyên (SD-GACH), viên cắt có mã G1-C1, G1-C2… (SD-GACH-CAT), viên viền (SD-GACH-VIEN), pát neo; nếu tích cắt ảnh: ảnh đá IMAGECLIP từng viên (SD-GACH-ANH) + sơ đồ cắt tấm.", "note": "Lưu ý: Dữ liệu viên được lưu trong bản vẽ cho SDGACHTK, SDDATHO, SDGIACONG.", "extra": ""}, {"code": "SDRAITAM", "alias": "RTA", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Rai panel / da lat theo kho: tam lon tu goc, tam di hinh mep bien, go bu, huong van", "summary": "Rải panel / đá lát theo thuật toán tiling: tấm tiêu chuẩn (lớn nhất trong kho) rải từ góc X, Y nhỏ nhất của từng ô, phủ tối đa diện tích. Phần thiếu ở mép biên (nhỏ hơn tấm tiêu chuẩn) chia bằng tấm dị hình trong kho (ít tấm nhất, tấm lớn trước, có xét số lượng kho); phần còn lại không đủ tấm nào đánh dấu gỗ bù trên layer INFILL-TIMBER. Chế độ Đá: viên nguyên + viên cắt ở mép, đánh số hiệu theo thứ tự lát, vẽ hướng vân (tiếp nối / đối gương / xoay 4 chiều).", "steps": ["Chọn chế độ Panel hoặc Da; nhập kho tấm dạng RxD:số-lượng, phân cách dấu phẩy (VD 600x1200,450x1200,400x1200:20,300x1200) — số lượng 0 hoặc bỏ trống = không hạn chế.", "Chọn hướng cạnh dài, mạch / khe, góc xoay lưới rải (độ; 0 = theo trục X), kiểu rải (Thẳng hàng hoặc So le theo hàng như gạch xây, nhập độ so le 0.5 = 1/2 tấm), (chế độ Đá: hướng vân, mã + tên + dày đá, ô cắt ảnh tấm đá thật).", "Chọn các polyline kín là ô / phòng (polyline nằm trong ô khác = lỗ, cột).", "Chọn điểm bắt đầu rải (lưới tấm đi qua điểm đó; Enter = góc X, Y nhỏ nhất của ô).", "Chọn điểm chèn bảng thống kê (Enter = bỏ qua)."], "result": "Panel: tấm tô màu theo kích thước (layer SD-PANEL), gỗ bù có đường chéo (INFILL-TIMBER), bảng mã tấm + gỗ bù + file _RaiTam.csv. Đá: viên (SD-GACH) mang dữ liệu SD_TILE nên dùng tiếp được SDGACHTK (thống kê, đặt hàng), SDDATHO (cắt từ đá thô), SDGIACONG (bản vẽ gia công).", "note": "Lưu ý: Gắn ảnh tấm đá thô (chế độ Đá): nhập kích thước thật tấm, chọn ảnh, lệnh xếp viên vào tấm (xoay 90° nếu lợi) rồi IMAGECLIP từng viên về đúng ô lát; sơ đồ cắt tấm vẽ tại điểm chèn. Ô cắt bởi cạnh xiên / cung / lỗ không chữ nhật: Panel đánh dấu gỗ bù, Đá tạo viên cắt theo hình. Hết số lượng một loại tấm thì tự dùng tổ hợp khác trong kho; hết cả kho phần còn lại thành gỗ bù. Chế độ Đá chỉ dùng viên lớn nhất trong kho làm viên lát.", "extra": ""}, {"code": "SDDOCDA", "alias": "DOD", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Doc mat bang op lat: dung lai o kin tu net roi, ghi bang CSV de soat / bo sung, ve polyline kin, chay SDANHDA", "summary": "Đọc mặt bằng ốp lát đá để tự lập danh sách các viên (ô Bỏ qua các layer loại hẳn các nét mũi bậc, thang; ô Né các vùng kín giữ nét làm biên nhưng không dựng ô, không hatch trong các vùng kín như mặt cắt mũi bậc): từ các nét rời (LINE, polyline hở hoặc kín, kể cả nét không nối khít) lệnh tách nét tại giao điểm và chỗ chữ T, nối đầu mút hở nhỏ theo dung sai rồi dựng lại các ô kín. Kết quả ghi ra bảng CSV cùng định dạng SDNHAPBANG (mỗi ô một dòng VIENDA: mã, hình, dài × rộng, góc, tâm, đỉnh) để soát và bổ sung; sau đó vẽ polyline kín và chạy SDANHDA ngay, không phải vẽ lại polyline.", "steps": ["Chế độ Doc: quét chọn các nét mặt bằng ốp lát (hoặc chọn tất cả nét trên một layer); đặt dung sai nối đầu mút hở (mm) và diện tích ô nhỏ nhất bị bỏ. Ô *Lấy mã vật liệu từ* Chữ (TEXT / MTEXT nằm trong ô, VD D1, G2; nhiều chữ lấy chữ ngắn nhất, có thể lọc theo tiền tố) hoặc Hatch (tên pattern, hoặc màu / layer với hatch đặc).", "Lệnh báo số ô dựng được (chữ nhật / vát, đa giác), ghi file _DocMatBang.csv; tích Đánh số để có T1, T2... trên bản vẽ giúp đối chiếu với bảng.", "Mở bảng bằng Excel: sửa kích thước, đặt bo = 1 cho cột / lỗ / ô thừa, thêm dòng CN (cx;cy;dai;rong;goc) cho ô còn thiếu. Lưu CSV.", "Chạy lại SDDOCDA chế độ Ve: chọn file bảng, lệnh vẽ polyline kín (layer SD-GACH-DOC); tích Chạy SDANHDA để cắt ảnh tấm đá thật luôn (vân song song lưới khi các ô cùng hướng). Hoặc tích Vẽ luôn ở chế độ Doc để bỏ qua bước soát."], "result": "Bảng _DocMatBang.csv (có cột mavl = mã vật liệu); polyline kín từng viên trên layer SD-GACH-DOC (dùng được cho SDANHDA, SDTKDA, SDVANDA); khi có mã vật liệu gắn thêm dữ liệu SD_TILE (viên nguyên / viên cắt, mã viên cắt D1-C1...) nên SDGACHTK, SDDATHO, SDGIACONG dùng được; số hiệu T1... theo thứ tự lát ngoằn nghèo. Chế độ Kiem khoanh đỏ trên layer SD-KIEMTRA các chỗ hở gần khép (đầu mút cách nét 1 - 4 lần dung sai), đầu mút treo, ô mảnh vụn, ô lệch kích thước so với ô chuẩn, ô lớn nghi thiếu nét chia.", "note": "Lưu ý: Lỗ / cột bên trong ô: tích *Khoét lỗ / cột* (mặc định bật) — ô chứa lỗ (lỗ nằm trọn trong ô, không chạm biên) được cắt theo đường qua tâm lỗ thành các viên lõm hình chữ U (IMAGECLIP nhận đa giác lõm nên cắt ảnh sát cột), lỗ vẫn là ô riêng — đặt bo = 1 nếu là cột; lỗ không lồi hoặc nhiều lỗ chồng nhau theo hướng cắt thì giữ nguyên ô. Đọc được LINE, polyline (kể cả cung), ARC, CIRCLE, SPLINE, ELLIPSE (chia nhỏ 5°); khi vẽ lại, dãy đỉnh đều nhau được nhận lại thành cung (bulge) nên ô tròn / bo góc vẫn tròn. Xuất JSON (tích Xuất JSON) để AI bên ngoài đọc PDF / ảnh mặt bằng rồi điền vào đúng định dạng; Ve chọn file .json. Mã vật liệu: ô chưa có mã dùng ô *Mã VL mặc định* (để trống thì không gắn SD_TILE); viên nguyên = kích thước chữ nhật gặp nhiều nhất của mã đó, hình chữ nhật khác là viên cắt C, đa giác là viên cắt D. Hở lớn hơn dung sai thì ô không khép kín: tăng dung sai hoặc vẽ thêm nét.", "extra": "Kiểm tra các ô kề nhau trùng đỉnh (chạy SDHANDINH không còn thay đổi gì)."}, {"code": "SDANHDA", "alias": "ADA", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Cat anh tam da (imageclip) vao cac vien da quet chon: chieu van, xep it hao", "summary": "Cắt ảnh chụp tấm đá thô bằng IMAGECLIP cho hàng loạt viên ốp lát đã có trên bản vẽ (polyline kín, kể cả viên đặt xéo 45°): xếp các viên vào tấm đá theo kích thước thật (ít hao hoặc theo thứ tự lát để vân gần nhau), xoay mảnh ảnh theo góc viên và chiều vân, đặt đúng vị trí từng viên.", "steps": ["Tích lấy kích thước tấm từ ảnh đã chèn (đúng tỷ lệ thật) hoặc nhập dài × rộng; xén biên, bề rộng lưỡi cắt; chọn chiều vân (Toiuu / Doc / Ngang) và cách xếp (Toiuu / Thutu / Duongviem = chạy dọc đường viền, vân liên tục). Với cách xếp Toiuu chọn Độ kỹ: Nhanh / Cân bằng (thử 30 tổ hợp, mặc định) / Kỹ (leo đồi, ~6 giây).", "Chọn ảnh tấm đá đã chèn (IMAGEATTACH hoặc HA...): chọn nhiều ảnh cùng kích thước = nhiều tấm khác vân.", "Quét chọn vùng có nhiều polyline viên đá.", "Chọn điểm đặt sơ đồ cắt tấm (Enter = bỏ qua)."], "result": "Mỗi viên có một bản sao ảnh được IMAGECLIP đúng hình viên (layer SD-GACH-ANH); sơ đồ cắt tấm đá (SD-GACH-NEST) có số hiệu viên T1, T2...; báo số tấm cần và % hao.", "note": "Lưu ý: Ảnh phải có góc xoay 0 và đúng tỷ lệ tấm thật. Viên được xếp theo khung chữ nhật quanh cạnh dài nhất. Chiều vân chỉ xoay theo bội 90° so với cạnh dài viên. Cách xếp Toiuu = cắt xuyên (guillotine) cho máy cắt đá cầu: viên lớn trước, viên nhỏ lấp vào phế liệu hình L / vụn; sơ đồ có số thứ tự đường cắt (tách miếng lớn trước, viên nhỏ cắt sau cùng) và các ô phế liệu còn dùng được (layer SD-DUONG-CAT).", "extra": ""}, {"code": "SDVANDA", "alias": "VDA", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Hatch van da (file .pat) len vien: tiep noi / doi guong / xoay 4 chieu", "summary": "Phủ hatch vân đá (file .pat: Platinus, DaSocDua, ViaLactea, DaVanGoXam, DaVanGoCo hoặc pattern khác) lên các viên lát đã có (SDGACH / SDRAITAM), kèm nền (Platinus nền ACI 252, Via Lactea nền đen) và tỷ lệ / màu khuyến nghị theo pattern.", "steps": ["Chọn pattern + tỷ lệ (0 = khuyến nghị) + hướng vân.", "Chọn các viên (Enter = tất cả viên trên layer SD-GACH / SD-GACH-CAT)."], "result": "Hatch trên layer SD-GACH-VAN. Tiếp nối: vân chạy liên tục qua các viên; Đối gương / Xoay 4 chiều / Ngẫu nhiên: vân quay theo từng viên (hatch không lật gương nên Đối gương là xấp xỉ).", "note": "Lưu ý: Các file .pat nằm trong thư mục dist (SDMENU đã thêm vào Support Path). Báo lỗi nếu AutoCAD không tìm thấy file .pat.", "extra": ""}, {"code": "SDGACHTK", "alias": "TKV", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Thong ke vien + du tru dat hang", "summary": "Bảng thống kê viên ốp lát và dự trù số viên đặt hàng (khi mua viên thành phẩm).", "steps": ["Chọn viên (Enter = tất cả).", "Bề rộng mạch cắt máy.", "% hao hụt.", "Điểm chèn bảng."], "result": "Bảng mã viên, loại, kích thước, số lượng, diện tích, pát; dòng đặt hàng: số viên, m². File _ThongKeOpLat.csv.", "note": "", "extra": ""}, {"code": "SDTKDA", "alias": "TKD", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Quet polyline vien da cat: bang thong ke theo nhom kich thuoc, chi tiet tung vien, CSV", "summary": "Quét các polyline viên đá cắt và xuất bảng thống kê: gom nhóm theo kích thước (dài × rộng, hình chữ nhật hay vát / đa giác), số lượng, diện tích 1 viên, tổng diện tích, cạnh mài (chu vi); bảng chi tiết từng viên kèm mã T.. và số tấm đá nếu đã chạy SDANHDA; xuất CSV.", "steps": ["Chọn phạm vi (quét chọn polyline, hoặc tất cả polyline kín trên layer SD-GACH / SD-GACH-CAT / SD-GACH-VIEN), dung sai gom nhóm kích thước.", "Chọn chia theo loại hatch đá (tên pattern, hatch đặc thì theo màu / layer), bỏ viên chồng nhau, có thêm bảng chi tiết và CSV.", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng thống kê theo nhóm V1, V2... (kích thước, hình dạng, SL, diện tích, tổng diện tích, cạnh mài) + dòng tổng cộng; bảng chi tiết từng viên; file _ThongKeDa.csv.", "note": "Lưu ý: Đọc trực tiếp hình học polyline nên dùng được cho cả viên tự vẽ (không cần dữ liệu SD_TILE như SDGACHTK). Từ 2.55.0: mỗi viên lấy một loại hatch (ưu tiên hatch có pattern, rồi hatch có khung bao nhỏ nhất chứa tâm viên) nên nhiều hatch chồng nhau không làm đếm trùng viên; polyline chồng đúng vị trí và diện tích chỉ tính một lần. Hatch phủ nhiều viên được nhận theo khung bao nên có thể nhận nhầm khi hatch lớn trùm cả viên khác loại. Kích thước lấy theo cạnh dài nhất của viên; viên vát (hình thang) ghi là Vát / đa giác với khung bao. Cột tấm đá chỉ có sau SDANHDA.", "extra": ""}, {"code": "SDDOCDATK", "alias": "DTK", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Thong ke vien da sau SDDOCDA: bang nhom kich thuoc, dat tam da, CSV", "summary": "Thống kê viên đá sau SDDOCDA kiểu SDGACHTK: gom nhóm theo kích thước, số lượng, diện tích, rồi ước tính số tấm đá cần đặt (cộng hao hụt %).", "steps": ["Nhập kích thước tấm đá, hao hụt %, dung sai gom nhóm.", "Quét chọn polyline viên (Enter = tất cả trên layer SD-GACH / SD-GACH-CAT / SD-GACH-VIEN / SD-GACH-DOC).", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng V1, V2... (kích thước, SL, diện tích) + dòng tổng và dòng đặt hàng; file _ThongKeVienDa.csv.", "note": "Lưu ý: Số tấm đặt chỉ ước tính theo diện tích, không phải kết quả xếp tấm (số thật xem SDANHDATK). Đọc hình học polyline nên không cần dữ liệu SD_TILE. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDANHDATK", "alias": "ATK", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Thong ke tam da sau SDANHDA: so vien, hao hut tung tam, dat tam, CSV", "summary": "Thống kê tấm đá sau SDANHDA kiểu SDGACHTK: mỗi tấm đá số mấy có bao nhiêu viên, diện tích dùng, hao hụt từng tấm, và số tấm cần đặt (cộng hao hụt %).", "steps": ["Nhập kích thước tấm đá, hao hụt %.", "Quét chọn polyline viên (Enter = tất cả trên layer viên).", "Chọn điểm chèn bảng (Enter = chỉ in dòng lệnh + CSV)."], "result": "Bảng theo tấm đá số (số viên, diện tích, hao hụt tấm) + dòng đặt hàng; file _ThongKeTamDa.csv.", "note": "Lưu ý: Dùng dữ liệu SDANHDA lưu trong bản vẽ; viên chưa ghép được hiện là chưa gán. Kích thước tấm nhập tay phải đúng tấm đã dùng khi chạy SDANHDA. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDQUYTRINH", "alias": "QTR", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Hop thoai quy trinh da lat: goi y buoc tiep theo, chay tung buoc hoac lien hoan", "summary": "Hộp thoại DCL thông minh cho quy trình đá lát: đọc trạng thái bản vẽ (số viên, ảnh tấm đá, ảnh đã cắt, hatch vân), gợi ý bước tiếp theo (đánh dấu <== gợi ý) và cho ra lệnh liên hoàn: chạy một bước hoặc tích nhiều bước rồi chạy lần lượt; sau mỗi bước quay lại hộp thoại.", "steps": ["Chọn một bước (hoặc tích nhiều bước bằng Ctrl / Shift).", "Bấm Chạy bước chọn hoặc Chạy liên hoàn.", "Làm theo hộp thoại / dòng nhắc của từng lệnh; xong tự quay lại hộp thoại; bấm Đóng để thoát."], "result": "Các bước: SDRAITAM, SDGACH, SDDOCDA, SDANHDA, SDVANDA, SDGACHTK, SDDATHO, SDGIACONG, SDKTLAT; dòng thông tin trạng thái và gợi ý ở đầu hộp thoại.", "note": "Lưu ý: Hướng dẫn chi tiết từng bước: file HuongDanQuyTrinhDa.md trong thư mục cài đặt. Esc trong một bước chỉ dừng bước đó, chuỗi vẫn tiếp tục ở bước kế.", "extra": ""}, {"code": "SDKTLAT", "alias": "KLT", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Kiem tra ban ve lat: vien cat hep / nho, ron khong deu, o thieu ma vat lieu", "summary": "Kiểm tra nhanh bản vẽ lát đá / gạch: viên cắt hẹp hơn ngưỡng, viên cắt nhỏ hơn một tỷ lệ so với viên nguyên, ron không đều giữa các viên kề nhau, viên chưa có mã vật liệu (SD_TILE).", "steps": ["Quét chọn các polyline viên.", "Đặt ngưỡng viên hẹp (mm), viên nhỏ (% viên nguyên), độ lệch ron cho phép.", "Xem số viên và mối nối có vấn đề, khoanh đỏ trên layer SD-KIEMTRA và file _KiemTraLat.csv."], "result": "Dòng lệnh báo viên nguyên (diện tích), số viên cắt hẹp, viên cắt nhỏ, mối nối ron không đều (so với ron phổ biến nhất), viên chưa có mã vật liệu; khoanh đỏ HEP / NHO / RON; CSV từng vấn đề.", "note": "Lưu ý: Viên nguyên được lấy là hình chữ nhật xuất hiện nhiều nhất trong vùng chọn. Từ 2.57.0: nhập \"Khe giãn nở chu vi tối thiểu\" (> 0) rồi chọn polyline biên để báo viên sát tường cách tường nhỏ hơn khe, và chỗ hai viên khác mã vật liệu (SD_TILE) có ron nhỏ hơn khe. Ngưỡng mặc định (50 mm, 15%) chỉ là giá trị khởi đầu, bạn nên đặt theo quy định của dự án.", "extra": "Thử thêm ô \"khe giãn nở\": nhập > 0, chọn polyline biên; vòng đỏ ở viên sát tường hoặc chỗ đổi vật liệu."}, {"code": "SDVAN", "alias": "LTV", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Kiem tra van da lien tuc giua cac vien ke nhau (dua vao vi tri cat tren tam), khoanh moi noi dut van", "summary": "Kiểm tra vân đá có liên tục giữa các viên kề nhau không, dựa trên vị trí mỗi viên được cắt trên tấm đá thô (SDANHDA ghi lại tấm số mấy, vị trí và hướng xoay). Hai viên kề nhau coi là liền vân khi cùng một tấm, cùng hướng và vị trí tương đối trên tấm khớp với vị trí tương đối trên bản vẽ (sai số cho phép đặt được).", "steps": ["Chạy SDANHDA trước (cách xếp Theo thứ tự lát hoặc Chạy dọc đường viền cho vân liền nhiều nhất).", "Chạy SDVAN, đặt khoảng cách ron tối đa giữa hai viên kề nhau và sai số vị trí cho phép; quét chọn các polyline viên.", "Xem số mối nối liền vân, mối nối đứt theo lý do, khoanh đỏ trên layer SD-KIEMTRA và file _KiemTraVan.csv."], "result": "Dòng lệnh báo tỷ lệ mối nối liền vân và đếm theo lý do (khác tấm đá, khác hướng vân, lệch vị trí trên tấm, không có dữ liệu cắt); khoanh đỏ tại các mối nối đứt; CSV liệt kê từng cặp viên.", "note": "Lưu ý: Chỉ dùng dữ liệu của lần SDANHDA gần nhất. Dùng để so sánh các cách xếp (Toiuu ra ít tấm nhất nhưng vân đứt nhiều; Thutu giữ vân tốt hơn). Từ 2.57.0: tích \"Ghép vân đối xứng (bookmatch)\" để kiểm hai viên kề nhau có cắt từ hai tấm liên tiếp (số tấm hơn kém 1), cùng hướng và cùng vị trí trên tấm; chỉ kiểm quan hệ vị trí này, không so hình ảnh vân.", "extra": "Thử thêm tùy chọn bookmatch (cần đã chạy SDANHDA với ≥ 2 tấm)."}, {"code": "SDDIEMBD", "alias": "DBT", "group": "Quy trình ốp lát chính (thử trước)", "desc": "So sanh diem bat dau rai luoi vien: so vien cat, vien cat hep, hao hut; goi y diem tot nhat", "summary": "So sánh các điểm bắt đầu rải lưới viên trong một vùng lát (có thể có lỗ / cột): 4 góc, tâm viên ở tâm, mạch ở tâm (chế độ Kỹ thêm 25 điểm quét trong một chu kỳ lưới). Với mỗi điểm lệnh đếm số viên nguyên, viên cắt, viên cắt hẹp hơn ngưỡng, cạnh hẹp nhất và hao hụt, rồi xếp hạng: ít viên hẹp nhất, ít viên cắt nhất, ít hao hụt nhất.", "steps": ["Nhập kích thước viên, ron, hướng lưới (theo trục, theo cạnh dài nhất, hoặc nhập góc), ngưỡng viên hẹp, độ kỹ.", "Chọn polyline kín là biên vùng lát, rồi quét chọn các lỗ / cột (Enter nếu không có).", "Xem bảng xếp hạng, điểm tốt nhất được khoanh trên bản vẽ (layer SD-DIEMBD); dùng điểm đó làm điểm bắt đầu trong SDRAITAM / SDGACH."], "result": "Bảng tối đa 8 điểm tốt nhất trên dòng lệnh (nguyên, cắt, cắt hẹp, cạnh hẹp nhất, hao hụt %); vòng tròn và nhãn tại điểm tốt nhất.", "note": "Lưu ý: Chỉ xét lưới viên thẳng (không so le, xương cá). Từ 2.57.0: ô \"Khe sát tường\" lùi biên vào (lỗ / cột nở ra) trước khi đánh giá điểm bắt đầu. Hao hụt = phần viên cắt không dùng / tổng diện tích viên. Vùng lớn, chế độ Kỹ có thể chạy vài chục giây.", "extra": "Thử thêm ô \"Khe sát tường\" > 0: biên lùi vào, lỗ/cột nở ra."}, {"code": "SDKHEGIAN", "alias": "KCG", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Khe co gian: khe sat tuong va khe phan vung vung lat, chong chiu dai toi da giua cac khe", "summary": "Vẽ khe co giãn cho vùng lát: khe sát tường (lùi vào theo biên) và khe phân vùng chia đều sao cho khoảng cách giữa các khe không vượt giá trị tối đa; có thể căn khe vào giữa ron của lưới viên. Khe phân vùng được cắt theo biên và tránh lỗ / cột.", "steps": ["Nhập khe sát tường, khoảng cách tối đa giữa các khe, bề rộng khe, kích thước viên và ron (nếu cần căn vào ron).", "Chọn polyline kín là biên vùng lát và các lỗ / cột."], "result": "Polyline khe trên layer SD-KHE (khe phân vùng có bề rộng nét bằng bề rộng khe); dòng lệnh báo số khe, tổng chiều dài và số ô phân vùng.", "note": "Lưu ý: Khe phân vùng là các đường thẳng theo trục X, Y qua cả vùng, chưa tính khe theo hình dạng riêng. Khoảng cách tối đa mặc định 6000 mm chỉ là giá trị khởi đầu, đặt theo quy định vật liệu và vị trí (trong nhà, ngoài trời, sàn có sưởi).", "extra": ""}, {"code": "SDHANDINH", "alias": "HDI", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Han dinh: gop dinh polyline lech nhau o cung diem giao cat, chen dinh nut chu T", "summary": "Hàn đỉnh: các polyline sinh ra từ cùng một điểm giao cắt phải có đỉnh trùng nhau. Gộp các đỉnh lệch nhau (sai số làm tròn hoặc vài phần mm) về một tọa độ chung, và chèn đỉnh vào cạnh polyline kề bên ở các nút chữ T.", "steps": ["Nhập dung sai hàn đỉnh (mặc định 0.5 mm) và chọn có chèn đỉnh nút chữ T hay không.", "Quét chọn polyline (Enter = tất cả polyline trong Model).", "Xem dòng lệnh: số đỉnh đã hàn, số đỉnh T đã chèn, số polyline đã sửa."], "result": "Mọi đỉnh trong dung sai dùng chung đúng một tọa độ; cạnh polyline đi qua đỉnh của polyline kề bên đều có đỉnh tại đó. Hình dạng chỉ lệch tối đa bằng dung sai.", "note": "Lưu ý: Từ 2.58.0 SDDOCDA tự giữ đỉnh nút chữ T khi dựng ô nên các ô không còn lệch đỉnh; dùng SDHANDINH cho bản vẽ cũ hoặc polyline sinh từ lệnh khác (SDGACH...). Không chèn đỉnh vào cạnh cung (bulge). Chưa thử trên AutoCAD thật; thuật toán đã mô phỏng trên bản vẽ mẫu: 127 nút lệch tọa độ và 778 chỗ lệch nút T về 0.", "extra": "Thử trên bản vẽ có polyline lệch đỉnh (vd file V6.dxf): sau lệnh, đỉnh các polyline kề nhau phải trùng; U hoàn tác được."}, {"code": "SDRON", "alias": "DRN", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Doi ron giua cac vien: thu phong polyline vien, cap nhat hatch lien ket va cat lai anh, khong sua tay", "summary": "Đổi bề rộng ron (mạch) giữa các viên mà không phải sửa tay: lệnh thu hoặc phóng các polyline viên tại chỗ (mỗi cạnh dịch nửa độ chênh ron), cập nhật các hatch vân đá đã liên kết với biên và cắt lại ảnh IMAGECLIP theo biên mới (có dịch ảnh nếu cần để đủ khổ).", "steps": ["Quét chọn các polyline viên cần đổi ron.", "Nhập ron hiện tại và ron mới (mm). Ron mới lớn hơn thì viên thu lại, nhỏ hơn thì viên phóng ra.", "Chọn có cập nhật hatch và cắt lại ảnh hay không."], "result": "Polyline viên đổi kích thước tại chỗ (giữ layer, dữ liệu SD_TILE, mã viên); hatch liên kết tự cập nhật; ảnh cắt lại theo biên mới. Dòng lệnh báo số viên đã đổi, số viên không đổi được, số ảnh đã cắt lại, hết khổ và số hatch chưa liên kết.", "note": "Lưu ý: Ron hiện tại được nhớ sau mỗi lần đổi nên lần sau chỉ cần nhập ron mới; Enter ở bước chọn là chọn tất cả viên trên layer SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC. Đặt ron mới bằng ron hiện tại thì lệnh không đổi kích thước viên mà chỉ đồng bộ ảnh và hatch theo biên hiện tại (dùng sau khi sửa biên bằng tay). Hatch tạo bằng SDVANDA từ 2.20.0 liên kết với biên nên tự theo; hatch tạo từ bản cũ không liên kết, chạy lại SDVANDA. Viên rất nhỏ hoặc lõm mạnh có thể không thu được. Ron phóng ra quá thì viên chồng lên nhau, kiểm tra lại mặt bằng.\nRon ghi trên bản vẽ là tham số vẽ, không thay mạch thật ngoài công trình.", "extra": ""}, {"code": "SDRONIN", "alias": "IRN", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Cho ron / duong vien hien ra khi in: doi mau trang + net, dua duong vien len tren anh", "summary": "Cho đường ron hiện ra khi in trên đá hoặc ảnh tối. Lệnh đổi màu và bề rộng nét các layer viên (SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC) sang trắng thuần (ACI 255) hoặc đen, đặt nét in 0,25 mm (hoặc giá trị khác) và đưa polyline viên lên trên ảnh và hatch. Từ 2.25.0 SDANHDA tự gọi phần này sau khi cắt ảnh (ô Tự đặt màu ron để in). Có thể đặt màu riêng theo mã vật liệu (VD G1=Den;G2=Trang: đá sáng đường viền đen, đá tối đường viền trắng) để cả hai loại đá đều thấy ron khi in. Từ 2.26.1 lệnh cũng đặt IMAGEFRAME = 2 để khung viền đen của ảnh đá không in ra (hoặc 0 ẩn hẳn, tùy ô Khung viền); Khôi phục trả lại giá trị cũ.", "steps": ["Chạy SDRONIN, chọn màu (Trắng thuần cho đá tối, Đen cho đá sáng), bề rộng nét in, tích đưa đường viền lên trên ảnh.", "Khi in: dùng bảng nét acad.ctb (không dùng monochrome.ctb vì đổi mọi màu thành đen), tích Plot object lineweights, kiểm tra tỷ lệ in.", "Muốn trả lại màu cũ: SDRONIN, chọn Khôi phục."], "result": "Các layer viên có màu và nét mới; đường viền nằm trên ảnh; dòng lệnh nhắc cách chọn bảng nét và nét in.", "note": "Lưu ý: Ron 2 – 4 mm in tỷ lệ nhỏ (Fit to paper) chỉ còn dưới 0,2 mm trên giấy nên nét 0,25 mm mới nhìn thấy; kết hợp ô Ron của SDANHDA để chừa khe thật. Đây là chẩn đoán từ ảnh in, chưa chạy trên bản vẽ thật.", "extra": ""}, {"code": "SDLOT", "alias": "NPH", "group": "Quy trình ốp lát chính (thử trước)", "desc": "Chay lo nhieu phong: rai vien cho tung khu vuc, diem bat dau tot nhat, thong ke tung vung + tong, tuy chon cat anh / hatch", "summary": "Chạy một lần cho nhiều phòng hoặc khu vực: quét chọn tất cả polyline biên (lỗ, cột nằm trong tự nhận là lỗ), nhập thông số viên một lần; lệnh gọi SDGACH cho từng vùng với cùng thông số, tự chọn điểm bắt đầu tốt nhất cho từng vùng (so sánh 6 hoặc 31 điểm như SDDIEMBD), ghi tên khu vực KV1, KV2... kèm diện tích, thống kê từng vùng và tổng (viên nguyên, viên cắt, viên cắt hẹp, hao hụt ước tính).", "steps": ["Nhập mã và tên vật liệu, kích thước viên, ron, khe sát tường, kiểu lát (Thẳng hoặc So le), góc lưới, cách chọn điểm bắt đầu (Tốt nhất, Tâm, Góc), ngưỡng viên hẹp.", "Quét chọn tất cả polyline kín của các phòng và lỗ / cột.", "Tùy chọn: cắt ảnh tấm đá và hatch vân cho tất cả viên vừa tạo (SDANHDA, SDVANDA chỉ hỏi một lần)."], "result": "Viên nguyên và viên cắt của từng vùng (layer SD-GACH, SD-GACH-CAT, có dữ liệu SD_TILE nên SDGACHTK, SDDATHO, SDGIACONG dùng được); nhãn KV; bảng thống kê trên dòng lệnh và file _LotNhieuPhong.csv.", "note": "Lưu ý: Điểm bắt đầu tốt nhất chỉ tính cho lát thẳng (so le dù vòng quanh phễu cho vùng viên cắt chéo.", "steps": ["Nhập độ dốc, bán kính khoanh quanh phễu, chênh cao tối đa cho phép (mm).", "Chọn polyline kín là biên vùng lát.", "Chọn vị trí các phễu thu nước (Enter khi xong)."], "result": "Vòng tròn phễu và nhãn trên layer SD-THOATNUOC, nhãn cao độ tại các đỉnh biên, đường nối điểm xa nhất tới phễu gần nhất; dòng lệnh báo khoảng cách, chênh cao và cảnh báo nếu vượt mức cho phép.", "note": "Lưu ý: Chỉ tính dốc phẳng hướng về phễu gần nhất, không vẽ đường đồng mức. Chênh cao tối đa 30 mm là giá trị khởi đầu của vữa lát, đặt theo thiết kế. Viên quanh phễu thường phải chia riêng, lệnh chỉ khoanh vùng chứ chưa tự chia.", "extra": ""}, {"code": "SDTUDONG", "alias": "TDO", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Bat / tat tu dong: sua bien vien (grip, stretch...) thi anh IMAGECLIP tu cat lai theo bien moi", "summary": "Bật chế độ tự động: sau khi bạn sửa biên một viên (kéo grip, stretch, move, offset tại chỗ...) lệnh tự cắt lại ảnh IMAGECLIP của viên đó theo biên mới, có dịch ảnh nếu cần để đủ khổ. Hatch liên kết với biên thì AutoCAD tự cập nhật. Trạng thái được nhớ nên lần sau mở AutoCAD và nạp ShopDrawing.lsp là tự bật lại. Chạy lại SDTUDONG để tắt.", "steps": ["Chạy SDTUDONG: lệnh gắn theo dõi vào các polyline viên trên layer SD-GACH, SD-GACH-CAT, SD-GACH-VIEN, SD-GACH-DOC.", "Sửa biên viên như bình thường; khi lệnh sửa kết thúc, dòng lệnh báo đã cắt lại ảnh bao nhiêu viên.", "Chạy lại SDTUDONG để tắt (cũng nên tắt rồi bật lại sau khi thêm viên mới)."], "result": "Ảnh của viên được cắt lại theo biên mới ngay sau lệnh sửa; dòng lệnh báo số viên.", "note": "Lưu ý: Chỉ theo các viên đã có ảnh từ SDANHDA 2.20.0 trở lên (có dữ liệu SD_ANH). Từ 2.22.1 ảnh còn xoay lại theo biên mới (vân giữ đúng hướng so với cạnh dài; ảnh cũ chưa có góc xoay thì lấy góc lúc bật SDTUDONG nên cần bật trước khi sửa; viên gần vuông không tự xoay). Theo dõi chung cả bản vẽ (kể cả viên tạo thêm) và tự bật lại khi nạp ShopDrawing.lsp nếu lần t  tùy chọn có file .dwg riêng.", "note": "Lưu ý: Thông số động (Linear + Stretch) phải thêm tay trong Block Editor, lệnh không tạo tự động. Không gom các viên đã dựng bằng SDGACH / SDANHDA vào block rồi sửa tiếp: SDDOCDA, SDANHDA, SDTUDONG, SDRON, SDXOAVIEN chỉ thấy đối tượng ở mức trên cùng của bản vẽ, không thấy trong block, và ảnh cắt trong block có thể không sửa tại chỗ được (REFEDIT). Dùng block cho chi tiết, mặt cắt, bảng; bản rải lát giữ nguyên như cũ. Dọn layer chỉ làm khi block được chèn lần đầu vào bản vẽ (chèn lại block đã có thì dùng định nghĩa cũ); layer 0 và DEFPOINTS giữ nguyên; block lồng bên trong block giữ layer cũ của nó, nên màu / nét ghi cứng trong file vẫn còn (chi tiết mất phân biệt layer, còn phân biệt màu); chỉ xóa được layer không còn đối tượng nào dùng. Chi tiết ốp khô chỉ là mẫu minh họa: số liệu mặc định (đá dày 20, thép L30x30x3, bulông nở M8x100, khe joint 8, vát 3 x 45°) lấy cho dễ hình dung, kích thước phụ kiện thật của bạn phải nhập lại và kỹ sư kiểm tra, không dùng thẳng để gia công. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDTRINH", "alias": "BTK", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Ban trinh khach: bang chu thich vat lieu co o mau anh da (A1 1:50) va che do trinh khach lam mo nen kien truc, an layer nhan", "summary": "Chuẩn bị bản in trình khách (khổ A1, tỷ lệ 1:50). Chú thích: vẽ bảng chú thích vật liệu từ các viên SD_TILE đã dựng, mỗi mã vật liệu một dòng gồm ô mẫu ảnh đá (bản sao ảnh tấm, phóng vừa ô 22 x 14 mm giấy), mã, tên, kích thước, dày, số lượng, diện tích và tổng. Bật / Tắt: chế độ trình khách làm mờ các layer nền kiến trúc (không bắt đầu bằng SD-): màu xám nhạt ACI 253, nét 0,09, và ẩn các layer nhãn kỹ thuật bạn liệt kê (mặc định SD-CHU, nơi có số hiệu T..); Tắt trả lại màu, nét, bật / tắt cũ từng layer.", "steps": ["Chạy SDTRINH, chọn Chú thích, nhập đơn vị bản vẽ trên 1 mm giấy (A1 tỷ lệ 1:50 = 50), chọn điểm góc trên trái bảng.", "Chạy SDTRINH, chọn Bật; đổi danh sách layer ẩn nếu nhãn kích thước nằm ở layer khác; tích Làm mờ nền nếu muốn.", "In (SDIN hoặc PLOT) bằng acad.ctb, rồi chạy SDTRINH > Tắt để trả lại bản vẽ thi công."], "result": "Bảng chú thích nằm trên layer SD-CHUTHICH (không bị ẩn khi bật chế độ trình khách); nền mờ, nhãn kỹ thuật ẩn khi Bật.", "note": "Lưu ý: Ô mẫu dùng ảnh tấm của viên đầu tiên của mỗi mã; viên không có ảnh (dùng hatch) thì hiện chữ (không ảnh). Chỉ làm mờ layer không bắt đầu bằng SD-, layer 0 và DEFPOINTS; tường dựng bằng layer SD-* không bị mờ. Nhãn kích thước xanh trong ảnh mẫu có thể ở layer khác SD-CHU: thêm vào danh sách ẩn. In bằng bảng nét acad.ctb (xám 253 in thành xám). Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDKHUNGIN", "alias": "KIN", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Khung in A1 / A3 tu dung: khung ten, huong Bac, thuoc ty le, dat san cai dat in cho SDIN / SDTAOLAYOUT", "summary": "Dựng khung in cho bản trình khách: tờ giấy A1 / A3 (hoặc A2, A4) ở tỷ lệ 1:N (A1 1:50 = 42050 x 29700 đơn vị bản vẽ), gồm khung tờ (layer SD-KHUNGIN, không in) làm khung cho SDTAOLAYOUT / SDIN, viền trong (lề trái 25 mm để đóng tập), khung tên 4 hàng (dự án, hạng mục, tên bản vẽ, tỷ lệ | ngày | số tờ) và các hàng thêm phía trên nếu có điền: số hiệu bản vẽ + REV, người thực hiện, nhà thầu thi công, tư vấn giám sát, chủ đầu tư (trống thì không vẽ hàng đó), mũi tên hướng Bắc và thước tỷ lệ 5 đoạn. Tích ô cuối để đặt sẵn cài đặt in: SDIN và SDTAOLAYOUT mở ra đã chọn khung = layer SD-KHUNGIN, nét in acad.ctb, vừa khổ giấy (Fit) chính giữa; đồng thời đặt IMAGEFRAME để khung ảnh đá không in.", "steps": ["Chạy SDKHUNGIN, chọn khổ giấy (A1 hoặc A3), tỷ lệ, điền dự án, hạng mục, tên bản vẽ, số tờ; tùy chọn chủ đầu tư, tư vấn giám sát, nhà thầu, người thực hiện; số hiệu theo dạng mã dự án.mã nhà thầu.loại.số (VD C6B.319.SDS.01) và REV.", "Chọn điểm góc trái dưới của tờ trong Model, đặt tờ bao quanh phần mặt bằng cần in (di chuyển hoặc copy khung nếu cần).", "Chạy SDTAOLAYOUT (tạo Layout và đánh số tờ) hoặc SDIN (in hàng loạt): cài đặt khung đã có sẵn, chọn máy in rồi chạy."], "result": "Khung tờ trên layer SD-KHUNGIN, viền và khung tên trên SD-KHUNGIN-VIEN / -LUOI / -CHU; cài đặt in SDIN và SDTAOLAYOUT được đặt sẵn.", "note": "Lưu ý: Khung tờ không in (layer SD-KHUNGIN tắt in) chỉ để máy in lấy vùng in. Máy in cần có khổ giấy tương ứng A1 / A3; SDIN chọn khổ gần nhất. Ngày lấy theo đồng hồ máy. Chữ có dấu tiếng Việt cần kiểu chữ hỗ trợ. Số hiệu bản vẽ ghép từ mã dự án, mã nhà thầu, loại bản vẽ (mặc định SDS) và số thứ tự hai chữ số; để trống cả mã dự án và mã nhà thầu thì không vẽ hàng số hiệu. Số thứ tự tự tăng sau mỗi lần vẽ khung (SDKHUNGIN hoặc SDPHUONGAN) nếu bật; thông tin ghi nhớ trong bản vẽ cho lần sau. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDKHAOSAT", "alias": "KSH", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Dung phong tu file so do khao sat (room,ab,bc,cd,da,ac,bd): 4 canh + cheo, xep hang tin cay A / B / C / X / D, ve polyline phong lam bien cho SDGACH / SDLOT", "summary": "Dựng phòng từ số đo khảo sát hiện trạng (file CSV cùng định dạng với tool khao-sat-hien-trang / máy đo laser Bosch: room,ab,bc,cd,da,ac,bd,height,openings_m2,source,date,note). Phòng thực tế hiếm khi vuông nên lệnh dựng theo 4 cạnh liền nhau AB, BC, CD, DA và đường chéo AC, rồi so đường chéo BD tính được với BD đo để kiểm tra đo sai. Mỗi phòng được xếp hạng tin cậy: A (đủ 4 cạnh và 2 chéo, chéo khép), B (có chéo AC), C (không chéo, giả định góc B vuông), X (chéo BD lệch quá ngưỡng, cần đo lại), D (thiếu cạnh hoặc số đo không khép được). Phòng đủ điều kiện được vẽ thành polyline kín (layer SD-PHONG) kèm tên, hạng và diện tích, xếp cạnh nhau từ điểm chọn.", "steps": ["Xuất bảng số đo thành CSV (mẫu: room,ab,bc,cd,da,ac,bd,height,openings_m2,source,date,note).", "Chạy SDKHAOSAT, chọn file CSV; chọn đơn vị trong file, ngưỡng lệch, hạng phòng được dựng, khoảng cách xếp.", "Chọn điểm chèn; đọc báo cáo trên dòng lệnh (phòng nào cần đo lại).", "Dùng polyline phòng làm biên cho SDGACH, SDLOT hoặc SDRAITAM."], "result": "Polyline kín trên layer SD-PHONG kèm nhãn tên phòng, hạng, diện tích; báo cáo hạng từng phòng và ghi chú trên dòng lệnh.", "note": "Lưu ý: Shop drawing ốp lát chỉ nên dùng phòng hạng A; B và C cần đo thêm đường chéo trước khi đặt vật tư; X và D không đưa vào khối lượng cho đến khi đo lại. Phòng chữ L hoặc có góc cắt phải chia thành các tứ giác. Lệnh chỉ dựng hình tứ giác, các phòng xếp cạnh nhau chứ không đặt theo vị trí thật trong tòa nhà: sau khi dựng phải dời polyline về vị trí trên mặt bằng. Diện tích tính từ tọa độ dựng hình. Chưa thử trên AutoCAD thật; cách dựng hình theo cùng công thức với script room_survey.py của tool khảo sát nhưng viết lại bằng AutoLISP.", "extra": ""}, {"code": "SDCHIABAC", "alias": "CHB", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Chia bac thang tu cao do (so voi +-0.000): chieu cao bac, lam tron don phan lech, bang cao do hoan thien / ket cau tung bac va chieu nghi, dat san SDTHANGDA", "summary": "Chia bậc thang từ cao độ. Nhập cao độ hoàn thiện hai sàn so với ±0.000 công trình (m), số bậc từng vế (VD 10,11: hai vế có chiếu nghỉ ở giữa; một vế: 21), bước làm tròn chiều cao bậc (mm), bề dày đá và vữa. Lệnh chia chiều cao tầng cho số bậc, làm tròn rồi dồn phần lệch vào các bậc trên cùng hoặc dưới cùng (VD 3500 mm / 21 bậc = 166,67: làm tròn 1 mm ra 14 bậc 167 và 7 bậc 166, tổng đúng 3500). Bảng ghi cao độ hoàn thiện và cao độ kết cấu (hoàn thiện trừ đá và vữa) của từng bậc và từng chiếu nghỉ, in ra dòng lệnh và ra bản vẽ; tùy chọn đặt sẵn chiều cao bậc và số bậc vế đầu cho SDTHANGDA.", "steps": ["Chạy SDCHIABAC, nhập cao độ hoàn thiện sàn dưới và sàn trên (m, so với ±0.000), số bậc từng vế.", "Chọn bước làm tròn, nơi dồn phần lệch, bề dày đá và vữa.", "Chọn điểm chèn bảng cao độ; chạy SDTHANGDA nếu đã tích đặt sẵn chiều cao bậc."], "result": "Bảng BẢNG CAO ĐỘ BẬC THANG (cao độ hoàn thiện, cao độ kết cấu, chiều cao bậc, chiếu nghỉ) và báo cáo trên dòng lệnh.", "note": "Lưu ý: Cao độ kết cấu = cao độ hoàn thiện trừ (đá + vữa); các bậc xây hay bản thang có bề dày khác thì tính thêm bằng tay. Số bậc là số lần nâng (số bậc cao) từ sàn dưới đến sàn trên, mỗi chiếu nghỉ tính là mặt của bậc cuối vế trước. Lệnh chỉ tính chiều cao, không tính bước đạp: chiều rộng bậc lấy từ mặt bằng và nhập ở SDTHANGDA. Cảnh báo khi bậc ngoài 150 - 180 mm. Nếu làm tròn làm các bậc không đều nhau thì chiều cao bậc đặt cho SDTHANGDA là giá trị làm tròn chung, bậc lệch cần xử lý riêng. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDMAVIEN", "alias": "SMV", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Ma vien theo hinh dang: cung vat lieu va hinh dang cung ma (VD G1-01), nho trong ban ve, ghi len vien, bang + CSV", "summary": "Đánh mã viên theo hình dạng: các viên cùng vật liệu và cùng hình dạng (xoay thế nào cũng được; tùy chọn gộp cả viên đối xứng gương) có cùng một mã, VD G1-01, G1-02 (tiền tố là mã vật liệu hoặc một tiền tố cố định như ST). Mã được ghi vào viên (dữ liệu SD_MAVIEN), ghi chữ lên từng viên (layer SD-MAVIEN), lập bảng mã viên (loại, kích thước, số lượng, diện tích) và ghi hai file CSV: theo mã (_MaVien.csv) và từng viên kèm tọa độ tâm (_MaVienTungVien.csv). Bảng mã được nhớ trong bản vẽ: chạy lại thì viên cũ giữ mã cũ, hình mới nhận mã tiếp theo, nên mã bản vẽ và mã xưởng không bị lệch khi bản vẽ sửa. SDCATDU dùng mã này (nếu có) thay mã viên cũ.", "steps": ["Chạy SDMAVIEN, quét chọn các viên (Enter = tất cả trong bản vẽ).", "Chọn dung sai (mặc định 1 mm), có gộp viên đối xứng gương không, tiền tố mã.", "Chọn điểm chèn bảng; đọc hai file CSV để lập tem hoặc lệnh cắt."], "result": "Mã viên ghi trên bản vẽ (layer SD-MAVIEN), bảng BẢNG MÃ VIÊN, file _MaVien.csv và _MaVienTungVien.csv.", "note": "Lưu ý: Hình dạng được so bằng độ dài cạnh (làm tròn theo dung sai) và góc rẽ (làm tròn 1 độ), không phụ thuộc điểm đầu và chiều xoay của polyline. Viên có cạnh cong (cung) được xấp xỉ bằng nhiều đoạn thẳng nên chỉ coi là cùng hình khi các đoạn cùng chia; hai cung khác bán kính rất gần nhau có thể nhận cùng mã. Kích thước được làm tròn theo dung sai nên hai viên lệch nhau ngay tại ranh giới làm tròn (VD 600,5 và 600,4 với dung sai 1 mm) vẫn có thể nhận hai mã khác nhau: nếu thấy mã bị tách oan, tăng dung sai. Viên chữ L có hai cạnh bằng nhau tự đối xứng nên luôn cùng mã với bản đối xứng gương của nó. Mã không xét chiều vân: hai viên cùng hình nhưng xoay vân khác nhau vẫn cùng mã, cần ghi hướng vân riêng. Chạy lại với 'Đánh lại từ đầu' sẽ bỏ bảng mã đã nhớ. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDKIEMTONG", "alias": "KTO", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Luot kiem tong: ho so so lieu, vien hep / nho, ron khong deu, luoi ron lech, chuoi cao do; bao cao + CSV", "summary": "Lượt kiểm tổng trước khi phát hành: một lệnh chạy cùng lúc các kiểm tra của bộ lệnh ốp lát và in một báo cáo. Gồm hồ sơ số liệu (SDHOSO: bao nhiêu số còn chưa xác nhận), viên cắt hẹp, viên cắt nhỏ, ron không đều, lưới ron lệch giữa các phòng (như SDTRUNGRON) và các cảnh báo của chuỗi cao độ (SDLIENCAODO). Mỗi mục có trạng thái ĐẠT, CẢNH BÁO, CHƯA XÁC NHẬN hoặc BỎ QUA (chưa kiểm được). Có thể ghi báo cáo thành bảng trên bản vẽ; luôn xuất CSV.", "steps": ["Rải gạch và nhập số liệu bằng SDHOSO / SDLIENCAODO trước.", "Chạy SDKIEMTONG, chỉnh ngưỡng hẹp, nhỏ, ron nếu cần; tích ghi báo cáo ra bản vẽ nếu muốn.", "Đọc báo cáo; chạy lệnh riêng của mục cảnh báo (SDKTLAT, SDTRUNGRON, SDLIENCAODO) để khoanh và xử lý."], "result": "Báo cáo trên dòng lệnh, file CSV _KiemTong.csv, bảng BÁO CÁO KIỂM TRA TỔNG (tùy chọn).", "note": "Lưu ý: Lệnh chỉ đếm và báo, không khoanh vị trí (dùng SDKTLAT và SDTRUNGRON để khoanh). BỎ QUA nghĩa là chưa kiểm được, không phải đạt. Kiểm ron không đều bỏ qua khi có hơn 1500 viên (chạy SDKTLAT riêng). Không thay thế việc đối chiếu bản vẽ với thiết kế và hiện trạng. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDHOSO", "alias": "SLD", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Ho so so lieu du an: ron, cao do, doc, du...; danh dau da xac nhan / chua xac nhan, canh bao khi lenh dung so chua xac nhan, bang ra ban ve", "summary": "Hồ sơ số liệu dự án: gom các số dùng chung cho nhiều lệnh (bề rộng ron, cao độ sàn chính, hạ cốt WC, dốc sàn WC và sân hồ, cao độ sân hồ, mực nước, độ sâu hồ, dày đá đứng và keo ở chỗ đổi cao độ, dư mặc định sát tường) vào một hộp thoại, nhập một lần dùng cho các lệnh SDLIENCAODO, SDBACCAODO, SDCATDU, SDOPTUONG, SDHOBOI. Mỗi số có trạng thái đã xác nhận (lấy từ thiết kế hoặc đo hiện trạng) hoặc chưa xác nhận (mặc định, nội suy, hoặc đã đổi sau khi xác nhận). Các lệnh trên in cảnh báo khi dùng số chưa xác nhận; có thể ghi bảng hồ sơ ra bản vẽ để người duyệt thấy số nào còn chưa xác nhận.", "steps": ["Chạy SDHOSO, nhập các số theo thiết kế hoặc đo hiện trạng.", "Tích 'đã xác nhận' ở các số đã đối chiếu thiết kế / hiện trạng; bỏ trống số còn là giả định.", "Tích ghi bảng và bấm điểm chèn nếu cần bảng trên bản vẽ; chạy các lệnh khác như bình thường, sẽ có cảnh báo nếu còn số chưa xác nhận."], "result": "Số liệu được nhớ trong bản vẽ, danh sách trạng thái trên dòng lệnh, bảng HỒ SƠ SỐ LIỆU DỰ ÁN (tùy chọn).", "note": "Lưu ý: Trạng thái đã xác nhận do người dùng tích, lệnh không tự kiểm chứng số. Số đổi sau khi xác nhận (kể cả đổi trong hộp thoại của lệnh khác) tự trở lại chưa xác nhận. Mới có 12 số dùng chung, chưa gồm trục, tường, cửa. Các lệnh chỉ cảnh báo, không chặn chạy. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDDIMVIEN", "alias": "DVI", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Dim tu dong theo hang vien: chuoi tung vien + tong, ngang / dung, ngoai phong hoac trong phong", "summary": "Dim tự động theo hàng viên đã rải: chuỗi từng viên (bước viên = viên + ron) và, nếu chọn hai hàng, thêm đường dim tổng. Dim theo hướng ngang hoặc đứng của lưới (lưới xoay thì dùng dim thẳng hàng với lưới), ngoài phòng (hàng viên sát mép phòng, đặt phía dưới / trái, trên / phải hoặc cả bốn phía) hoặc trong phòng (đường dim đi qua điểm bạn chọn). Khoảng cách đường dim đến mép phòng nhập được; dim nằm trên layer SD-KICHTHUOC.", "steps": ["Rải gạch phòng bằng SDGACH hoặc SDLOT.", "Chạy SDDIMVIEN, quét chọn các viên của phòng (Enter = tất cả).", "Chọn hướng, số hàng, vị trí (ngoài / trong phòng), phía đặt, khoảng cách; với dim trong phòng bấm một điểm trên hàng cần dim."], "result": "Các đường dim chuỗi từng viên (và đường dim tổng) trên layer SD-KICHTHUOC.", "note": "Lưu ý: Dim là đối tượng AutoCAD ghi kích thước hình học hiện có: sửa viên sau đó phải dim lại. Ron nhỏ hơn bề rộng ron nhập được gộp vào bước viên; khoảng hở lớn hơn (cửa, vật cản) được dim riêng. Lưới so le: hàng chọn chỉ cho các viên cắt ngang đường dim. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDOPTUONG", "alias": "OPTU", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Op tuong trung ron san: mat dung trai phang, ron dung theo ron san, kiem tra trung ron", "summary": "Ốp tường trùng ron sàn: chọn đường mặt tường (polyline), các viên sàn của phòng và các lỗ cửa; lệnh trải phẳng mặt tường theo thứ tự cạnh như SDCHANTUONG, ốp viên theo khổ rộng × cao nhập vào, ron đứng lấy theo ron sàn dọc tường (viên sàn cách tường không quá khoảng sát nhập) và ron ngang chia từ mặt sàn hoặc từ cao độ chừa len lên. Có kiểm tra trùng ron: mỗi ron sàn cắt tường được so với ron ốp gần nhất, vạch xanh nếu lệch không quá dung sai, vạch đỏ kèm số mm lệch nếu không; báo số viên nguyên, viên cắt, diện tích ốp và hàng trên cùng quá hẹp.", "steps": ["Rải gạch sàn trước (SDGACH / SDLOT).", "Chạy SDOPTUONG, chọn polyline mặt tường, nhập khổ viên ốp, ron, chiều cao ốp, cao độ chừa len, khoảng sát và dung sai.", "Quét chọn các viên sàn của phòng (Enter nếu không cần trùng ron), chọn các lỗ cửa, bấm điểm chèn mặt đứng."], "result": "Mặt đứng ốp trên layer SD-OP-TUONG, vạch kiểm tra ron SD-OP-RON-TRUNG (xanh) và SD-OP-RON-LECH (đỏ), dòng lệnh báo tỉ lệ trùng ron, số viên và diện tích.", "note": "Lưu ý: Ron đứng trùng hết khi bước viên ốp (rộng + ron) bằng bước viên sàn dọc tường hoặc ước số của nó; khác bước thì chỉ vài ron trùng, lệnh báo số ron lệch. Mặt đứng chưa trừ chiều cao lỗ cửa (mới tách theo chiều dọc tường) và chưa tạo mã viên ốp / bảng cắt. Tường cong hoặc gấp khúc xét theo từng cạnh. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDTRUNGRON", "alias": "RLE", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Kiem tra luoi ron lien tuc xuyen cac phong: nhom vien lech luoi chinh, khoanh may, goi y dich", "summary": "Kiểm tra lưới ron có liên tục xuyên các phòng không (ron phòng này thẳng hàng với ron phòng kia qua cửa, kể cả khi hai phòng rải riêng hoặc có giật cấp). Lệnh lấy viên nguyên đầu tiên làm lưới chuẩn, đo độ lệch của từng viên nguyên so với lưới (theo hai phương), gom thành nhóm cùng độ lệch. Nhóm đông nhất là lưới chính; các nhóm còn lại được khoanh đám mây trên layer SD-RON-LECH kèm số mm lệch, dòng lệnh báo cần dời nhóm bao nhiêu mm để ron trùng. SDLOT có thêm cách đặt điểm bắt đầu 'Chung': chọn một điểm gốc lưới cho mọi phòng, các phòng rải cùng một lưới ron.", "steps": ["Rải gạch các phòng (SDLOT với điểm bắt đầu Chung, hoặc SDGACH từng phòng).", "Chạy SDTRUNGRON, chọn các viên (Enter = tất cả), nhập bề rộng ron và độ lệch cho phép.", "Xem các đám mây RON LỆCH và dòng lệnh báo mm cần dời."], "result": "Layer SD-RON-LECH (đám mây và số mm lệch), dòng lệnh báo số nhóm lệch và mm cần dời.", "note": "Lưu ý: Chỉ xét viên nguyên (F) cùng khổ và cùng hướng với viên chuẩn; viên khác khổ hoặc khác hướng bị bỏ qua và được đếm. Kiểu lát so le chỉ kiểm tra phương dọc. Viên chuẩn là viên nguyên đầu tiên trong tập chọn, nên khi cả hai nửa bản vẽ đều khác nhau thì nhóm đông hơn được coi là lưới chính. Chạy lại lệnh xóa đám mây cũ trên layer SD-RON-LECH. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDBACCAODO", "alias": "CDB", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Cho doi cao do (nguong WC, mep ho, chan thanh): gan du mm, SDCATDU tu nhan", "summary": "Gán số mm dư cho các chỗ đổi cao độ (ngưỡng WC, mép hồ, chân thành hồ) để SDCATDU tự chừa dư. Chọn các nét nằm đúng chỗ đổi cao độ, chọn kiểu: đá dưới chui dưới đá đứng (đá đứng dựng sau) thì dư = dày đá đứng + keo (ví dụ đá đứng dày 20 + keo 10 = dư 30), hoặc đá sàn ốp lên mặt đứng thì dư = chênh cao + keo. Lệnh copy các nét sang layer SD-CAODO-BAC-<mm>; SDCATDU nhận các layer này và chừa dư các cạnh viên sát chúng, cạnh biên khác dùng số dư mặc định.", "steps": ["Vẽ hoặc chọn nét (LINE / polyline) đúng mép ngưỡng WC, mép hồ hoặc chân thành.", "Chạy SDBACCAODO, chọn các nét, chọn kiểu và nhập chênh cao, dày đá đứng, keo.", "Chạy SDCATDU (mục tự nhận nét đổi cao độ đang bật)."], "result": "Layer SD-CAODO-BAC-<mm> chứa nét đã copy; SDCATDU ghi +mm trên các cạnh viên sát nét.", "note": "Lưu ý: Hai kiểu xử lý là quy ước xử lý thường gặp, không phải tiêu chuẩn: chọn theo chi tiết thiết kế của hạng mục. Chênh cao mặc định lấy từ hạ cốt WC của SDLIENCAODO. Nét phải nằm cách cạnh viên không quá khoảng sát của SDCATDU (mặc định 30 mm). Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDLIENCAODO", "alias": "LKD", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Chuoi cao do: san chinh, san WC (ha cot, doc ve pheu thu), san ho, muc nuoc, day ho; chenh cao tung muc, canh bao, so do", "summary": "Chuỗi cao độ nối sàn chính, sàn WC, sân hồ, mực nước và đáy hồ: nhập cao độ sàn chính (so với ±0.000), mức hạ cốt sàn WC tại ngưỡng cửa, dốc sàn WC và sân hồ, cao độ mép hồ, mực nước và độ sâu hai đầu hồ (số liệu hồ lấy lại từ SDHOBOI nếu đã nhập). Chọn polyline vùng WC rồi các phễu thu, chọn polyline sân hồ rồi các phễu / rãnh thu: lệnh tìm điểm xa phễu nhất, tính cao độ sàn hoàn thiện tại phễu (ngưỡng trừ dốc nhân khoảng cách). Kết quả là bảng cao độ từ cao xuống thấp, chênh cao giữa các mức, các cảnh báo (sàn WC không thấp hơn sàn chính, mực nước cao hơn mặt sân, sân hồ cao hơn sàn chính, dốc ngoài 1 - 2%) và sơ đồ liên hệ cao độ ghi ra bản vẽ.", "steps": ["Chạy SDLIENCAODO, nhập cao độ sàn chính, hạ cốt WC, dốc, cao độ sân hồ và mực nước.", "Chọn polyline kín vùng WC rồi bấm các phễu thu (Enter xong); làm tương tự với sân hồ; Enter ngay để bỏ qua một vùng.", "Bấm điểm chèn sơ đồ cao độ rồi điểm chèn mặt cắt ngang đúng tỉ lệ (Enter bỏ qua từng cái) và đọc bảng cao độ trên dòng lệnh."], "result": "Danh sách cao độ từ cao xuống thấp trên dòng lệnh, cảnh báo, sơ đồ trên layer SD-CAODO-LIEN, mặt cắt ngang đúng tỉ lệ trên layer SD-CAODO-MC, cao độ nhớ trong bản vẽ.", "note": "Lưu ý: Mức hạ cốt sàn WC mặc định 20 mm chỉ là số điền sẵn: nhập theo thiết kế. Dốc 1 - 2% lấy từ TCVN 4260:2012 §6.2.24 (sân quanh bể và sàn khu vệ sinh của bể bơi), áp dụng cho dự án khác chỉ để tham khảo. Cao độ tại phễu tính cho điểm xa phễu nhất với mặt sàn dốc đều về phễu; sàn nhiều mặt dốc hay có gờ chắn nước cần tính riêng. Số liệu bề rộng hồ và độ sâu ở mặt cắt ngang chỉ để vẽ hình; mặt cắt ngang vẽ đúng tỉ lệ 1:1 theo mm (sân hồ dốc ra xa hồ). Nối với SDCATDU qua SDBACCAODO. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDHOBOI", "alias": "HOB", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Ho boi: doc day dau nong - dau sau, duong dong muc day, khe co gian, mat cat doc + bang cao do day theo vien, doi chieu TCVN 4260:2012 / ISPSC 2015", "summary": "Shop drawing hồ bơi theo độ dốc đáy: chọn polyline mép trong lòng hồ, bấm hai điểm xác định trục dốc từ đầu nông xuống đầu sâu, nhập độ sâu nước hai đầu, đoạn đáy phẳng đầu nông (và đầu sâu, hoặc nhập thẳng độ dốc 1:n), bước đường đồng mức. Lệnh tính độ dốc đáy (% và 1:n), vẽ trục dốc, các đường đổi dốc, các đường đồng mức đáy cách nhau theo bước đã nhập (kèm độ sâu và cao độ hoàn thiện), vẽ khe co giãn chia hồ thành các ô không vượt khoảng cách tối đa, ghi mặt cắt dọc hồ (mực nước, đáy, độ sâu hai đầu, độ dốc) và bảng cao độ đáy tại từng mạch viên. Với chiều dài viên theo hướng dốc, lệnh báo mỗi viên chênh cao bao nhiêu mm và đề xuất dời đường đổi dốc đúng vào mạch gạch (tránh viên phải chế qua đường đổi dốc). Có kiểm tra độ dốc đáy, độ sâu nông / sâu, bậc nghỉ chân, dốc sân quanh hồ theo TCVN 4260:2012 và ISPSC 2015 (trích số điều khoản trong dòng báo).", "steps": ["Vẽ hoặc chọn polyline kín là mép trong lòng hồ (mặt bằng lòng hồ, chưa tính ốp).", "Chạy SDHOBOI, nhập độ sâu nước hai đầu, đoạn đáy phẳng, độ dốc (hoặc để lệnh tính), bước đồng mức, chiều dài viên và ron.", "Chọn polyline lòng hồ, bấm một điểm ở đầu nông rồi một điểm ở đầu sâu (hai điểm tạo trục dốc, không cần nằm sát thành hồ).", "Bấm điểm chèn mặt cắt dọc (hoặc Enter bỏ qua), đọc các dòng cảnh báo trên dòng lệnh và chỉnh số liệu."], "result": "Layer SD-HOBOI (trục, nhãn), SD-HOBOI-DM (đồng mức), SD-HOBOI-DOI (đường đổi dốc), SD-HOBOI-KHE (khe co giãn), SD-HOBOI-MC (mặt cắt và bảng cao độ); dòng lệnh báo độ dốc, số khe, chênh cao mỗi viên, các cảnh báo.", "note": "Lưu ý: Mô hình đáy gồm một đoạn phẳng đầu nông, một đoạn dốc đều, một đoạn phẳng đầu sâu; hồ có nhiều độ dốc, bậc cấp, ghế ngồi hay hố nhảy cầu chưa mô hình (chạy lệnh cho từng vùng). Giới hạn dốc 1:7 (vùng nông, đến độ sâu 838 mm) và 1:3 (vùng sâu) lấy từ ISPSC 2015 §807, giới hạn 1:10 ở vùng nước sâu đến 1,5 m lấy từ quy định xây dựng Mỹ (UpCodes 454.1.2); các số này là tiêu chuẩn nước ngoài, không phải quy định bắt buộc ở Việt Nam. TCVN 4260:2012 chỉ quy định đáy dốc về hố thu 1 - 3% (§5.1.11) và sân quanh bể dốc 1 - 2% về phía phễu thu (§6.2.24), không quy định dốc từ đầu nông xuống đầu sâu. Khoảng cách khe co giãn lấy theo Laticrete / TCNA EJ171: 2,4 - 3,7 m mỗi phương, rộng tối thiểu 9 mm khi cách 2,6 m và 12 mm khi cách 4 m; đây là hướng dẫn của nhà sản xuất keo, đối chiếu hồ sơ thiết kế của hạng mục. Độ sâu nông 838 - 1219 mm là của hồ gia đình theo ISPSC. Chưa thử trên AutoCAD thật; mới thử bằng mô phỏng phần tính độ sâu, giao đường đồng mức và kiểm tra.", "extra": ""}, {"code": "SDMAP", "alias": "TVM", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Thu vien map (anh) da granite co san: chen anh tam da dung kich thuoc that de SDANHDA cat vao vien; tha them .jpg / .png vao thu muc Maps", "summary": "Thư viện map (ảnh vân) đá granite có sẵn: chọn một map hoặc Tất cả, nhập chiều dài thật của tấm đá và điểm chèn, lệnh chèn ảnh đúng kích thước thật (layer SD-MAP) để SDANHDA cắt vào các viên. Gói cài đặt có thư mục Maps với 17 map (13 map cơ bản: đen tuyết, đen sao vàng, xám đậm, xám sáng, trắng chấm đen, trắng vân mây, vàng kem, đỏ, hồng, nâu, xanh rêu, xanh dương, tím; và 4 map theo kiểu tấm đá thật bạn gửi, ghi khổ thật trong tên file: đen tia trắng 3180 x 1920, xám vân sóng 2900 x 1820, xám vân ngang 2600 x 1850, xám vân gỗ 2450 x 1170) do chương trình tự sinh, không lấy từ nguồn bên thứ ba. Tên file có đuôi _DàixRộng (VD _3180x1920) thì SDMAP tự dùng khổ đó khi để chiều dài là 0; map của bạn cũng đặt tên theo cách này được. Muốn thêm map của bạn: chép file .jpg / .png (tên không dấu) vào thư mục Maps rồi chạy lại SDMAP, map mới tự có trong danh sách. Chọn Tất cả sẽ chèn mỗi map một tấm cạnh nhau, rồi SDANHDA chọn cả nhóm ảnh để mỗi tấm thô là một vân khác nhau.", "steps": ["Chạy SDMAP, chọn map (hoặc Tất cả), nhập chiều dài thật của tấm (để 0 = theo khổ ghi trong tên file, không có thì 3000 mm) và số tấm.", "Bấm điểm chèn ở vùng trống của bản vẽ.", "Chạy SDANHDA, chọn các ảnh vừa chèn, bật Lấy kích thước tấm từ ảnh, quét chọn các viên cần cắt; nếu cần chỉnh biên thì dùng SDMOANH, SDDICHVAN."], "result": "Ảnh map nằm trên layer SD-MAP, rộng đúng chiều dài tấm đã nhập, cao theo tỉ lệ ảnh (map có sẵn là 1,875, tức 3000 x 1600).", "note": "Lưu ý: Map có sẵn chỉ là vân sinh bằng thuật toán, để lên phương án màu và kiểm tra bố cục; không phải ảnh chụp đá thật, không thay cho ảnh tấm đá thật của nhà cung cấp khi trình khách. Khi dùng ảnh khác tỉ lệ thì nhập chiều dài thật đúng và bật Lấy kích thước tấm từ ảnh ở SDANHDA. Thư mục Maps được tìm cạnh ShopDrawing.lsp (hoặc trên đường dẫn của AutoCAD); không thấy thì lệnh hỏi chọn một ảnh trong thư mục và nhớ trong máy. Một số bộ map tải miễn phí trên mạng có điều kiện bản quyền riêng: đọc kỹ trước khi đưa vào bản vẽ giao khách. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDDICHVAN", "alias": "DCV", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Dich van da tung buoc: nhich anh tam da duoi bien vien (trai / phai / len / xuong, buoc mm), bien dung yen, co hoan buoc", "summary": "Dịch vân đá từng bước: chọn một viên đã cắt ảnh (SDANHDA), nhấn Trái / Phải / Lên / Xuống để nhích ảnh tấm đá dưới biên viên một bước (mặc định 10 mm, đổi bằng Buoc), biên viên đứng yên, ảnh được cắt lại sau mỗi bước. Keo (từ 2.43.0) cho kéo vân bằng chuột như thao tác kéo ảnh trong mặt nạ cắt của phần mềm đồ họa: ảnh tạm bỏ clip và mờ đi để thấy cả tấm đá, biên viên vẽ nét sáng đứng yên, kéo chuột hoặc dùng phím mũi tên để trượt ảnh bên dưới, click / Enter / Space chấp nhận (ảnh được cắt lại), Esc hoặc chuột phải hủy. Hoan trả lại bước vừa dịch. Mỗi bước phải giữ polyline viên nằm trọn trong ảnh (chừa lề an toàn); hết khổ về phía nào thì báo và không dịch thêm. Dùng để chọn lại đoạn vân đẹp cho từng viên, không phải kéo ảnh qua lại bằng lệnh Move.", "steps": ["Chạy SDDICHVAN, nhập bước dịch (mm) và lề an toàn.", "Chọn viên (polyline); lệnh tự ghép ảnh của viên, nếu không ghép được thì chọn ảnh bằng tay.", "Gõ Keo để kéo vân bằng chuột (chọn điểm gốc, kéo, click chấp nhận, Esc hủy), hoặc Trai / Phai / Len / Xuong để dịch vân một bước, QT / QP để xoay vân sang trái / phải một góc (xoay quanh tâm viên, tự dịch nhẹ để viên không ra khỏi ảnh; Goc để đổi góc mỗi lần), Hoan để lùi lại một bước (kể cả bước xoay), Buoc để đổi bước, Xong (hoặc Enter) để sang viên khác."], "result": "Ảnh vân của viên dịch đúng số bước, biên viên không đổi; dòng lệnh báo tổng đã dịch.", "note": "Lưu ý: Hướng dịch tính theo trục X / Y của bản vẽ (Phải và Lên là dương), vân chạy theo hướng đó trên viên. Chỉ dịch được khi tấm đá còn thừa khổ quanh viên; viên sát mép tấm có thể chỉ dịch được về một phía. Chế độ Keo: trong lúc kéo ảnh hiện cả tấm (mờ 50%) và đè lên các viên bên cạnh tạm thời; viên luôn được giữ nằm trong ảnh nên kéo quá xa sẽ bị chặn ở lề. Chưa thử chuột phải và các phím mũi tên trên AutoCAD thật (phiên bản có thể trả mã phím khác). Không đối gương ảnh (AutoCAD không lật được điểm ảnh): muốn đối gương cần file ảnh đã lật gương. Ảnh dùng chung nhiều viên (lưới chung) dịch cùng lúc cho cả các viên đó. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDCATDU", "alias": "CTD", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Cat du sat tuong: vien cat nao, canh nao phai cat dai ra (+du mm) de be lai khi thi cong; gach do tren ban ve, bang kich thuoc cat, CSV", "summary": "Chỉ ra viên cắt nào, cạnh nào phải cắt dài ra để ra công trường bẻ lại cho khít. Cạnh biên là cạnh của viên cắt không có viên nào khác nằm sát bên ngoài (sát tường, cột, vật cản). Mỗi cạnh biên được cộng thêm số mm chừa dư (mặc định 10 mm). Nếu nhập quy tắc theo layer dạng layer=mm cách nhau dấu ; (VD *MUIBAC*=20;*THANHHO*=15;*TUONG*=10) thì chỉ cạnh biên cách các nét đó không quá khoảng cho phép (mặc định 30 mm) mới chừa dư, mỗi loại một số mm (không ghi mm thì dùng số mặc định); cạnh biên không sát nét nào (mép hở nhìn thấy, cửa) không chừa dư, vì chỉ nên chừa dư ở cạnh khuất. Ví dụ đá đáy hồ chừa dư phần khuất dưới mũi bậc và dưới đá dựng thành hồ. Lệnh vẽ gạch đỏ dọc cạnh đó và ghi +dư trên bản vẽ (layer SD-CATDU), lập bảng theo mã viên: kích thước thiết kế, các cạnh chừa dư (cạnh dài / cạnh ngắn / cạnh xiên), kích thước cắt (đã cộng dư), số lượng; ghi file CSV theo mã viên (_CatDu.csv) và danh sách từng viên kèm tọa độ tâm (_CatDuTungVien.csv).", "steps": ["Chạy SDCATDU, quét chọn các viên (Enter = tất cả trong bản vẽ).", "Nhập số mm chừa dư mặc định, quy tắc theo layer (layer=mm) và khoảng sát (để trống quy tắc = mọi cạnh biên đều chừa dư); tích Vẽ gạch đỏ nếu muốn thấy trên bản vẽ.", "Chọn điểm chèn bảng; file CSV ghi cạnh bản vẽ."], "result": "Gạch đỏ và chữ +dư trên từng cạnh chừa dư (layer SD-CATDU), bảng BẢNG CẮT DƯ SÁT TƯỜNG, file _CatDu.csv.", "note": "Lưu ý: Sau bảng, lệnh hỏi điểm chèn ghi chú rủi ro và ghi 9 mục lên layer SD-CATDU-GHICHU (giữ khi phát hành bản vẽ). Kích thước cắt = kích thước thiết kế + dư x số cạnh chừa dư theo từng hướng, chỉ tính cho cạnh dài (song song cạnh dài nhất) và cạnh ngắn (vuông góc); cạnh xiên được đánh dấu * và không cộng vào kích thước. Viên nguyên không được xét. Lệnh nhận biết cạnh biên bằng cách thử điểm cách cạnh 8 mm: khe ron rộng hơn 8 mm hoặc viên kề nhỏ hơn 8 mm có thể bị nhận sai. Chạy lại lệnh sẽ vẽ lại dấu cũ. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDDUTOAN", "alias": "DTD", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Du toan tien da theo don gia m2 tung ma vat lieu (nho lai), hao hut, cong lat, VAT; bang + CSV", "summary": "Dự toán tiền đá theo đơn giá m². Lệnh tính diện tích lát của từng mã vật liệu từ polyline viên, hỏi đơn giá (đồng/m²) cho từng mã (nhớ lại cho lần sau), hao hụt khi mua (%), đơn giá công lát (đồng/m², tùy chọn) và VAT (%). Diện tích mua = diện tích lát x (1 + hao hụt). Bảng gồm từng mã vật liệu, cộng tiền đá, công lát, VAT và tổng cộng; ghi file CSV. Chạy riêng cho từng phương án bằng cách quét chọn các viên của phương án đó.", "steps": ["Chạy SDDUTOAN, quét chọn các viên của phương án (Enter = tất cả).", "Nhập đơn giá từng mã vật liệu, hao hụt, công lát, VAT.", "Chọn điểm chèn bảng; file CSV ghi cạnh bản vẽ."], "result": "Bảng DỰ TOÁN TIỀN ĐÁ và file _DuToan.csv; đơn giá được nhớ theo mã vật liệu trong bản vẽ.", "note": "Lưu ý: Đây là dự toán theo diện tích, không phải số tấm đá mua thật: tấm thật còn phụ thuộc cách xếp tấm (SDANHDA / SDGACHTK) nên chỉnh hao hụt cho sát. Diện tích tính từ polyline viên (mm bản vẽ), không dùng giá trị diện tích lưu trong viên. Viên không có mã vật liệu hoặc ở vùng X bị bỏ qua. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDPHUONGAN", "alias": "PHA", "group": "Ốp lát đá granite / gạch (còn lại)", "desc": "Phuong an lat A / B tren mot to: nhan + bang ngan (so vien, nguyen / cat, hao hut) + khung in bao ca hai", "summary": "Đặt hai phương án lát (A và B, hai bố cục viên khác nhau của cùng khu vực, đã dựng bằng SDGACH / SDDOCDA và để cạnh nhau trong Model) lên một tờ trình khách: lệnh quét chọn các viên của từng phương án, ghi nhãn PHƯƠNG ÁN A / B phía trên, bảng ngắn phía dưới (tổng số viên và diện tích; viên nguyên, cắt chữ nhật, cắt đặc biệt; viên cắt hẹp; hao hụt ước tính) và vẽ khung in A1 / A3 (như SDKHUNGIN) bao cả hai phương án.", "steps": ["Dựng hai phương án cạnh nhau trong Model (hai khu vực giống nhau, bố cục khác nhau).", "Chạy SDPHUONGAN, chọn khổ giấy và tỷ lệ, điền thông tin khung tên.", "Quét chọn các viên của phương án A rồi của phương án B.", "Chạy SDTAOLAYOUT hoặc SDIN để in tờ."], "result": "Nhãn và bảng ngắn của hai phương án, khung in bao cả hai trên layer SD-KHUNGIN, đã đặt sẵn cài đặt in.", "note": "Lưu ý: Hao hụt ước tính chỉ là phần thừa của viên cắt so với viên nguyên (giả sử mỗi viên cắt dùng hết một viên nguyên), không phải kết quả xếp tấm đá (nesting): số thật ra bằng SDRAITAM / SDTKDA. Hai phương án không vừa tờ ở tỷ lệ đã chọn thì lệnh báo cần tăng tỷ lệ hoặc đổi khổ và không vẽ khung (nhãn và bảng vẫn có). Các lệnh chỉ đọc viên có dữ liệu SD_TILE. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDPANEL", "alias": "BLN", "group": "Tiện ích", "desc": "Bang lenh SDOpLat (hop thoai)", "summary": "Bảng lệnh dạng hộp thoại.", "steps": ["Chọn nhóm lệnh.", "Chọn lệnh, bấm OK hoặc nhấp đúp."], "result": "Lệnh được chạy ngay sau khi đóng hộp thoại.", "note": "", "extra": ""}, {"code": "SDHELP", "alias": "HDL", "group": "Tiện ích", "desc": "Danh sach lenh", "summary": "In danh sách lệnh và lệnh tắt ra dòng lệnh.", "steps": ["Gõ lệnh."], "result": "Danh sách theo nhóm: lệnh, lệnh tắt, mô tả.", "note": "", "extra": ""}, {"code": "SDTUNAP", "alias": "AUL", "group": "Tiện ích", "desc": "Bat / tat tu nap SDOpLat moi khi mo AutoCAD (khong can APPLOAD lai)", "summary": "Làm cho ShopDrawing tự nạp mỗi khi mở AutoCAD hoặc bản vẽ mới, không phải APPLOAD lại (lỗi lệnh 'mất' sau khi mở lại AutoCAD là do chỉ APPLOAD một lần, APPLOAD không nhớ sang phiên sau). Lệnh ghi một khối có đánh dấu vào acaddoc.lsp trong thư mục Support của người dùng và thêm thư mục plugin vào thư mục tin cậy.", "steps": ["Nạp ShopDrawing.lsp một lần (APPLOAD).", "Chạy SDTUNAP; nếu không tự tìm thấy file, chọn ShopDrawing.lsp.", "Mở lại AutoCAD kiểm tra: lệnh SDHELP chạy ngay. Muốn gỡ: chạy SDTUNAP, chọn Gỡ."], "result": "Mỗi bản vẽ mở ra đều tự nạp ShopDrawing.lsp; dòng lệnh báo đường dẫn đã ghi.", "note": "Lưu ý: Đừng đổi chỗ hoặc xóa thư mục ShopDrawing sau khi bật (chạy SDTUNAP lại để ghi đường dẫn mới). Tên thư mục nên là chữ không dấu. Cần quyền ghi thư mục Support (%AppData%\\Autodesk\\...\\Support). SDMENU cũng tự nạp qua ShopDrawing.mnl; SDTUNAP là cách nhẹ hơn, không cần menu. Chưa thử trên AutoCAD thật.", "extra": ""}, {"code": "SDMENU", "alias": "CMN", "group": "Tiện ích", "desc": "Cai menu + toolbar + Ribbon", "summary": "Cài menu + 6 toolbar + tab Ribbon ShopDrawing, thêm Support Path và Trusted Locations, tự nạp LISP mỗi bản vẽ.", "steps": ["Chọn file ShopDrawing.mnu trong thư mục dist (nếu chưa có trong Support Path). ShopDrawingRibbon.cuix cùng thư mục được nạp kèm."], "result": "Menu ShopDrawing, toolbar SD … và tab Ribbon ShopDrawing (6 panel); gỡ cả hai bằng SDMENUXOA.", "note": "Lưu ý: Không thấy tab: nhấp phải vùng Ribbon → Show Tabs → tích ShopDrawing. Chỉ cần Ribbon: CUILOAD → ShopDrawingRibbon.cuix.", "extra": ""}, {"code": "SDDLG", "alias": "HTN", "group": "Tiện ích", "desc": "Bat / tat hop thoai nhap lieu", "summary": "Bật / tắt hộp thoại nhập liệu của các lệnh.", "steps": ["Co = mỗi lệnh mở hộp thoại nhập thông số; Khong = hỏi lần lượt trên dòng lệnh."], "result": "Thiết lập lưu trong bản vẽ.", "note": "Lưu ý: Trong hộp thoại có nút 'Nhap tren dong lenh' để nhập theo kiểu cũ cho riêng lần đó.", "extra": ""}], "common": ["Chạy không báo lỗi (không có \"error:\" hay bản vẽ treo)", "Hộp thoại mở đúng, nhập số/ký tự tiếng Việt không vỡ", "Kết quả đúng như mô tả (kích thước, layer, số lượng)", "Esc giữa chừng: không để đối tượng dở dang, lệnh sau vẫn chạy", "U hoàn tác cả lệnh một lần"]};
const KEY='sdoplat-checklist-v1';let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const items=[];
function card(id,title,body,sub){items.push(id);return `<div class="card" data-id="${id}"><h3>${title}</h3>${sub?`<div class="mut">${sub}</div>`:''}${body}
<div class="row"><span class="st">${[['ok','Đạt'],['bad','Lỗi'],['skip','Bỏ qua']].map(([k,l])=>`<button data-k="${k}" class="${k}">${l}</button>`).join(' ')}</span>
<textarea rows="1" placeholder="Ghi chú / lỗi / dòng lệnh" data-n="${id}"></textarea></div></div>`}
let out='';
D.sections.forEach((s,i)=>{out+=`<h2>${esc(s[0])}</h2>`;s[1].forEach((t,j)=>{out+=card(`s${i}.${j}`,esc(t),'')})});
out+='<h2>Từng lệnh</h2><p class="mut">Mỗi lệnh kiểm tra thêm 5 mục chung: '+D.common.map(esc).join('; ')+'.</p>';
let grp='';
D.cmds.forEach(c=>{if(c.group!==grp){grp=c.group;out+=`<h2>${esc(grp)}</h2>`}
 const b=`<p>${esc(c.summary||c.desc)}</p>`+(c.steps.length?'<ol>'+c.steps.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>':'')+(c.result?`<p><b>Kết quả mong đợi:</b> ${esc(c.result)}</p>`:'')+(c.extra?`<p><b>Thử thêm:</b> ${esc(c.extra)}</p>`:'')+(c.note?`<details><summary>Lưu ý của tài liệu</summary><p class="mut">${esc(c.note)}</p></details>`:'');
 out+=card(c.code,`<code>${c.code}</code> ${c.alias&&c.alias!==c.code?`<span class="mut">(lệnh tắt ${c.alias})</span>`:''}`,b,'')});
document.getElementById('root').innerHTML=out;
function paint(){document.querySelectorAll('.card').forEach(el=>{const id=el.dataset.id,v=(S[id]||{});el.querySelectorAll('.st button').forEach(b=>b.classList.toggle('on',v.s===b.dataset.k));const t=el.querySelector('textarea');if(document.activeElement!==t)t.value=v.n||''});
 let ok=0,bad=0,sk=0;items.forEach(i=>{const s=(S[i]||{}).s;if(s==='ok')ok++;else if(s==='bad')bad++;else if(s==='skip')sk++});
 document.getElementById('sum').textContent=`Đạt ${ok} · Lỗi ${bad} · Bỏ qua ${sk} · Còn ${items.length-ok-bad-sk} / ${items.length}`;filter()}
function filter(){const f=document.getElementById('flt').value;document.querySelectorAll('.card').forEach(el=>{const s=(S[el.dataset.id]||{}).s;el.style.display=!f||(f==='none'?!s:s===f)?'':'none'});
 document.querySelectorAll('#root h2').forEach(h=>{let n=h.nextElementSibling,any=false,hasCard=false;while(n&&n.tagName!=='H2'){if(n.classList.contains('card')){hasCard=true;if(n.style.display!=='none')any=true}n=n.nextElementSibling}h.style.display=(!hasCard||any)?'':'none'})}
document.getElementById('root').addEventListener('click',e=>{const b=e.target.closest('.st button');if(!b)return;const id=b.closest('.card').dataset.id;S[id]=S[id]||{};S[id].s=S[id].s===b.dataset.k?'':b.dataset.k;save();paint()});
document.getElementById('root').addEventListener('input',e=>{if(e.target.dataset.n){const id=e.target.dataset.n;S[id]=S[id]||{};S[id].n=e.target.value;save()}});
document.getElementById('flt').onchange=filter;
document.getElementById('rst').onclick=()=>{if(confirm('Xóa toàn bộ kết quả đã ghi?')){S={};save();paint()}};
document.getElementById('exp').onclick=()=>{const L={ok:'Dat',bad:'Loi',skip:'Bo qua','':'Chua thu'};const rows=[['Muc','Ket qua','Ghi chu']];
 document.querySelectorAll('.card').forEach(el=>{const id=el.dataset.id,v=S[id]||{};rows.push([el.querySelector('h3').textContent.trim(),L[v.s||''],v.n||''])});
 const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ket-qua-thu-SDOpLat.csv';a.click()};
paint();
</script></main></body></html>
