<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tạo file cài đặt SDOpLat</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#d9d9d3;--acc:#1f5aa8}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--fg:#ececE8;--mut:#9a9a93;--card:#222220;--bd:#3a3a36;--acc:#8ab6ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px}label{display:block;margin:14px 0 4px;font-weight:600}input[type=text]{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:9px 16px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:not-allowed}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-top:14px}.mut{color:var(--mut);font-size:14px}.warn{color:#b3261e}.ok{color:#2b7a57}
</style></head><body><main>
<h1>Tạo file cài đặt SDOpLat</h1>
<p class="mut">Công cụ của <b>người bán</b>. Chọn thư mục gói đã có <code>SDOpLat.fas</code>; công cụ đóng gói tất cả thành <b>một file</b> <code>SDOpLat-Setup.lsp</code> để gửi khách. Xử lý ngay trong trình duyệt, không gửi dữ liệu đi đâu.</p>
<label for="dir">Thư mục gói (chứa SDOpLat.fas, SDOpLat.mnu, Maps…)</label><input id="dir" type="file" webkitdirectory directory multiple>
<label for="ver">Số phiên bản</label><input id="ver" type="text" value="1.0.0">
<label for="main">File chính (đã biên dịch)</label><input id="main" type="text" value="SDOpLat.fas">
<button id="go" disabled>Tạo SDOpLat-Setup.lsp</button>
<div class="box" id="out">Chưa chọn thư mục.</div>
<script>
const TPL=";;; ==========================================================================\n;;;  CAI DAT TU DONG - Op Lat Tools v@@VER@@\n;;;  Cach dung: mo AutoCAD, KEO THA file nay vao cua so AutoCAD (hoac go APPLOAD, chon file nay, bam Load).\n;;;  File tu giai ma toan bo goi vao\n;;;    %APPDATA%\\Autodesk\\ApplicationPlugins\\SDOpLat.bundle\\Contents\n;;;  roi cai menu + toolbar. Cac lan mo AutoCAD sau plugin tu nap (co the can khoi dong lai AutoCAD 1 lan).\n;;;  Khong can quyen quan tri. Go cai dat: xoa thu muc SDOpLat.bundle va go SDMENUXOA.\n;;; ==========================================================================\n(vl-load-com)\n(setq *SDSU:VER* \"@@VER@@\" *SDSU:OK* 0 *SDSU:BAD* nil *SDSU:ERR1* nil)\n\n(defun sdsu:mkdirs (path / parts cur)\n  ;; tao tung cap thu muc (vl-mkdir chi tao 1 cap)\n  (setq parts (sdsu:split path \"\\\\\") cur (car parts))\n  (foreach p (cdr parts)\n    (setq cur (strcat cur \"\\\\\" p))\n    (if (not (vl-file-directory-p cur)) (vl-mkdir cur)))\n  (vl-file-directory-p path))\n\n(defun sdsu:split (s sep / r i k)\n  (setq r nil i 1 k 1)\n  (while (<= i (strlen s))\n    (if (= (substr s i 1) sep)\n      (progn (setq r (cons (substr s k (- i k)) r) k (1+ i))))\n    (setq i (1+ i)))\n  (reverse (cons (substr s k) r)))\n\n(defun sdsu:root () (strcat (getenv \"APPDATA\") \"\\\\Autodesk\\\\ApplicationPlugins\\\\SDOpLat.bundle\"))\n(defun sdsu:dir () (strcat (sdsu:root) \"\\\\Contents\"))\n\n;; Giai ma base64 -> file nhi phan (MSXML + ADODB.Stream, co san tren Windows)\n(defun sdsu:fail (msg)\n  (setq *SDSU:FAIL* t)\n  (if (not *SDSU:ERR1*) (progn (setq *SDSU:ERR1* t) (princ (strcat \"\\n[SETUP] Loi ghi file: \" msg))))\n  (princ))\n\n;; Moi file: (sdsu:f ten kich-thuoc) mo luong ghi, nhieu (sdsu:c \"doan base64 ngan\"), (sdsu:e) dong va kiem tra kich thuoc.\n;; Doan ngan (400 ky tu, nho hon chuoi dai nhat da biet nap duoc trong plugin: 430) vi AutoLISP gioi han do dai chuoi trong file; moi doan tu giai ma roi ghi noi tiep.\n(defun sdsu:mkobj (ids / o r)\n  ;; thu lan luot cac ProgID; MSXML 6.0 KHONG ho tro giai ma base64 (dataType) nen dung 3.0 / ban khong so\n  (foreach id ids\n    (if (not o)\n      (progn (setq r (vl-catch-all-apply 'vlax-create-object (list id)))\n             (if (and r (not (vl-catch-all-error-p r))) (setq o r)))))\n  o)\n\n(defun sdsu:open (st / ok e args r)\n  ;; ADODB.Stream.Open co 5 tham so tuy chon; mot so ban AutoCAD bao \"too few actual parameters\" neu khong truyen du\n  ;; -> thu lan luot: khong doi so, roi 1, 2, 3, 5 bien the rong\n  (setq e (vlax-make-variant))\n  (foreach args (list nil (list e) (list e e) (list e e e) (list e e e e e))\n    (if (not ok)\n      (progn\n        (setq r (vl-catch-all-apply 'vlax-invoke-method (append (list st 'Open) args)))\n        (if (not (vl-catch-all-error-p r)) (setq ok t)))))\n  (if (not ok) (vlax-invoke-method st 'Open (vlax-make-variant) (vlax-make-variant) (vlax-make-variant) (vlax-make-variant) (vlax-make-variant)))\n  ok)\n\n(defun sdsu:f (rel size / r)\n  (setq *SDSU:REL* rel *SDSU:SIZE* size *SDSU:FAIL* nil *SDSU:PATH* (strcat (sdsu:dir) \"\\\\\" rel)\n        *SDSU:XML* nil *SDSU:EL* nil *SDSU:ST* nil *SDSU:STEP* \"bat dau\")\n  (if (not *SDSU:ABORT*)\n    (progn\n      (setq *SDSU:STEP* \"tao thu muc\")\n      (sdsu:mkdirs (vl-filename-directory *SDSU:PATH*))\n      (setq *SDSU:STEP* \"tao MSXML\")\n      (setq *SDSU:XML* (sdsu:mkobj '(\"MSXML2.DOMDocument.3.0\" \"MSXML2.DOMDocument\" \"Msxml2.DOMDocument.4.0\")))\n      (if (not *SDSU:XML*)\n        (sdsu:fail \"khong tao duoc MSXML (MSXML2.DOMDocument) tren may nay\")\n        (progn\n          (setq r (vl-catch-all-apply\n                    '(lambda ()\n                       (setq *SDSU:STEP* \"createElement\")\n                       (setq *SDSU:EL* (vlax-invoke-method *SDSU:XML* 'createElement \"b64\"))\n                       (setq *SDSU:STEP* \"dataType\")\n                       (vlax-put-property *SDSU:EL* 'dataType \"bin.base64\")\n                       (setq *SDSU:STEP* \"tao ADODB.Stream\")\n                       (setq *SDSU:ST* (vlax-create-object \"ADODB.Stream\"))\n                       (setq *SDSU:STEP* \"Stream.Type\")\n                       (vlax-put-property *SDSU:ST* 'Type 1)\n                       (setq *SDSU:STEP* \"Stream.Open\")\n                       (sdsu:open *SDSU:ST*))\n                    nil))\n          (if (vl-catch-all-error-p r)\n            (sdsu:fail (strcat \"buoc [\" *SDSU:STEP* \"]: \" (vl-catch-all-error-message r))))))))\n  (princ))\n\n(defun sdsu:c (b64 / r)\n  (if (and (not *SDSU:ABORT*) (not *SDSU:FAIL*))\n    (progn\n      (setq r (vl-catch-all-apply\n                '(lambda ()\n                   (setq *SDSU:STEP* \"gan text\")\n                   (vlax-put-property *SDSU:EL* 'text b64)\n                   (setq *SDSU:STEP* \"nodeTypedValue\")\n                   (setq *SDSU:BYTES* (vlax-get-property *SDSU:EL* 'nodeTypedValue))\n                   (setq *SDSU:STEP* \"Stream.Write\")\n                   (vlax-invoke-method *SDSU:ST* 'Write *SDSU:BYTES*))\n                nil))\n      (if (vl-catch-all-error-p r) (sdsu:fail (strcat \"buoc [\" *SDSU:STEP* \"]: \" (vl-catch-all-error-message r))))))\n  (princ))\n\n(defun sdsu:e ( / r)\n  (if (not *SDSU:ABORT*)\n    (progn\n      (if (and *SDSU:ST* (not *SDSU:FAIL*))\n        (progn\n          (setq *SDSU:STEP* \"SaveToFile\")\n          (setq r (vl-catch-all-apply '(lambda () (vlax-invoke-method *SDSU:ST* 'SaveToFile *SDSU:PATH* 2)) nil))\n          (if (vl-catch-all-error-p r) (sdsu:fail (strcat \"buoc [\" *SDSU:STEP* \"]: \" (vl-catch-all-error-message r))))))\n      (if *SDSU:ST* (progn (vl-catch-all-apply '(lambda () (vlax-invoke-method *SDSU:ST* 'Close)) nil)\n                           (vl-catch-all-apply 'vlax-release-object (list *SDSU:ST*))))\n      (if *SDSU:XML* (vl-catch-all-apply 'vlax-release-object (list *SDSU:XML*)))\n      (if (and (not *SDSU:FAIL*) (findfile *SDSU:PATH*) (= (vl-file-size *SDSU:PATH*) *SDSU:SIZE*))\n        (setq *SDSU:OK* (1+ *SDSU:OK*))\n        (setq *SDSU:BAD* (cons *SDSU:REL* *SDSU:BAD*)))))\n  (princ))\n\n(defun sdsu:xml ( / f p)\n  (setq p (strcat (sdsu:root) \"\\\\PackageContents.xml\") f (open p \"w\"))\n  (if f\n    (progn\n      (foreach l '(\"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?>\"\n                   \"<ApplicationPackage SchemaVersion=\\\"1.0\\\" ProductType=\\\"Application\\\" Name=\\\"SDOpLat\\\" AppVersion=\\\"@@VER@@\\\" Description=\\\"Op Lat Tools\\\" AppNameSpace=\\\"sdoplat.local\\\" Author=\\\"SDOpLat\\\">\"\n                   \"  <CompanyDetails Name=\\\"SDOpLat\\\" />\"\n                   \"  <Components Description=\\\"Op Lat Tools\\\">\"\n                   \"    <RuntimeRequirements OS=\\\"Win32|Win64\\\" Platform=\\\"AutoCAD*\\\" SeriesMin=\\\"R18.0\\\" />\"\n                   \"    <ComponentEntry AppName=\\\"SDOpLat\\\" Version=\\\"@@VER@@\\\" ModuleName=\\\"./Contents/@@MAIN@@\\\" AppDescription=\\\"Op Lat Tools\\\" LoadOnCommandInvocation=\\\"False\\\" LoadOnAutoCADStartup=\\\"True\\\" />\"\n                   \"  </Components>\"\n                   \"</ApplicationPackage>\")\n        (write-line l f))\n      (close f) t)))\n\n(defun sdsu:clean ( / b)\n  ;; xoa ban menu da chuyen doi cua lan cai truoc de AutoCAD chuyen lai tu .mnu moi\n  (foreach e '(\"cuix\" \"mns\" \"mnc\" \"mnr\")\n    (setq b (strcat (sdsu:dir) \"\\\\SDOpLat.\" e))\n    (if (findfile b) (vl-catch-all-apply 'vl-file-delete (list b)))))\n\n(defun sdsu:begin ( / d)\n  (princ \"\\n[SETUP] Op Lat Tools v@@VER@@: dang giai ma va cai dat (khoang vai chuc giay)...\")\n  ;; ban ShopDrawing cu dang nap trong phien nay (co the che ban moi sau khi mo lai AutoCAD)\n  (setq *SDSU:OLDVER* (if (and (boundp '*SD:VER*) *SD:VER* (/= *SD:VER* \"@@VER@@\")) *SD:VER* nil))\n  (if *SDSU:OLDVER*\n    (princ (strcat \"\\n[SETUP] CANH BAO: dang nap ban ShopDrawing cu v\" *SDSU:OLDVER* \". Sau khi cai xong, go bo ban cu khoi Support Path / Startup Suite / acaddoc.lsp / menu SHOPDRAWING, neu khong AutoCAD co the tiep tuc nap ban cu.\")))\n  (setq *SDSU:ABORT* nil)\n  (cond\n    ((not (and (boundp 'vlax-create-object) vlax-create-object))\n     (setq *SDSU:ABORT* t)\n     (princ \"\\n[SETUP] Ban AutoCAD nay khong ho tro COM (vi du AutoCAD LT) nen khong cai tu dong duoc.\"))\n    ((not (sdsu:mkdirs (sdsu:dir)))\n     (setq *SDSU:ABORT* t)\n     (princ (strcat \"\\n[SETUP] Khong tao duoc thu muc \" (sdsu:dir))))\n    (t (sdsu:clean)))\n  (princ))\n\n(defun sdsu:end ()\n  (if (not *SDSU:ABORT*) (progn (sdsu:xml) (sdsu:finish)))\n  (princ))\n\n(defun sdsu:finish ( / mn r)\n  (if *SDSU:BAD*\n    (princ (strcat \"\\n[SETUP] LOI: \" (itoa (length *SDSU:BAD*)) \" file chua ghi duoc: \" (apply 'strcat (mapcar '(lambda (x) (strcat x \"  \")) (reverse *SDSU:BAD*)))\n                   \"\\n        Dong cac chuong trinh dang mo file, thu lai; neu van loi, bao nha cung cap.\"))\n    (progn\n      (princ (strcat \"\\n[SETUP] Da ghi \" (itoa *SDSU:OK*) \" file vao \" (sdsu:dir)))\n      ;; nap ngay va cai menu + toolbar\n      (setq mn (strcat (sdsu:dir) \"\\\\@@MAIN@@\"))\n      (if (findfile mn) (vl-catch-all-apply 'load (list mn)))\n      (cond\n        ((and (boundp 'sd:add-path) (boundp 'sd:mg-load) (findfile (strcat (sdsu:dir) \"\\\\SDOpLat.mnu\")))\n         ;; them thu muc vao Support Path + Trusted Locations, nap menu va dua vao thanh menu\n         (vl-catch-all-apply 'sd:add-path (list (sdsu:dir)))\n         (setq r (vl-catch-all-apply 'sd:mg-load (list (strcat (sdsu:dir) \"\\\\SDOpLat.mnu\") \"SDOPLAT\")))\n         (if (and r (not (vl-catch-all-error-p r)))\n           (progn (vl-catch-all-apply 'sd:menu-bar (list \"SDOPLAT\"))\n                  (princ \"\\n[SETUP] Da nap menu + toolbar SDOpLat.\"))\n           (princ \"\\n[SETUP] Chua nap duoc menu: go SDMENU de nap lai.\")))\n        (t (princ \"\\n[SETUP] Chua nap duoc lenh: khoi dong lai AutoCAD roi go SDMENU.\")))\n      (princ \"\\n[SETUP] XONG. Khoi dong lai AutoCAD mot lan de plugin tu nap cho cac lan sau.\")\n      (princ \"\\n        Go SDPANEL de xem bang lenh, SDKICHHOAT de kich hoat. Tro ly hoi dap: mo TroLyOpLat.html trong thu muc cai dat.\")))\n  (princ))\n\n(sdsu:begin)\n@@FILES@@\n(sdsu:end)\n(princ)\n";
const $=id=>document.getElementById(id);let files=[];
$('dir').onchange=e=>{files=[...e.target.files];$('go').disabled=!files.length;$('out').textContent=files.length?`Đã chọn ${files.length} file.`:'Chưa chọn thư mục.'};
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
$('go').onclick=async()=>{const out=$('out'),ver=$('ver').value.trim()||'1.0.0',main=$('main').value.trim()||'SDOpLat.fas';out.className='box';
 const list=files.map(f=>({rel:f.webkitRelativePath.split('/').slice(1).join('\\'),f})).filter(x=>x.rel);
 if(!list.some(x=>x.rel===main)){out.className='box warn';out.textContent='Không thấy '+main+' trong thư mục. Hãy biên dịch .fas trước và chọn đúng thư mục chứa nó.';return}
 const skip=list.filter(x=>x.rel.toLowerCase().endsWith('.lsp'));const use=list.filter(x=>!x.rel.toLowerCase().endsWith('.lsp'));
 use.sort((a,b)=>(a.rel===main?0:1)-(b.rel===main?0:1)||(a.rel<b.rel?-1:a.rel>b.rel?1:0));
 const blocks=[];let total=0;
 for(let i=0;i<use.length;i++){out.textContent=`Đang xử lý ${i+1}/${use.length}: ${use[i].rel}`;const buf=await use[i].f.arrayBuffer();total+=buf.byteLength;const s=b64(buf);const ch=[];for(let k=0;k<s.length;k+=400)ch.push(s.slice(k,k+400));
  const esc=use[i].rel.replace(/\\/g,'\\\\');blocks.push(`(sdsu:f "${esc}" ${buf.byteLength})`+(ch.length?'\n'+ch.map(c=>`(sdsu:c "${c}")`).join('\n'):'')+'\n(sdsu:e)')}
 const text=TPL.split('@@VER@@').join(ver).split('@@MAIN@@').join(main).replace('@@FILES@@',()=>blocks.join('\n')).replace(/\r?\n/g,'\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='SDOpLat-Setup.lsp';a.click();
 out.className='box ok';out.innerHTML=`Xong: đóng gói ${use.length} file (${(total/1048576).toFixed(1)} MB) → SDOpLat-Setup.lsp (${(text.length/1048576).toFixed(1)} MB).`+(skip.length?`<br><span class="warn">Đã bỏ qua ${skip.length} file .lsp (nguồn) để không lộ mã: ${skip.map(x=>x.rel).join(', ')}</span>`:'')}
</script></main></body></html>
